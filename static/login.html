<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — Visual</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
.wrap {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
}

#login-view {
  width: 100%; max-width: 380px;
  padding: 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  box-shadow: var(--shadow);
}
#login-view h1 { font-size: 20px; margin-bottom: 6px; }
#login-view .sub { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
#login-view .field { margin-bottom: 14px; }
#login-view label { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text-secondary); }
#login-view .row { display: flex; gap: 10px; margin-top: 18px; }
#login-view .err { color: var(--up-color); font-size: 13px; margin-top: 12px; min-height: 18px; }

#login-view input { width: 100%; }
button.primary { flex: 1; }

.theme-toggle {
  position: fixed; top: 12px; right: 12px;
  font-size: 16px;
}
</style>
<script src="/js/theme.js"></script>
<script src="/js/api.js"></script>
</head>
<body>

<button class="theme-toggle ghost" id="theme-btn" onclick="toggleTheme()" title="切换主题">🌙</button>

<div class="wrap">
  <div id="login-view">
    <h1>📈 Visual</h1>
    <div class="sub">登录后可查看 K线、交易记录与量化模型。</div>
    <div id="form-login">
      <div class="field"><label>用户名</label><input id="login-username" autocomplete="username"></div>
      <div class="field"><label>密码</label><input id="login-password" type="password" autocomplete="current-password"></div>
      <div class="row"><button class="primary" onclick="doLogin()">登 录</button></div>
    </div>
    <div class="err" id="auth-err"></div>
  </div>
</div>

<script>
async function api(path, options) {
  return VisualApi.api(path, options);
}

function setAuthErr(msg) { document.getElementById('auth-err').textContent = msg || ''; }

// next 回跳参数: 仅接受以 "/" 开头且非 "//" 的值, 防开放重定向
function resolveNext() {
  const next = new URLSearchParams(location.search).get('next') || '/';
  if (next.startsWith('/') && !next.startsWith('//')) return next;
  return '/';
}

async function doLogin() {
  setAuthErr('');
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    location.href = resolveNext();
  } catch (e) { setAuthErr(e.message); }
}

['login-username', 'login-password'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
});

VisualTheme.init({ buttonId: 'theme-btn' });

(async function init() {
  try {
    await api('/api/auth/me');
    location.href = resolveNext();
  } catch (e) {
    document.getElementById('login-username').focus();
  }
})();
</script>
</body>
</html>
