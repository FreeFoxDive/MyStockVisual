<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚙️ 管理后台 — Visual</title>
<link rel="stylesheet" href="/css/theme.css">
<style>
/* ═══════════════ 主视图 (页面专属) ═══════════════ */
#main-view { padding: 20px 24px; max-width: 1200px; margin: 0 auto; }

.section-title { font-size: 15px; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; scroll-margin-top: 70px; }
.section-title .bar { width: 4px; height: 16px; background: var(--btn-active); border-radius: 2px; }

.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-card); }
table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 600px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { background: var(--bg-panel); color: var(--text-secondary); font-weight: 600; position: sticky; top: 0; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--btn-hover); }
.badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; }
.badge.open { background: rgba(var(--up-rgb), 0.12); color: var(--up-text); }
.badge.closed { background: rgba(var(--down-rgb), 0.12); color: var(--down-text); }
.reason-cell { max-width: 260px; white-space: normal; font-size: 12px; color: var(--text-secondary); }
.progress { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 0 0 10px; }
.progress .fill { height: 100%; background: var(--btn-active); width: 0; transition: width 0.3s; }
.empty { text-align: center; color: var(--text-secondary); padding: 30px 0; }
</style>
<script src="/js/theme.js"></script>
<script>
/* 主题预置: 首帧渲染前应用已存/系统主题, 消除暗色用户刷新闪白 */
(function () {
  var hasStored = false;
  try { hasStored = !!(localStorage.getItem(VisualTheme.KEY) || localStorage.getItem(VisualTheme.LEGACY_KEY)); } catch (e) {}
  var t = hasStored ? VisualTheme.load().theme
    : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
})();
</script>
<script src="/js/api.js"></script>
</head>
<body>

<!-- ═══════════════ 顶栏 ═══════════════ -->
<div id="toolbar">
  <span class="title">⚙️ 管理后台</span>
  <button onclick="location.href='/trades.html'" title="返回交易记录">← 交易记录</button>
  <span class="spacer"></span>
  <span class="user" id="toolbar-user"></span>
  <button onclick="location.href='/quant.html'" title="量化模型管理 / 信号忽视记录">📊 量化管理</button>
  <button id="btn-theme" onclick="toggleTheme()" title="切换主题">🌙</button>
  <button id="btn-logout" class="danger" onclick="doLogout()" style="display:none">退出登录</button>
</div>

<!-- ═══════════════ 主视图 ═══════════════ -->
<div id="main-view" style="display:none">
  <div class="section-title" id="users"><span class="bar"></span>用户管理
    <span style="flex:1"></span>
    <button class="primary" onclick="openAddUserModal()">＋ 添加用户</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>用户名</th><th>角色</th><th>监控</th><th>创建时间</th><th style="width:180px">操作</th></tr>
      </thead>
      <tbody id="admin-tbody"></tbody>
    </table>
  </div>

  <div class="section-title" id="factors"><span class="bar"></span>因子库
    <span style="flex:1"></span>
    <span id="fac-updated" style="font-size:12px;color:var(--text-secondary)"></span>
    <button onclick="rebuildFactors(false)">手动重建</button>
    <button onclick="rebuildFactors(true)">强制重建</button>
  </div>
  <div class="hint" id="fac-status" style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">加载中…</div>
  <div class="progress" id="fac-prog-wrap" style="display:none"><div class="fill" id="fac-prog-fill"></div></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>交易日</th><th>状态</th><th>入表</th><th>拉取</th><th>缺失</th>
            <th>进度</th><th>完成时间</th><th>异常</th></tr>
      </thead>
      <tbody id="fac-tbody"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="section-title" id="screener-queue"><span class="bar"></span>选股队列
    <span style="flex:1"></span>
    <span id="sq-updated" style="font-size:12px;color:var(--text-secondary)"></span>
  </div>  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>用户</th><th>条件</th><th>状态</th><th>进度</th><th>入队</th><th>开始</th><th style="width:90px">操作</th></tr>
      </thead>
      <tbody id="sq-tbody"><tr><td colspan="7" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <div class="section-title"><span class="bar"></span>最近完成的选股</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>用户</th><th>条件</th><th>状态</th><th>命中</th><th>完成时间</th></tr>
      </thead>
      <tbody id="sr-tbody"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<!-- ═══════════════ 用户管理弹窗 (仅 admin) ═══════════════ -->
<div class="modal-mask" id="admin-modal-mask">
  <div class="modal">
    <h2 id="admin-modal-title">添加用户</h2>
    <div id="admin-add-form">
      <div class="field"><label>用户名 (2~32字符)</label><input id="au-username" autocomplete="off"></div>
      <div class="field"><label>密码 (至少6位)</label><input id="au-password" type="password" autocomplete="new-password"></div>
    </div>
    <div id="admin-reset-form" style="display:none">
      <div class="field"><label>为 <b id="au-reset-username"></b> 设置新密码 (至少6位)</label><input id="au-reset-password" type="password" autocomplete="new-password"></div>
    </div>
    <div class="err" id="admin-modal-err"></div>
    <div class="actions">
      <button onclick="closeAdminModal()">取消</button>
      <button class="primary" onclick="saveAdminAction()">保存</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// 管理后台 (用户管理) — 仅管理员可访问
// 量化模型管理 / 信号忽视记录 见 quant.html
// ═══════════════════════════════════════════════════════════════
const state = { user: null };

function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function api(path, options = {}) {
  return VisualApi.api(path, options, { onUnauthorized: redirectToLogin });
}

function redirectToLogin() {
  location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
}

async function checkAuth() {
  try {
    const data = await api('/api/auth/me');
    if (!data.is_admin) { location.href = '/trades.html'; return; }
    state.user = { username: data.username, is_admin: data.is_admin };
    document.getElementById('toolbar-user').textContent = '👤 ' + state.user.username;
    document.getElementById('btn-logout').style.display = '';
    document.getElementById('main-view').style.display = '';
    await loadUsers();
    loadScreenerQueue();
    loadFactors();
    applyHash();
  } catch (e) {
    redirectToLogin();
  }
}

async function doLogout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  redirectToLogin();
}

// ═══════════════ 用户管理 ═══════════════
let adminModalMode = 'add';   // 'add' | 'reset'
let adminModalTargetId = null;
let adminUsers = [];

async function loadUsers() {
  try {
    const users = await api('/api/admin/users');
    adminUsers = users;
    document.getElementById('admin-tbody').innerHTML = users.map(u => {
      const mon = u.is_admin
        ? '<span class="badge">恒开</span>'
        : `<label style="cursor:pointer;font-size:13px"><input type="checkbox" ${u.monitor_enabled ? 'checked' : ''} onchange="toggleMonitor(${u.id}, this.checked)"> 授权</label>`;
      return `
      <tr>
        <td>${escHtml(u.username)}${u.is_admin ? ' <span class="badge">管理员</span>' : ''}</td>
        <td>${u.is_admin ? '管理员' : '普通用户'}</td>
        <td>${mon}</td>
        <td>${escHtml(u.created_at)}</td>
        <td>${u.is_admin ? '' : `
          <button onclick="openResetModal(${u.id})">重置密码</button>
          <button class="danger" onclick="deleteUser(${u.id})">删除</button>`}
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    document.getElementById('admin-tbody').innerHTML = `<tr><td colspan="5">加载失败：${escHtml(e.message)}</td></tr>`;
  }
}

async function toggleMonitor(id, enabled) {
  try {
    await api('/api/admin/users/' + id + '/monitor', {
      method: 'POST',
      body: JSON.stringify({ enabled }),
    });
    const u = adminUsers.find(x => x.id === id);
    if (u) u.monitor_enabled = enabled;
  } catch (e) {
    alert('设置失败：' + e.message);
    await loadUsers();
  }
}

function openAddUserModal() {
  adminModalMode = 'add';
  adminModalTargetId = null;
  document.getElementById('admin-modal-title').textContent = '添加用户';
  document.getElementById('admin-add-form').style.display = '';
  document.getElementById('admin-reset-form').style.display = 'none';
  document.getElementById('au-username').value = '';
  document.getElementById('au-password').value = '';
  document.getElementById('admin-modal-err').textContent = '';
  document.getElementById('admin-modal-mask').classList.add('show');
  focusFirstInput('admin-modal-mask');
}

function openResetModal(id) {
  const u = adminUsers.find(x => x.id === id);
  adminModalMode = 'reset';
  adminModalTargetId = id;
  document.getElementById('admin-modal-title').textContent = '重置密码';
  document.getElementById('admin-add-form').style.display = 'none';
  document.getElementById('admin-reset-form').style.display = '';
  document.getElementById('au-reset-username').textContent = u ? u.username : '';
  document.getElementById('au-reset-password').value = '';
  document.getElementById('admin-modal-err').textContent = '';
  document.getElementById('admin-modal-mask').classList.add('show');
  focusFirstInput('admin-modal-mask');
}

function closeAdminModal() {
  document.getElementById('admin-modal-mask').classList.remove('show');
  adminModalTargetId = null;
}

async function saveAdminAction() {
  document.getElementById('admin-modal-err').textContent = '';
  try {
    if (adminModalMode === 'add') {
      const username = document.getElementById('au-username').value.trim();
      const password = document.getElementById('au-password').value;
      await api('/api/admin/users', { method: 'POST', body: JSON.stringify({ username, password }) });
    } else {
      const password = document.getElementById('au-reset-password').value;
      await api('/api/admin/users/' + adminModalTargetId + '/reset-password', { method: 'POST', body: JSON.stringify({ password }) });
    }
    closeAdminModal();
    await loadUsers();
  } catch (e) {
    document.getElementById('admin-modal-err').textContent = e.message;
  }
}

async function deleteUser(id) {
  const u = adminUsers.find(x => x.id === id);
  const username = u ? u.username : '该用户';
  if (!confirm(`确认删除用户「${username}」？其全部交易记录将被级联删除，此操作不可撤销。`)) return;
  try {
    await api('/api/admin/users/' + id, { method: 'DELETE' });
    await loadUsers();
  } catch (e) {
    alert(e.message);
  }
}

document.getElementById('admin-modal-mask').addEventListener('click', function (e) {
  if (e.target === this) closeAdminModal();
});
bindEnter('au-username', saveAdminAction);
bindEnter('au-password', saveAdminAction);
bindEnter('au-reset-password', saveAdminAction);

function bindEnter(id, fn) {
  document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') fn(); });
}

// ═══════════════ 选股队列 (全用户可见性, 仅管理员) ═══════════════
function condText(list, mode) {
  const opText = { ">=": "≥", "<=": "≤", ">": ">", "<": "<", "==": "=" };
  const parts = (list || []).map(c => {
    const label = c.label || c.metric;
    if (c.kind === "range") return `${label} ${c.value}~${c.value2}`;
    if (c.kind === "text") return `${label}=${c.value}`;
    if (c.kind === "bool" || c.value == null) return String(label);
    const op = opText[c.op] || c.op || "";
    return `${label} ${op} ${c.value}`.trim();
  });
  return parts.join(mode === "or" ? " 或 " : " 且 ") || "—";
}

function fmtTs(v) {
  return v ? escHtml(String(v).replace('T', ' ').slice(5, 16)) : '—';
}

function runStatusText(r) {
  return { queued: '排队中', running: '扫描中', done: '完成',
           stopped: '已取消', error: '失败' }[r.status] || r.status;
}

let sqTimer = null;

async function loadScreenerQueue() {
  clearTimeout(sqTimer);
  let delay = 30000;
  try {
    const d = await api('/api/admin/screener/runs');
    const queue = d.queue || [];
    delay = queue.length ? 5000 : 30000;   // 有排队才需要密一点刷新
    document.getElementById('sq-tbody').innerHTML = queue.length ? queue.map(r => `
      <tr>
        <td>${escHtml(r.username)}</td>
        <td class="reason-cell">${escHtml(condText(r.conditions, r.mode))}</td>
        <td>${runStatusText(r)}${r.status === 'queued' && r.position ? ` (前面 ${r.position} 个)` : ''}</td>
        <td>${r.total ? `${r.progress || 0}/${r.total}` : '—'}</td>
        <td>${fmtTs(r.queued_at)}</td>
        <td>${fmtTs(r.started_at)}</td>
        <td>${r.status === 'queued' || r.status === 'running'
              ? `<button class="danger" onclick="stopRun(${r.id})">取消</button>` : ''}</td>
      </tr>`).join('') : '<tr><td colspan="7" class="empty">当前没有排队或运行中的任务</td></tr>';

    const recent = d.recent || [];
    document.getElementById('sr-tbody').innerHTML = recent.length ? recent.map(r => `
      <tr>
        <td>${escHtml(r.username)}</td>
        <td class="reason-cell">${escHtml(condText(r.conditions, r.mode))}</td>
        <td>${runStatusText(r)}${r.error ? `: ${escHtml(r.error)}` : ''}</td>
        <td>${r.n_results == null ? '—' : r.n_results}</td>
        <td>${fmtTs(r.done_at)}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">暂无记录</td></tr>';
    document.getElementById('sq-updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('sq-tbody').innerHTML =
      `<tr><td colspan="7" class="empty">加载失败：${escHtml(e.message)}</td></tr>`;
  }
  sqTimer = setTimeout(loadScreenerQueue, delay);
}

async function stopRun(runId) {
  if (!confirm(`确认取消任务 #${runId}？`)) return;
  try {
    await api('/api/screener/stop', { method: 'POST', body: JSON.stringify({ run_id: runId }) });
  } catch (e) {
    alert('取消失败：' + e.message);
  }
  await loadScreenerQueue();
}

// ═══════════════ 因子库 (交易日 18:00 构建; 选股扫描读的就是它) ═══════════════
const FAC_STATE_TEXT = { idle: "未构建", running: "构建中", done: "完成",
                         error: "失败", missing: "未构建" };

let facTimer = null;

async function loadFactors() {
  clearTimeout(facTimer);
  let delay = 60000;
  try {
    const s = await api('/api/factors/status');
    const running = s.state === 'running';
    delay = running ? 5000 : 60000;
    const el = document.getElementById('fac-status');
    const prog = document.getElementById('fac-prog-wrap');
    if (running) {
      prog.style.display = '';
      document.getElementById('fac-prog-fill').style.width = (s.percent || 0) + '%';
      el.textContent = `构建中 ${s.percent || 0}%（阶段 ${s.phase || '-'}，第 ${s.attempts || 1} 次尝试）`
        + ` · 计划时刻 ${s.build_at} · 交易日自动更新`;
    } else {
      prog.style.display = 'none';
      const parts = [
        `最新快照：${s.snapshot_day || '（无）'}`,
        `入表 ${s.n_rows == null ? '-' : s.n_rows} 只`,
        `自动构建 ${s.build_at}（仅交易日）`,
        `单次拉 ${s.bars_count} 根日K`,
      ];
      if (s.state === 'error') parts.push(`⚠ 今日失败：${s.error || ''}（已重试 ${s.attempts || 0} 次）`);
      el.textContent = parts.join(' · ');
    }
    document.getElementById('fac-tbody').innerHTML = (s.last_days || []).map(r => `
      <tr>
        <td>${escHtml(r.day)}</td>
        <td>${FAC_STATE_TEXT[r.state] || escHtml(r.state)}</td>
        <td>${r.n_rows == null ? '—' : r.n_rows}</td>
        <td>${r.n_symbols == null ? '—' : r.n_symbols}</td>
        <td>${r.n_missing == null ? '—' : r.n_missing}</td>
        <td>${r.percent == null ? '—' : r.percent + '%'}</td>
        <td>${fmtTs(r.done_at)}</td>
        <td class="reason-cell">${escHtml(r.error || '')}</td>
      </tr>`).join('') || '<tr><td colspan="8" class="empty">暂无记录</td></tr>';
    document.getElementById('fac-updated').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch (e) {
    document.getElementById('fac-status').textContent = '因子库状态加载失败：' + e.message;
  }
  facTimer = setTimeout(loadFactors, delay);
}

async function rebuildFactors(force) {
  const tip = force
    ? '强制重建因子库（忽略"只在 18:00 后构建"与今日已完成，会重新拉全市场价格）？'
    : '立即构建因子库？未到 18:00 会被拒绝（需用「强制重建」）';
  if (!confirm(tip)) return;
  try {
    const r = await api('/api/factors/rebuild', { method: 'POST', body: JSON.stringify({ force }) });
    if (r && r.ok === false) alert(r.reason || '未能触发构建');
    await loadFactors();
  } catch (e) {
    alert('触发失败：' + e.message);
  }
}

// ── 键盘可达性: Esc 关闭已打开的模态框; 打开模态自动聚焦首输入框 ──
function focusFirstInput(maskId) {
  setTimeout(() => {
    const m = document.getElementById(maskId);
    const f = m && m.querySelector('input:not([type=hidden]):not([disabled]), select, textarea');
    if (f) f.focus();
  }, 50);
}
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-mask.show').forEach(m => m.classList.remove('show'));
});

// 初始化主题 (与其它页共享 visual-theme)
VisualTheme.init({ buttonId: 'btn-theme' });

// 锚点定位 (#users)
function applyHash() {
  const h = location.hash.replace('#', '');
  if (h === 'users') {
    const el = document.getElementById(h);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

checkAuth();
</script>
</body>
</html>
