// ═══════════════════════════════════════════════════════════════
// 贴线标签避让 — 现价签/风控签/画线框签同列纵向错开
// ═══════════════════════════════════════════════════════════════
// 同一列里的贴线标签只有"自己那条线的 y"一个自由度, ECharts 不做避让,
// 两条线间距小于标签高度就必然重叠 (现价每 1.25s 随快照移动, 扫过保本/止损时必现)。
// 这里统一做一次"最小位移"错位: 标签尽量贴着自己的线, 实在挤不下就让位/不写字。
const TAG_PITCH = 20;      // 同列标签最小中心间距 (标签盒高约 14~17px, 留余量)
const TAG_HUG = 13;        // 标签盒中心与自己线的默认距离 (盒高 14/2 + 5px 间隙)
const TAG_MAX_SHIFT = 60;  // 为避让允许的最大位移; 超过则不画该签文字 (数值仍在工具栏)
const TAG_BOX_H = 14;      // 标签盒高 (fontSize 10 + padding [2,4], SSR 实测 SVG 盒高 14)

/** 同列贴线标签纵向错开 (纯函数, 无 DOM/ECharts 依赖)。
 *  items: [{ key, y, lineY, priority }] —— y 为标签盒中心的真实像素 y, priority 越小越优先;
 *  bounds: { top, bottom } 列可用像素范围; fixed: 已占位的中心 y (不可移动的东西, 如现价签)。
 *  返回 [{ key, y, shift, dropped }] (y 为调整后的盒中心, 保持最小位移)。 */
function stackTags(items, bounds, fixed) {
  const top = (bounds && Number.isFinite(bounds.top)) ? bounds.top : -Infinity;
  const bottom = (bounds && Number.isFinite(bounds.bottom)) ? bounds.bottom : Infinity;
  const lo = top + TAG_BOX_H / 2, hi = bottom - TAG_BOX_H / 2;
  const clamp = (v) => Math.min(Math.max(v, lo), hi);
  const placed = (fixed || []).filter(Number.isFinite).slice();
  const fits = (y, lineY) => {
    if (y < lo - 0.01 || y > hi + 0.01) return false;
    if (lineY !== null && Math.abs(y - lineY) < TAG_HUG) return false;  // 太贴自己的线 → 压线
    return !placed.some(p => Math.abs(p - y) < TAG_PITCH - 0.01);
  };
  return (items || []).slice()
    .sort((a, b) => (a.priority - b.priority) || (a.y - b.y))
    .map(it => {
      const base = clamp(it.y);
      const lineY = Number.isFinite(it.lineY) ? it.lineY : null;
      // 候选槽位 = 自己的位置 + 自己线的两侧最小合法位 + 每个已占位上下各一个 pitch。
      // 前两类缺一不可: 线的两侧位用于"标签被推到网格上/下缘时原地换边" —— 否则
      // base 被 clamp 到边界后离自己的线不足 TAG_HUG, 又没有任何占位可贴, 只好丢签。
      const cands = [base];
      if (lineY !== null) cands.push(lineY - TAG_HUG, lineY + TAG_HUG);
      placed.forEach(p => { cands.push(p - TAG_PITCH, p + TAG_PITCH); });
      cands.sort((a, b) => Math.abs(a - it.y) - Math.abs(b - it.y));
      let slot = null;
      for (const y of cands) {
        if (fits(y, lineY)) { slot = y; break; }
      }
      const ok = slot !== null && Math.abs(slot - it.y) <= TAG_MAX_SHIFT + 0.01;
      const y = ok ? slot : base;
      if (ok) placed.push(y);
      return { key: it.key, y, shift: ok ? y - it.y : 0, dropped: !ok };
    });
}

/** 标签盒中心 → markLine 的 label 位置。
 *  已核对 ECharts 5.5.0 源码与 SSR 实测: insideStartTop 盒底对齐 (线 y − distance[1]),
 *  insideStartBottom 盒顶对齐 (线 y + distance[1]), distance[0] 是横向缩进, 盒高 14px。 */
function tagLabelPos(lineY, centerY) {
  const above = centerY <= lineY;
  const d = above ? lineY - centerY - TAG_BOX_H / 2 : centerY - lineY - TAG_BOX_H / 2;
  return {
    position: above ? 'insideStartTop' : 'insideStartBottom',
    distance: [2, Math.max(1, Math.round(d * 100) / 100)],
  };
}

/** 标签样式: 有槽位用槽位 (避免重叠), 没算过则退回默认 (与错位前完全一致) */
function priceLineLabel(fallbackPos, key) {
  const s = STATE._tagSlots && STATE._tagSlots[key];
  if (!s) return { show: true, position: fallbackPos, distance: 5 };
  if (s.dropped) return { show: false };   // 挤不下: 只留虚线不留字 (数值在徽章悬停里)
  return { show: true, position: s.position, distance: s.distance };
}

/** 主图水平标注 (markLine 的 data 项): 线型与标签写在每一项上, 才能把风控线与现价线
 *  合并进同一个 markLine —— ECharts 5 的 series.markLine 只接受单个对象, 传数组会被
 *  整段忽略 (实测 5.5.0 一条线都不画)。 */
function priceLineItem(price, color, text, fallbackPos, tagKey, fg) {
  const label = priceLineLabel(fallbackPos, tagKey);
  return {
    yAxis: price,
    lineStyle: { color, type: 'dashed', width: 1, opacity: 0.9 },
    label: Object.assign(label, {
      formatter: text,
      fontSize: 10, fontFamily: 'monospace', color: fg || '#fff',
      backgroundColor: color, padding: [2, 4], borderRadius: 2,
    }),
  };
}

/** 现价线的取价口径 (实时价 > SSE 快照 > 末根收盘), 建线与签位共用一份 */
function resolveLastPrice(bars, livePrice) {
  if (!bars || !bars.length) return null;
  let price = livePrice;
  if (price == null && typeof liveQuotes !== 'undefined') {
    const q = liveQuotes.get(STATE.symbol);
    if (q && q.last_price != null) price = q.last_price;
  }
  if (price == null) price = bars[bars.length - 1].close;
  return price == null ? null : price;
}

/** TradingView 式最新价虚线: 末端虚线 + 轴端色块价格签, 涨红/跌绿随主题。
 *  签上带「现价」前缀: 四条签都自带名称后, 避让把谁推开十几像素也能一眼对上。
 * 传入实时价时优先使用实时价；重绘图表时也自动读取当前 SSE 快照。 */
function buildLastPriceLine(bars, livePrice) {
  if (!bars || !bars.length) return undefined;
  const price = resolveLastPrice(bars, livePrice);
  if (price == null) return undefined;
  const prev = bars.length > 1 ? bars[bars.length - 2] : null;
  const rising = !prev || prev.close == null || price >= prev.close;
  const item = priceLineItem(price, rising ? C().up : C().down, '现价 ' + fmtPrice3(price),
    'insideStartTop', 'last');
  return {
    silent: true, symbol: 'none', animation: false,
    lineStyle: item.lineStyle, label: item.label,
    data: [item],
  };
}

// ── 持仓风控 (止盈/保本/止损): 主图三条虚线 + 名称标签; 配色见 theme.css --risk-* ──
const RISK_ITEMS = [
  { key: 'take_profit', label: '止盈', colorKey: 'riskTp' },
  { key: 'breakeven',   label: '保本', colorKey: 'riskBe' },
  { key: 'stop_loss',   label: '止损', colorKey: 'riskSl' },
];

function riskOn() {
  const chk = document.getElementById('chk-risk');
  return !chk || chk.checked;
}

/** 当前 symbol 的持仓 (排除已平仓与逆回购 —— 逆回购 DB status 恒为 open),
 *  按买入日倒序, 同日按 id 倒序 (最新一笔在前)。 */
function openPositions(trades) {
  return (trades || [])
    .filter(t => t && t.status !== 'closed' && t.type !== 'reverse_repo')
    .sort((a, b) => String(b.entry_date || '').localeCompare(String(a.entry_date || ''))
      || (Number(b.id) || 0) - (Number(a.id) || 0));
}

/** 最新一笔持仓 (给「持仓中」徽章用; 不要求填了风控价) */
function pickOpenPosition(trades) {
  const rows = openPositions(trades);
  return rows.length ? rows[0] : null;
}

/** 持仓风控价: 取「有风控价的最新一笔持仓」—— 与监控页 list_monitored_positions 同一
 *  取数口径。多笔持仓只用一笔, 不跨交易把不同仓位的价位拼成三条线。无则返回 null。 */
function pickOpenRiskPrices(trades) {
  const t = openPositions(trades)
    .find(r => r.take_profit != null || r.breakeven != null || r.stop_loss != null);
  if (!t) return null;
  const out = {};
  RISK_ITEMS.forEach(it => {
    const v = Number(t[it.key]);
    if (t[it.key] != null && Number.isFinite(v) && v > 0) out[it.key] = v;
  });
  return Object.keys(out).length ? out : null;
}

/** 徽章悬停文案: 把不占工具栏的信息放这里。全部取自徽章对应的那一笔持仓,
 *  不跨交易拼 (多笔持仓时另说都是误导)。 */
function holdingTip(pos) {
  if (!pos) return '';
  const parts = ['持仓中'];
  const avg = Number(pos.cost_price != null ? pos.cost_price : pos.entry_price);
  if (Number.isFinite(avg) && avg > 0) parts.push('买入均价 ' + fmtPrice3(avg));
  const qty = Number(pos.quantity);
  if (Number.isFinite(qty) && qty > 0) parts.push(qty + ' 股');
  // hold_days 是模型建议的持仓交易日数 (不是已持有天数); 未关联模型时后端返回 null,
  // 不能落进 Number(null)===0 的坑里显示"持有 0 天"
  const days = Number(pos.hold_days);
  if (pos.hold_days != null && Number.isFinite(days) && days > 0) {
    parts.push('建议持有 ' + days + ' 交易日');
  }
  RISK_ITEMS.forEach(it => {
    const v = Number(pos[it.key]);
    if (pos[it.key] != null && Number.isFinite(v) && v > 0) parts.push(it.label + ' ' + fmtPrice3(v));
  });
  return parts.join(' · ');
}

/** 持仓状态同步: STATE.position/STATE.risk + 「持仓中」徽章 + 「风控线」开关显隐
 *  (交易记录到位、配置变更时调用)。
 *  非持仓不显示风控线勾选框: 它对没有持仓的标的没有意义, 不必占面板栏位置。 */
function syncPosition() {
  const pos = pickOpenPosition(STATE.trades);
  const risk = pickOpenRiskPrices(STATE.trades);
  STATE.position = pos;
  STATE.risk = risk;
  const badge = document.getElementById('info-holding');
  if (badge) {
    badge.style.display = pos ? '' : 'none';
    badge.title = holdingTip(pos);
  }
  const lbl = document.getElementById('lbl-risk');
  if (lbl) lbl.style.display = risk ? '' : 'none';
}

/** 交易记录统一入口: 写入后立即刷新持仓状态/风控显示 */
function setTrades(list) {
  STATE.trades = list;
  syncPosition();
}

/** 风控线的 markLine data 项 (只取填了值的档位): 与现价线同款虚线+标签, 独立配色
 *  并带上名称; 标签挂在线下方 (insideStartBottom) 避让现价签, 实际位置由签位槽给定。
 *  价格不在当前可见区间时 ECharts 本就不渲染该线 (markLine 也不参与主轴范围计算)。 */
function buildRiskLineItems() {
  const risk = STATE.risk;
  if (!riskOn() || !risk) return [];
  return RISK_ITEMS.filter(it => risk[it.key] != null).map(it => {
    const price = risk[it.key];
    return priceLineItem(price, C()[it.colorKey], it.label + ' ' + fmtPrice3(price),
      'insideStartBottom', it.key, C().riskFg);
  });
}

/** K 线主图 markLine: 有持仓时把风控线与现价线合并进同一个 markLine 的 data
 *  (现价线放最后, 画在风控线之上); 无持仓时与改动前一致, 只画现价线。
 *  全量建图与增量 setOption 都走它, 保证 data 项顺序与 index 一致。 */
function buildKlineMarkLines(bars, livePrice) {
  const risk = buildRiskLineItems();
  const last = buildLastPriceLine(bars, livePrice);
  if (!risk.length) return last;
  const data = risk.slice();
  if (last) data.push(last.data[0]);
  const base = last || risk[0];
  return {
    silent: true, symbol: 'none', animation: false,
    lineStyle: base.lineStyle, label: base.label, data,
  };
}

/** grid 边距 → 像素。ECharts grid 的 top/left/height 多为百分比, 也可能是
 *  panelGridLeft() 给的 '216px'; fromEnd 表示 right/bottom 这类从右/下量起的边距。 */
function spanPx(v, total, fromEnd) {
  const s = String(v);
  const n = parseFloat(s);
  if (!isFinite(n)) return fromEnd ? total : 0;
  const px = s.trim().endsWith('px') ? n : n / 100 * total;
  return fromEnd ? total - px : px;
}

/** 缓存 grid 像素矩形 (供 zrender mousemove 判断鼠标在哪个面板、画线层裁剪、贴线标签列边界)。
 *  单位换算统一走 spanPx, 否则侧栏展开时 left 会算成 2000+ px, 画线命中/裁剪全失效。 */
function cacheGridRects(grids) {
  const chart = STATE.chart;
  if (!chart || !grids) return;
  const cw = chart.getWidth(), ch = chart.getHeight();
  STATE._gridRects = grids.map(g => {
    const top = spanPx(g.top, ch, false);
    return {
      top: top,
      bottom: top + spanPx(g.height, ch, false),
      left: spanPx(g.left, cw, false),
      right: spanPx(g.right, cw, true),
    };
  });
}

/** ECharts 实例是否已建 model (即 setOption 跑过): 没有时返回 null。
 *  `echarts.init` 之后、首次 `setOption` 之前 `chart._model` 是 undefined, 而 ECharts 内部
 *  只挡了 `_disposed` 没挡 `_model` —— 此时 `convertToPixel` 会在 `queryComponents` 上抛
 *  TypeError, `getModel().getComponent(...)` 同理。异常会顺着调用方冒出去打断它 (Vue 同步
 *  watcher 里抛 = 这个 tick 的行情/建图全丢), 所以取像素/取轴之前一律先探一下, 拿不到就让路。
 *  用 `getModel()` 而不是 `getOption()`: 后者每次深拷贝整份 option, 不能放进逐帧路径。 */
function chartModel() {
  const chart = STATE.chart;
  if (!chart || typeof chart.getModel !== 'function') return null;
  try { return chart.getModel() || null; } catch (e) { return null; }
}

/** 价格 → 像素 y 的投影 (签位与画线层共用)。
 *  线性轴沿用 0/1 两点探针; **对数轴**不能这么探: price=0 无定义, convertToPixel 会返回
 *  `[x, null]`, 于是整个投影失效 (标签退回固定位置、画线层干脆不重绘)。对数轴改用末根的
 *  low/high 在对数空间插值。
 *  取不到有效投影 (model 未建 / 坐标轴未就绪 / 退化) 返回 null, 调用方跳过本次绘制。 */
function priceYMapper(bars) {
  const chart = STATE.chart;
  if (!chart || !chartModel() || !bars || !bars.length) return null;
  const bar = bars[bars.length - 1];
  const lo = Number(bar.low), hi = Number(bar.high);
  if (STATE.logScale && Number.isFinite(lo) && lo > 0 && Number.isFinite(hi) && hi > lo) {
    const a = chart.convertToPixel({ gridIndex: 0 }, [bars.length - 1, lo]);
    const b = chart.convertToPixel({ gridIndex: 0 }, [bars.length - 1, hi]);
    if (!a || !b || !Number.isFinite(a[1]) || !Number.isFinite(b[1]) || a[1] === b[1]) return null;
    const l0 = Math.log(lo), l1 = Math.log(hi);
    return {
      yOf: (p) => (p > 0 ? a[1] + (Math.log(p) - l0) / (l1 - l0) * (b[1] - a[1]) : NaN),
      // 逆变换: ln p = l0 + (y - y_lo) / (y_hi - y_lo) * (l1 - l0)
      priceAt: (y) => Math.exp(l0 + (y - a[1]) / (b[1] - a[1]) * (l1 - l0)),
    };
  }
  const p0 = chart.convertToPixel({ gridIndex: 0 }, [bars.length - 1, 0]);
  const p1 = chart.convertToPixel({ gridIndex: 0 }, [bars.length - 1, 1]);
  if (!p0 || !p1 || !Number.isFinite(p0[1]) || !Number.isFinite(p1[1]) || p0[1] === p1[1]) return null;
  return {
    yOf: (p) => p0[1] + p * (p1[1] - p0[1]),
    priceAt: (y) => (y - p0[1]) / (p1[1] - p0[1]),
  };
}

/** 主图签列可用范围 + 价格→像素 y 的投影 (取不到返回 null, 调用方跳过本次布局) */
function tagColumnCtx() {
  const chart = STATE.chart;
  const bars = tagBars();
  if (!chart || !bars || !bars.length) return null;
  const map = priceYMapper(bars);
  if (!map) return null;
  const gr = (STATE._gridRects && STATE._gridRects[0]) || null;
  return {
    n: bars.length,
    top: gr ? gr.top : 0,
    bottom: gr ? gr.bottom : chart.getHeight(),
    yOf: map.yOf,
  };
}

/** 当前主图数据 (分时用分时 bars), 供签位计算 */
function tagBars() {
  return STATE.period === 'intraday'
    ? (STATE.intradayData && STATE.intradayData.bars)
    : (STATE.klineData && STATE.klineData.klines);
}

/** 算现价签 + 风控签的槽位: 用当前投影拿每条线的像素 y, 同列错开后可达到最小位移。
 *  现价每 1.25s 随快照移动, 重叠关系随之变化 —— 所以每次快照/建图/缩放都要重算。
 *  返回是否真的算出槽位 (投影未就绪返回 false)。 */
function layoutPriceTagSlots(bars, livePrice) {
  const c = tagColumnCtx();
  if (!c) return false;
  const src = bars && bars.length ? bars : tagBars();
  const items = [];
  const last = resolveLastPrice(src, livePrice);
  if (last != null) {
    const lineY = c.yOf(last);
    if (lineY >= c.top && lineY <= c.bottom) {
      items.push({ key: 'last', y: lineY - TAG_HUG, lineY, priority: 0, price: last });
    }
  }
  // 风控档位: 优先级 止损 > 保本 > 止盈 (盘中盯止损), 区间外的线 ECharts 本来就不画。
  // 面板栏「风控线」关掉时不出线, 也就不该占位 —— 否则画线层的框签会被看不见的签推开。
  const riskPriority = { stop_loss: 1, breakeven: 2, take_profit: 3 };
  if (riskOn()) RISK_ITEMS.forEach(it => {
    const price = STATE.risk ? STATE.risk[it.key] : null;
    if (price == null) return;
    const lineY = c.yOf(price);
    if (lineY < c.top || lineY > c.bottom) return;
    items.push({ key: it.key, y: lineY + TAG_HUG, lineY, price, priority: riskPriority[it.key] || 4 });
  });
  if (!items.length) { STATE._tagSlots = null; STATE._tagKeys = ''; return true; }
  const byKey = {};
  items.forEach(it => { byKey[it.key] = it; });
  const slots = {};
  stackTags(items, { top: c.top, bottom: c.bottom }).forEach(r => {
    const src = byKey[r.key];
    slots[r.key] = Object.assign({ lineY: src.lineY, price: src.price },
      r.dropped ? { dropped: true } : Object.assign(tagLabelPos(src.lineY, r.y), { centerY: r.y }));
  });
  STATE._tagSlots = slots;
  STATE._tagKeys = Object.keys(slots).sort()
    .map(k => k + ':' + (slots[k].dropped ? 'x' : slots[k].position + '/' + slots[k].distance[1])).join('|');
  return true;
}

/** 建图/缩放后按新刻度重排签位并只推一次 markLine。
 *  setOption 用 lazyUpdate 提交, 提交完 convertToPixel 拿到的还是"旧刻度", 所以要等这一帧
 *  真正渲染完 (rendered 事件) 再算; 另留一个延时兜底, 防事件不来时签位停在上一次的状态。
 *  未建图 (model 还没建) 时整个让路: 80ms 兜底可能早于首次 setOption, 硬算会抛 TypeError。 */
function refreshPriceTagLayout() {
  const chart = STATE.chart;
  if (!chart || !chartModel() || STATE._tagRefreshPending) return;
  STATE._tagRefreshPending = true;
  let done = false;
  const run = () => {
    if (done) return;
    done = true;
    STATE._tagRefreshPending = false;
    try { chart.off('rendered', run); } catch (e) { /* 图表已销毁 */ }
    if (!chartModel() || !tagBars()) return;
    const before = STATE._tagKeys;
    if (!layoutPriceTagSlots()) return;
    const line = buildKlineMarkLines(tagBars());
    if (!line) return;
    STATE.chart.setOption({ series: [{ name: 'K线', markLine: line }] },
      { lazyUpdate: true, silent: true });
    if (STATE._tagKeys !== before) redrawDrawings();
  };
  try { chart.on('rendered', run); } catch (e) { /* ignore */ }
  setTimeout(run, 80);
}

// ═══════════════════════════════════════════════════════════════
// THEME — 自动: 系统偏好 > 时间(6-18亮/18-6暗), 手动点切换后锁定
// ═══════════════════════════════════════════════════════════════
function detectSystemTheme() {
  // 1. 系统暗色模式
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
  if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) return 'light';
  // 2. 时间回退: 6:00-18:00 亮色, 其余暗色
  const h = new Date().getHours();
  return (h >= 6 && h < 18) ? 'light' : 'dark';
}

function applyTheme(theme) {
  STATE.theme = theme;
  VisualTheme.apply(theme, { buttonId: 'btn-theme', auto: STATE._themeAuto });
  VisualTheme.save(theme, STATE._themeAuto);
}

function toggleTheme() {
  STATE._themeAuto = false;  // 手动操作=锁定, 不再跟随系统/时间
  STATE.theme = STATE.theme === 'light' ? 'dark' : 'light';
  applyTheme(STATE.theme);
  saveConfig();
  if (STATE.period === 'intraday' && STATE.intradayData) renderIntraday(STATE.intradayData);
  else if (STATE.klineData) updateChart(true);
}

function onSystemThemeChange() {
  if (!STATE._themeAuto) return;
  const sys = detectSystemTheme();
  if (sys !== STATE.theme) {
    applyTheme(sys);
    saveConfig();
    if (STATE.period === 'intraday' && STATE.intradayData) renderIntraday(STATE.intradayData);
    else if (STATE.klineData) updateChart(true);
  }
}

// ═══════════════════════════════════════════════════════════════
// DATA FETCHING
// ═══════════════════════════════════════════════════════════════
/** 缓存命中后，服务端返回同一份 K 线时不再整图重绘一次。 */
function klineRenderKey(data) {
  const bars = (data && data.klines) || [];
  return [data && data.symbol, data && data.period, STATE.adjust, bars.length,
    ...bars.map(k => [k.date, k.open, k.high, k.low, k.close, k.volume, k.amount].join(','))].join('|');
}
function renderFetchedKline(data) {
  const key = klineRenderKey(data);
  if (key === STATE._fetchedKlineRenderKey) return false;
  STATE._fetchedKlineRenderKey = key;
  updateChart(false);
  STATE._periodSwitching = false;
  return true;
}

// ── 慢派生字段: ETF 溢价 (/api/kline/deferred) ──
// 溢价依赖 akshare 净值, 内联在 /api/kline 会让每次 ETF 切换都等它, 故后端改为
// meta.deferred 声明 + 后台预热, 这里在 K 线到手后异步补齐。按 date 建映射,
// 避免与 bar 数量/顺序耦合; 补齐后 updateChart 重绘 (消费点本就把 null 显示为 —)。
function applyPremiumToKlines() {
  const p = STATE.premium, d = STATE.klineData;
  if (!p || !p.map || !d || !Array.isArray(d.klines)) return false;
  if (d.symbol !== p.symbol || d.period !== p.period) return false;
  let changed = false;
  for (const k of d.klines) {
    const v = p.map[String(k.date).slice(0, 10)];
    if (v === undefined || k.premium === v) continue;
    k.premium = v;
    changed = true;
  }
  return changed;
}

function reapplyPremium() {
  const changed = applyPremiumToKlines();
  // 工具条徽标在 updateInfo, 溢价曲线在 updateChart: 两处都要刷新
  if (STATE.klineData) updateInfo(STATE.klineData);
  if (changed) updateChart(false);
}

/** 内存结果可立即回填，但只有未过期且覆盖当前末根才可跳过查询。 */
function premiumInMemory(symbol, period, count) {
  const p = STATE.premium, d = STATE.klineData;
  if (!p || p.symbol !== symbol || p.period !== period) return false;
  reapplyPremium();
  const last = d && d.klines && d.klines[d.klines.length - 1];
  return p.count === count && !p.stale && Date.now() < p.expiresAt && last
    && Object.prototype.hasOwnProperty.call(p.map, String(last.date).slice(0, 10));
}

function cancelPremium() {
  const task = STATE._premiumTask;
  if (!task) return;
  clearTimeout(task.timer);
  task.controller.abort();
  STATE._premiumTask = null;
}

/** 每个视图一个补齐任务。慢源持续低频查询，失败遵守服务端负缓存。 */
async function fetchPremium(symbol, period, count, fetchTs, force = false) {
  const d = STATE.klineData;
  const want = d && d.symbol === symbol && d.period === period && d.meta
    && Array.isArray(d.meta.deferred) && d.meta.deferred.includes('premium');
  if (!want || STATE._fetchTs !== fetchTs) return;
  if (STATE._premiumTask && STATE._premiumTask.fetchTs === fetchTs) return;
  cancelPremium();
  const task = { symbol, period, count, fetchTs, controller: new AbortController(),
    timer: null, running: false, attempts: 0 };
  STATE._premiumTask = task;
  const stale = () => STATE._premiumTask !== task || STATE._fetchTs !== fetchTs
    || STATE.symbol !== symbol || STATE.period !== period;
  const schedule = (ms) => {
    if (stale()) return;
    clearTimeout(task.timer);
    task.timer = setTimeout(task.run, Math.max(400, ms));
  };
  task.run = async () => {
    if (stale() || task.running) return;
    if (document.hidden) return;  // visibilitychange 恢复，无后台忙轮询
    if (!force && premiumInMemory(symbol, period, count)) {
      schedule(Math.min(60000, STATE.premium.expiresAt - Date.now()));
      return;
    }
    force = false;
    task.running = true;
    task.controller = new AbortController();
    const timeout = setTimeout(() => task.controller.abort(), 15000);
    let nextMs = Math.min(10000, 400 * 2 ** Math.min(task.attempts++, 5));
    try {
      const r = await fetch(`/api/kline/deferred?symbol=${encodeURIComponent(symbol)}`
        + `&period=${encodeURIComponent(period)}&count=${count}&fields=premium`,
        { signal: task.controller.signal });
      const prem = r.ok ? (await r.json()).premium : null;
      if (stale()) return;
      if (prem && prem.ready && Array.isArray(prem.dates)) {
        const map = Object.create(null);
        prem.dates.forEach((dt, idx) => {
          map[String(dt).slice(0, 10)] = prem.values && prem.values[idx] != null
            ? prem.values[idx] : null;
        });
        STATE.premium = { symbol, period, count, map, stale: !!prem.stale,
          generatedAt: prem.generated_at,
          expiresAt: Date.now() + Math.max(0, Number(prem.max_age_sec) || 0) * 1000 };
        reapplyPremium();
        if (!prem.stale) {
          task.attempts = 0;
          nextMs = Math.max(1000, Math.min(60000, (Number(prem.max_age_sec) || 10) * 1000));
        }
      }
      if (prem && (prem.status === 'failed' || prem.status === 'no_data')) {
        if (prem.retry_after_sec == null) return;
        nextMs = Math.max(1000, Number(prem.retry_after_sec) * 1000 || 300000);
      } else if (prem && prem.status === 'pending') {
        nextMs = Math.max(nextMs, Math.min(10000, (Number(prem.retry_after_sec) || 1) * 1000));
      }
    } catch (e) {
      if (stale()) return;
    } finally {
      clearTimeout(timeout);
      task.running = false;
    }
    schedule(nextMs);
  };
  await task.run();
}

function resumePremium() {
  const task = STATE._premiumTask;
  if (!task || document.hidden || task.running) return;
  clearTimeout(task.timer);
  task.run();
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && STATE._premiumTask) clearTimeout(STATE._premiumTask.timer);
  else resumePremium();
});

/** K线请求有界重试: 冷启动/上游抖动会让源链单次耗尽 (404), 短退避重试避免
 *  图表黑屏到手动刷新; 换股/切周期 (_fetchTs 变化) 或请求被取消时立即中止。 */
async function fetchKlineWithRetry(url, signal, fetchTs, attempts = 3) {
  let lastErr = null;
  for (let i = 0; i < attempts; i++) {
    if (i) await new Promise(r => setTimeout(r, 1000 * i));
    if (STATE._fetchTs !== fetchTs) break;
    try {
      const resp = await fetch(url, signal ? { signal } : undefined);
      if (!resp.ok) {
        let msg = 'HTTP ' + resp.status;
        try {
          const err = await resp.json();
          if (err && err.error) msg = err.error;
        } catch (_) { /* 网关 502 等可能返回 HTML */ }
        throw new Error(msg);
      }
      return await resp.json();
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      lastErr = e;
    }
  }
  throw lastErr || new Error('请求已被新操作取代');
}

async function fetchData(opts) {
  const silent = !!(opts && opts.silent);
  if (silent && STATE._foregroundLoading) return;
  const retainPanels = !!(opts && opts.retainPanels);
  const symbol = STATE.symbol;
  // 分时下请求K线 (如切换复权) → 统一收口到日K, 同步按钮/面板/URL
  if (STATE.period === 'intraday') { applyPeriodUI('1d'); syncSymbolUrl(true); }
  const period = STATE.period;
  const fetchTs = ++STATE._requestSeq; STATE._fetchTs = fetchTs;
  STATE._lastBarAt = Date.now();
  if (!silent) STATE._foregroundLoading = true;
  cancelPremium();
  if (!silent && !retainPanels) { setTrades(null); STATE.chips = null; } // 仅换股清空，切周期保留当前侧栏/图表直到新数据就绪
  const cacheKey = `vk_${symbol}_${period}_${STATE.adjust}`;
  // SSE 快照流由 loadCurrent()/ensureQuoteStream() 统一管理, 此处不再随 fetchData 重启

  // ── 浏览器缓存: 命中→立即渲染, 后台刷新 ──
  let cacheHit = false;
  try {
    const raw = localStorage.getItem(cacheKey);
    if (raw) {
      const cached = JSON.parse(raw);
      const ttl = MINUTE_PERIODS.includes(period) ? 60 : (period === '1d' ? 120 : 300);
      if (Date.now() - cached.ts < ttl * 1000 && cached.data) {
        STATE.klineData = cached.data;
        applyPremiumToKlines();   // 整包替换会丢 bar 上的 premium, 用内存副本回填
        reconcileLiveBars(cached.data);
        updateInfo(cached.data);
        syncAdjustMeta(cached.data);
        renderFetchedKline(cached.data);
        cacheHit = true;
      }
    }
  } catch(e) { /* ignore */ }

  const count = period === '1d' ? DAILY_COUNT : (MINUTE_COUNTS[period] || 300);
  const adjParam = MINUTE_PERIODS.includes(period) ? '' : `&adjust=${STATE.adjust}`;
  const url = `/api/kline?symbol=${encodeURIComponent(symbol)}&period=${period}&count=${count}${adjParam}`;
  const sameView = STATE.klineData && STATE.klineData.period === period && STATE.klineData.symbol === symbol;
  // 换股/切周期取消浏览器在途请求，减少废弃响应的接收与解析。
  // 不会自动终止 Flask 执行；后端另有实际工作数上限。
  // silent 后台刷新不取消前台请求。
  if (!silent) {
    if (STATE._klineAbort) STATE._klineAbort.abort();
    STATE._klineAbort = new AbortController();
  }
  if (!silent && !retainPanels && !cacheHit && !sameView) {
    document.getElementById('btn-refresh')?.classList.add('loading');
    if (STATE.chart) STATE.chart.showLoading({ text: '加载中...', color: C().text, textColor: C().text, maskColor: 'rgba(0,0,0,0.15)' });
  }
  try {
    const data = await fetchKlineWithRetry(
      url, STATE._klineAbort ? STATE._klineAbort.signal : null, fetchTs);
    if (STATE._fetchTs !== fetchTs) return; // 竞态: 已切到新股票, 丢弃旧响应
    STATE._klineRecoverFails = 0;
    syncAdjustMeta(data);
    ensureQuoteStream();
    STATE.klineData = data;
    applyPremiumToKlines();   // 与缓存命中同理: 新响应不含 premium
    reconcileLiveBars(data);
    document.getElementById('symbol-input').value = data.symbol; // 同步服务端标准化后的 symbol
    // 保存到 localStorage (限制 2MB 总大小)
    try {
      const entry = JSON.stringify({ ts: Date.now(), data });
      localStorage.setItem(cacheKey, entry);
      _cleanLocalStorage();
    } catch(e) { /* quota exceeded */ }
    if (!silent && !retainPanels) {
      // 质押比例: 切股先隐藏, 响应回来做竞态防护 + 无数据时隐藏
      document.getElementById('info-pledge').style.display = 'none';
      fetch(`/api/pledge?symbol=${encodeURIComponent(data.symbol)}`)
        .then(r => r.json()).then(d => {
          if (STATE._fetchTs !== fetchTs) return; // 已切到新股票, 丢弃旧响应
          const el = document.getElementById('info-pledge');
          if (d.pledge) {
            el.textContent = '质押 ' + d.pledge.ratio.toFixed(2) + '%';
            el.style.display = '';
          } else {
            el.style.display = 'none';
          }
        }).catch(() => {});
      addToHistory(data.symbol, data.name,
        data.is_index ? 'index' : (data.is_etf ? 'etf' : deriveSymbolType(data.symbol)));
    }
    updateInfo(data);
    if (!silent) {
      await loadTrades(data.symbol);
      if (STATE._fetchTs !== fetchTs) return;
      // 缓存命中时上面已渲染过 (renderFetchedKline 见同 key 直接返回), 这里拿到交易记录后
      // 需要补一次重绘, 否则买卖点与持仓风控线要等下一次刷新才出现
      if (STATE.klineData && klineRenderKey(STATE.klineData) === STATE._fetchedKlineRenderKey) updateChart(false);
      fetchChips(data.symbol);
    }
    if (retainPanels && isChipPeriod(period)) fetchChips(data.symbol);
    renderFetchedKline(data);
    fetchPremium(data.symbol, data.period, count, fetchTs, !silent);  // 慢派生字段异步补齐
  } catch (e) {
    if (e && e.name === 'AbortError') return;  // 已被新的切换取消, 不是错误
    if (STATE._fetchTs !== fetchTs) return;
    STATE._klineRecoverFails = (STATE._klineRecoverFails || 0) + 1;
    console.error('获取数据失败:', e);
    if (STATE._prevAdjust && STATE.adjust !== STATE._prevAdjust) {
      // 切换复权失败 (如后复权源不可用): 回退选项, 保持图表与选项一致
      STATE.adjust = STATE._prevAdjust;
      document.getElementById('adj-select').value = STATE.adjust;
      showToast('后复权数据获取失败, 已回退前复权', { type: 'warn' });
    }
    if (!silent) showToast('行情数据加载失败: ' + e.message, { type: 'err', actionLabel: '重试', onAction: () => loadCurrent() });
  } finally {
    // 仅当前请求负责收尾: 被取代的请求不得清掉新请求刚显示的加载态
    if (!silent && STATE._fetchTs === fetchTs) {
      STATE._foregroundLoading = false;
      document.getElementById('btn-refresh')?.classList.remove('loading');
      if (STATE.chart) STATE.chart.hideLoading();
    }
  }
}

// ── 交易记录: 拉取当前 symbol 的买卖点与持仓 (仅登录用户, 未登录由服务端 401 拦截跳登录) ──
// 守卫用自增序号 + symbol 比对, 不绑前台 K 线请求: 分时路径也要拉 (否则换股后「持仓中」
// 徽章与图上风控线还是上一只的), 而分时用的是另一个请求序号。序号守卫同时保证
// 失败/401 的迟到响应不会清掉新股票刚拿到的持仓。
async function loadTrades(symbol) {
  const seq = ++STATE._tradesSeq;
  const stale = () => seq !== STATE._tradesSeq || STATE.symbol !== symbol;
  try {
    const resp = await fetch(`/api/trades?symbol=${encodeURIComponent(symbol)}&limit=500`);
    if (stale()) return;
    if (!resp.ok) { setTrades(null); return; }
    const data = await resp.json();
    if (stale()) return; // 已切到新股票 / 已被更新的请求取代
    setTrades(data.trades || []);
  } catch (e) {
    if (stale()) return;
    setTrades(null); // 静默降级: 无买卖点与持仓, 不影响 K 线
  }
}

// ── 筹码分布: 日/周/月K 股票; 日线口径, 盘中约 60s 重算一次 ──
async function fetchChips(symbol) {
  if (!isChipPeriod(STATE.period)) return;
  if (!document.getElementById('chk-chip').checked) return;
  symbol = symbol || STATE.symbol;
  const period = STATE.period;
  const pending = STATE._chipsPending;
  if (pending && pending.symbol === symbol && pending.period === period) return;
  STATE._chipsPending = { symbol, period };
  STATE._lastChipsAt = Date.now();
  const key = `vc_${symbol}_${period}`;
  let hasLocal = false;
  try {
    const raw = localStorage.getItem(key);
    if (raw) {
      const cached = JSON.parse(raw);
      if (Date.now() - cached.ts < 60000 && cached.data) {
        STATE.chips = cached.data.chips || null;
        hasLocal = true;
        if (STATE.symbol === symbol && STATE.period === period) updateChart(false);
      }
    }
  } catch (e) { /* ignore */ }
  try {
    const resp = await fetch(`/api/chips?symbol=${encodeURIComponent(symbol)}&period=${period}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (STATE.symbol !== symbol || STATE.period !== period) return; // 已切股/切周期
    STATE.chips = data.chips || null;
    try {
      localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data }));
      _cleanLocalStorage();
    } catch (e) { /* quota */ }
    if (STATE.symbol === symbol && STATE.period === period) updateChart(false);
  } catch (e) {
    if (!hasLocal) STATE.chips = null; // 网络失败且无缓存: 不显示筹码
  } finally {
    if (STATE._chipsPending && STATE._chipsPending.symbol === symbol
        && STATE._chipsPending.period === period) STATE._chipsPending = null;
  }
}

// ── 左侧栏: 基本信息 + 五档盘口 (所有周期; 五档盘中约 3s 刷新 20/min) ──
function infoPanelOn() {
  const chk = document.getElementById('chk-info');
  return !chk || chk.checked;
}

function depthSecOn() {
  const chk = document.getElementById('chk-depth');
  return !!chk && chk.checked;
}

// 五档已并入基本信息框内, 侧栏可见性由「信息」决定; 「五档」只控制框内五档子块
function sidePanelOn() {
  return infoPanelOn();
}

function showSidePanel(on) {
  const el = document.getElementById('side-panel');
  if (el) el.style.display = on ? 'flex' : 'none';
  const wrap = document.getElementById('chart-wrap');
  if (wrap) wrap.classList.toggle('side-on', !!on);
  const reopen = document.getElementById('side-reopen');
  if (reopen) reopen.style.display = on ? 'none' : 'block';
}

/** 收起侧栏: 记住当前 信息/五档 开关, 取消勾选后走统一重排 */
function foldSidePanel() {
  STATE._sidePrev = {
    info: document.getElementById('chk-info').checked,
    depth: document.getElementById('chk-depth').checked,
  };
  document.getElementById('chk-info').checked = false;
  document.getElementById('chk-depth').checked = false;
  onConfigChange();
}

/** 展开侧栏: 恢复收起前的 信息/五档 开关 (无记录时默认两者都开) */
function unfoldSidePanel() {
  const prev = STATE._sidePrev || {};
  document.getElementById('chk-info').checked = prev.info !== false;
  document.getElementById('chk-depth').checked = prev.depth !== false;
  onConfigChange();
}

function showDepthSection(on) {
  const el = document.getElementById('depth-sec');
  // 用 block 而非 flex: 该区块已无 sp-sec 的 column 方向, flex 会变 row 使盘口行压到标题
  if (el) el.style.display = on ? 'block' : 'none';
}

/** K线网格左边距: 侧栏展开时让出面板宽度 + Y 轴刻度标签宽度, 否则 8% */
function panelGridLeft() {
  if (!sidePanelOn()) return '8%';
  const el = document.getElementById('side-panel');
  const w = el && el.offsetWidth ? el.offsetWidth : 204;
  // 面板贴 chart-wrap 左缘, Y 轴刻度标签画在 grid.left 左侧, 必须额外预留
  // (如"3888.111" ≈ 58px + margin), 否则刻度被面板盖住。
  const AXIS_LABEL_RESERVE = 72;
  return (w + 12 + AXIS_LABEL_RESERVE) + 'px';
}

// ── 基本信息面板 (代码/名称/现价/行业/总手/成交额/换手/量比/涨跌停/N日涨幅/PE/PB/交易状态) ──
function fmtLots(v) {
  if (v == null) return '—';
  return Math.abs(v) >= 1e4 ? (v / 1e4).toFixed(2) + '万手' : Math.round(v) + '手';
}

/** 面板里的名称: stock-info 未返回时用 K 线返回的 name 兜底 (实时行情会先到) */
function panelStockName(d) {
  return (d && d.name) || (STATE.klineData && STATE.klineData.name) || '—';
}

/** 面板里的代码: 带交易所后缀, 与 stock-info/kline 的 symbol 一致 */
function panelStockCode(d) {
  return (d && d.symbol) || STATE.symbol || '—';
}

/** 基本信息行规格, 返回 [{label, text, color}] (color=null 用默认前景色; 无数据返回 null)。
 *
 *  HTML 渲染 (renderStockInfo) 与截图绘制 (sidePanelShotModel) 共用本函数,
 *  两处各自取数会让截图与面板漂移 (出现截图缺行/值不同步)。
 */
function infoPanelRows(d) {
  if (!d || d.error) return null;
  const up = C().up, down = C().down;
  const gray = 'var(--text-secondary)';
  const pct = (v) => {
    if (v == null || isNaN(v)) return { text: '—', color: null };
    v = normPct(v);
    return { text: (v >= 0 ? '+' : '') + v.toFixed(2) + '%', color: v >= 0 ? up : down };
  };
  const fixed = (v) => (v == null || isNaN(v) ? '—' : Number(v).toFixed(2));
  const px = (v, color) => (v == null ? { text: '—', color: null } : { text: fmtPrice3(v), color });
  const statusColor = d.trade_status === 'trading' ? up
    : (d.trade_status === 'halt' ? 'var(--chart-halt)' : gray);
  const lastPrice = Number(d.last_price);
  const prevClose = Number(d.prev_close);
  const priceColor = Number.isFinite(lastPrice)
    ? (lastPrice > prevClose ? up : (lastPrice < prevClose ? down : gray))
    : gray;
  const p3 = pct(d.chg_3d), p5 = pct(d.chg_5d), p10 = pct(d.chg_10d);
  return [
    { label: '名称', text: panelStockName(d), color: null },
    { label: '代码', text: panelStockCode(d), color: null },
    Object.assign({ label: '现价' }, px(d.last_price, priceColor)),
    { label: '行业', text: d.industry || '—', color: null },
    { label: '总手', text: fmtLots(d.volume), color: null },
    { label: '成交额', text: d.amount == null ? '—' : fmtCN(d.amount), color: null },
    { label: '换手', text: d.turnover_rate == null ? '—' : Number(d.turnover_rate).toFixed(2) + '%', color: null },
    { label: '量比', text: fixed(d.vol_ratio), color: null },
    Object.assign({ label: '涨停价' }, px(d.limit_up, up)),
    Object.assign({ label: '跌停价' }, px(d.limit_down, down)),
    { label: '3日涨幅', text: p3.text, color: p3.color },
    { label: '5日涨幅', text: p5.text, color: p5.color },
    { label: '10日涨幅', text: p10.text, color: p10.color },
    { label: 'PE', text: fixed(d.pe), color: null },
    { label: 'PB', text: fixed(d.pb), color: null },
    { label: '状态', text: d.trade_status_text || '—', color: statusColor },
  ];
}

function stockInfoRowHtml(r) {
  const style = r.color ? ` style="color:${r.color}"` : '';
  return `<div class="sp-row"><span class="sp-label">${escHtml(r.label)}</span>` +
    `<span class="sp-val"${style}>${escHtml(r.text)}</span></div>`;
}

function renderStockInfo(d) {
  const body = document.getElementById('info-body');
  if (!body) return;
  const rows = infoPanelRows(d);
  body.innerHTML = rows ? rows.map(stockInfoRowHtml).join('')
    : '<div class="dp-empty">无数据</div>';
}

async function fetchStockInfo(enrich = false, retry = 0) {
  const symbol = STATE.symbol;
  const seq = (STATE._infoReqSeq || 0) + 1;
  STATE._infoReqSeq = seq;
  STATE._lastInfoAt = Date.now();   // 定时刷新节流标记 (盘中约 60s)
  try {
    // 核心包不等行业/PE/PB/涨跌停等慢资料，优先显示量比和 3/5/10 日涨幅。
    const suffix = enrich ? '' : '&core=1';
    const resp = await fetch(`/api/stock-info?symbol=${encodeURIComponent(symbol)}${suffix}`);
    if (!resp.ok) {
      // 补充资料的上游超时/临时故障也要重试；否则行业等字段会一直停在核心包。
      if (retry < 2) {
        const delay = resp.status === 429 ? 2000 : 4000;
        setTimeout(() => { if (STATE.symbol === symbol) fetchStockInfo(enrich, retry + 1); }, delay);
      }
      return;
    }
    const data = await resp.json();
    if (STATE.symbol !== symbol || STATE._infoReqSeq !== seq) return; // 已切走/旧响应
    data._revision = seq;
    marketStore.accept('info', symbol, data);
    updateLiveStockInfo(marketStore.quotes[symbol], symbol);
    // 完整资料延后请求；它慢或失败时，已显示的核心行情仍然保留。
    if (!enrich && STATE.symbol === symbol) fetchStockInfo(true);
  } catch (e) {
    if (retry < 2) setTimeout(() => {
      if (STATE.symbol === symbol) fetchStockInfo(enrich, retry + 1);
    }, 4000);
  }
}

/** 五档行规格, 返回 [{kind:'row',label,price,vol,priceColor} | {kind:'sep'}] (无数据返回 null)。
 *
 *  与 infoPanelRows 同一约定: HTML 渲染与截图绘制共用, 避免截图缺行/价格不同步。
 */
function depthPanelRows(depth) {
  if (!depth) return null;
  const up = C().up, down = C().down;
  const rows = [];
  const row = (label, price, vol, color) => rows.push({
    kind: 'row', label, price: fmtPrice3(price),
    vol: (vol == null ? '—' : String(vol)), priceColor: color,
  });
  const asks = depth.ask_prices || [];
  const av = depth.ask_volumes || [];
  const bids = depth.bid_prices || [];
  const bv = depth.bid_volumes || [];
  for (let i = 4; i >= 0; i--) row('卖' + (i + 1), asks[i], av[i], down);
  rows.push({ kind: 'sep' });
  for (let i = 0; i < 5; i++) row('买' + (i + 1), bids[i], bv[i], up);
  return rows;
}

function renderDepth(depth) {
  const body = document.getElementById('depth-body');
  if (!body) return;
  const rows = depthPanelRows(depth);
  if (!rows) { body.innerHTML = '<div class="dp-empty">无五档数据</div>'; return; }
  body.innerHTML = rows.map((r) => {
    if (r.kind === 'sep') return '<div class="dp-sep"></div>';
    const style = r.priceColor ? ` style="color:${r.priceColor}"` : '';
    return `<div class="dp-row"><span class="dp-label">${r.label}</span>` +
      `<span class="dp-price"${style}>${r.price}</span>` +
      `<span class="dp-vol">${r.vol}</span></div>`;
  }).join('');
}

// ── 截图合成: 侧栏 (基本信息 + 五档) ──
// 侧栏是 DOM, 不能像 ECharts/画线层那样直接导出; 导出时按与 CSS 一致的尺寸重绘
// 到左侧留白区 (grid.left 已为面板让位)。行内容复用 infoPanelRows/depthPanelRows,
// 保证截图与面板不漂移。单位均为 CSS px, 绘制时整体乘 scale (导出像素比)。
const SIDE_SHOT_LAYOUT = {
  padTop: 4, padX: 8, font: 12, line: 18,      // #side-panel padding / 字号 / 行高
  titlePadBottom: 3, titleGap: 3,              // .sp-title padding-bottom / margin-bottom
  infoLabel: 58,                               // .sp-row .sp-label width
  depthLabel: 34, depthVol: 58, depthPricePad: 8,  // .dp-label / .dp-vol / .dp-price padding-right
  depthGapTop: 5, depthGapBottom: 4,           // #depth-sec margin-top / padding-top
  headPadBottom: 2, headGap: 3,                // .dp-head padding-bottom / margin-bottom
  sepBlock: 7,                                 // .dp-sep 1px + 上下 3px margin
  emptyPadTop: 8,                              // .dp-empty padding-top
};

/** 组装截图绘制模型 (纯函数, 不读 DOM): 文本/色块带绝对坐标与基线 y, 便于测试。 */
function sidePanelShotModel(width, height) {
  const c = C();
  const L = SIDE_SHOT_LAYOUT;
  const w = Number(width) > 0 ? Number(width) : 204;
  const h = Number(height) > 0 ? Number(height) : 0;
  const muted = c.muted || 'var(--text-secondary)';
  const fg = c.text || 'var(--text)';
  const border = c.border || 'var(--border)';
  const texts = [], rules = [];
  let y = L.padTop;
  const put = (text, color, x, maxWidth, align, opts) => texts.push(Object.assign({
    text: text == null ? '' : String(text), color: color || fg,
    x, maxWidth: Math.max(0, maxWidth), align, y: y + L.font,
  }, opts || {}));

  if (!infoPanelOn()) return { width: w, height: h, bg: c.panelBg, texts, rules, contentHeight: 0 };

  put('基本信息', muted, L.padX, w - L.padX * 2, 'left', { bold: true });
  y += L.font + L.titlePadBottom;
  rules.push({ x: 0, y, width: w, height: 1, color: border });
  y += 1 + L.titleGap;

  const rows = infoPanelRows(STATE.stockInfo);
  if (!rows) {
    y += L.emptyPadTop;
    put('无数据', muted, w / 2, w - L.padX * 2, 'center');
    y += L.line;
  } else {
    for (const r of rows) {
      put(r.label, muted, L.padX, L.infoLabel, 'left');
      put(r.text, r.color, w - L.padX, w - L.padX - (L.padX + L.infoLabel), 'right');
      y += L.line;
    }
  }

  if (depthSecOn()) {
    y += L.depthGapTop;
    rules.push({ x: 0, y, width: w, height: 1, color: border });
    y += 1 + L.depthGapBottom;
    put('档位', muted, L.padX, L.depthLabel, 'left');
    const priceRight = w - L.padX - L.depthVol - L.depthPricePad;
    put('价格', muted, priceRight, priceRight - (L.padX + L.depthLabel), 'right');
    put('量', muted, w - L.padX, L.depthVol, 'right');
    y += L.line + L.headPadBottom;
    rules.push({ x: 0, y, width: w, height: 1, color: border });
    y += 1 + L.headGap;
    const drows = depthPanelRows(STATE.depth);
    if (!drows) {
      y += L.emptyPadTop;
      put('无五档数据', muted, w / 2, w - L.padX * 2, 'center');
      y += L.line;
    } else {
      for (const r of drows) {
        if (r.kind === 'sep') {
          rules.push({ x: L.padX, y: y + 3, width: w - L.padX * 2, height: 1, color: border });
          y += L.sepBlock;
          continue;
        }
        put(r.label, muted, L.padX, L.depthLabel, 'left');
        put(r.price, r.priceColor, priceRight, priceRight - (L.padX + L.depthLabel), 'right');
        put(r.vol, fg, w - L.padX, L.depthVol, 'right');
        y += L.line;
      }
    }
  }
  return { width: w, height: h, bg: c.panelBg, texts, rules, contentHeight: y + L.padTop };
}

/** 超宽文本截断为 "…" (按当前 font 实测宽度, 右对齐单元格不能溢出到面板外) */
function fitShotText(ctx, text, maxPx) {
  const s = text == null ? '' : String(text);
  if (!ctx || typeof ctx.measureText !== 'function' || !(maxPx > 0)) return s;
  if (ctx.measureText(s).width <= maxPx) return s;
  let cut = s;
  while (cut.length > 1 && ctx.measureText(cut + '…').width > maxPx) cut = cut.slice(0, -1);
  return cut.length < s.length ? cut + '…' : s;
}

/** 把侧栏绘制模型画到 canvas (scale = 导出像素比), 返回内容高度 (CSS px)。 */
function drawSidePanelShot(ctx, model, scale) {
  if (!ctx || !model) return 0;
  const s = Number(scale) > 0 ? Number(scale) : 1;
  const L = SIDE_SHOT_LAYOUT;
  const px = (v) => v * s;
  ctx.save();
  try {
    ctx.fillStyle = model.bg;
    ctx.fillRect(0, 0, px(model.width), px(model.height));
    // 面板 DOM 是 overflow-y:auto: 内容超出可见高度时按裁剪处理, 不缩放变形
    ctx.beginPath();
    ctx.rect(0, 0, px(model.width), px(model.height));
    ctx.clip();
    for (const r of model.rules) {
      ctx.fillStyle = r.color;
      ctx.fillRect(px(r.x), px(r.y), px(r.width), Math.max(1, px(r.height)));
    }
    for (const t of model.texts) {
      ctx.font = `${t.bold ? '700 ' : ''}${px(L.font)}px monospace`;
      ctx.fillStyle = t.color;
      ctx.textAlign = t.align || 'left';
      ctx.fillText(fitShotText(ctx, t.text, px(t.maxWidth)), px(t.x), px(t.y));
    }
  } finally {
    ctx.restore();
  }
  return model.contentHeight;
}

async function fetchDepth() {
  ensureQuoteStream();
  // 首帧直接处理响应，避免换股时 LiveMarket 的 symbols/epoch 切换把结果丢掉；
  // 后续实时更新仍由 LiveMarket 的 SSE/轮询接管。
  const symbol = STATE.symbol;
  const seq = (STATE._depthReqSeq || 0) + 1;
  STATE._depthReqSeq = seq;
  try {
    const resp = await fetch('/api/depth?symbol=' + encodeURIComponent(symbol));
    if (!resp.ok) return;
    const body = await resp.json();
    if (STATE.symbol !== symbol || STATE._depthReqSeq !== seq || !body || !body.depth) return;
    liveQuotes.accept('depth', symbol, body.depth, 'poll');
  } catch (_) { /* SSE/轮询后续重试 */ }
}


// 交易日期 → bar 索引 (升序 dates 里第一个 date >= d 的 bar; 日/周/月通用)
function matchBarIndex(dates, d) {
  for (let i = 0; i < dates.length; i++) {
    if (String(dates[i]).slice(0, 10) >= d) return i;
  }
  return -1;
}

// K线 markPoint 共用提示框: 交易点带 name+value, 形态/金叉死叉点只有 name;
// 缺项必须跳过, 否则 ECharts 会把缺失的 value 渲染成字面量 "undefined"。
const KLINE_MARKPOINT_TOOLTIP = {
  trigger: 'item',
  formatter: (p) => [p.name, p.value].filter(Boolean).join('<br/>'),
};

// 依据交易记录构建 ECharts markPoint (同花顺样式: 红底白B挂柱体下/绿底白S挂柱体上, 不遮实体)
function buildTradeMarkers(klines, dates) {
  const trades = STATE.trades;
  if (!trades || !trades.length) return { symbol: 'none', tooltip: KLINE_MARKPOINT_TOOLTIP };

  const points = [];
  const push = (side, date, price, qty) => {
    if (!date || price == null || isNaN(price)) return;
    const idx = matchBarIndex(dates, date);
    if (idx < 0) return; // K 线窗口外不显示
    const bar = klines[idx];
    const isBuy = side === 'buy';
    const qtyText = (qty != null && qty !== '') ? (qty + ' 股') : '';
    points.push({
      coord: [idx, isBuy ? bar.low : bar.high],
      symbol: 'circle',
      symbolSize: 14,
      symbolOffset: [0, isBuy ? 8 : -8],
      name: isBuy ? '买入' : '卖出',
      value: fmtPrice3(price) + ' 元' + (qtyText ? ' · ' + qtyText : '') + ' (' + date + ')',
      itemStyle: { color: isBuy ? C().up : C().down },
      label: {
        show: true,
        formatter: isBuy ? 'B' : 'S',
        color: '#fff',
        fontSize: 10,
        fontWeight: 'bold',
        position: 'inside',
      },
    });
  };

  for (const t of trades) {
    if (t.type === 'batch') {
      const legs = t.legs || [];
      for (const l of legs) push(l.side, l.date, l.price, l.quantity);
    } else {
      push('buy', t.entry_date, t.entry_price, t.quantity);
      if (t.status === 'closed') push('sell', t.exit_date, t.exit_price, t.quantity);
    }
  }

  if (!points.length) return { symbol: 'none', tooltip: KLINE_MARKPOINT_TOOLTIP };
  return { tooltip: KLINE_MARKPOINT_TOOLTIP, data: points };
}

/** 服务端实际生效的复权回填选项 (hfq 无数据回退 forward 时保持一致) */
function syncAdjustMeta(data) {
  const meta = data && data.meta;
  if (!meta || !meta.adjust) return;
  if (meta.adjust !== STATE.adjust) {
    STATE.adjust = meta.adjust;
    document.getElementById('adj-select').value = meta.adjust;
    if (meta.adjust_fallback) showToast('后复权数据源不可用, 已回退前复权', { type: 'warn' });
  }
}

// 初始 /api/kline 失败后的自动恢复: tail 轮询仍在成功时借道补拉整图,
// 让图表自愈而不必手动刷新。15s 冷却 (tail 每 10s 一帧), 连续失败 5 次后
// 停止自动重试 (对已退市/无数据标的不再空转), 交还手动刷新/重试按钮。
let _klineRecoverAt = 0;
function scheduleKlineRecovery() {
  const now = Date.now();
  if (now < _klineRecoverAt || (STATE._klineRecoverFails || 0) >= 5) return;
  _klineRecoverAt = now + 15000;
  console.warn('K线初始加载失败, tail 正常, 自动补拉整图');
  loadCurrent();
}

const liveQuotes = new VisualLive.LiveMarket({
  streamStatus: true,
  active: () => typeof canAutoRefresh === 'function' && canAutoRefresh(),
  onQuote: (symbol, q) => {
    marketStore.accept('quote', symbol, q);
  },
  onBars: (symbol, data) => {
    if (symbol !== STATE.symbol || data.period !== STATE.period || data.meta.adjust !== STATE.adjust) return;
    if (!STATE.klineData || STATE.klineData.symbol !== symbol || STATE.klineData.period !== data.period) {
      if (Array.isArray(data.bars) && data.bars.length) scheduleKlineRecovery();
      return;
    }
    if (applyServerBars(data.bars)) {
      if (STATE.period === '1d') requestBarPatchDraw();
      else updateChart(false);
    }
  },
  onDepth: (symbol, d) => {
    marketStore.accept('depth', symbol, d);
  },
});

VisualMarketStore.watch(() => marketStore.last, (change) => {
  if (!change || change.symbol !== STATE.symbol) return;
  if (change.kind === 'quote') {
    const { symbol, value: q } = change;
    STATE._lastQuoteAt = Date.now();
    updateQuoteDisplay(q);
    if (STATE.klineData && STATE.klineData.symbol === symbol) STATE.klineData.quote = q;
    updateLiveStockInfo(q, symbol);
    updateLivePriceLine(q, symbol);
  } else if (change.kind === 'depth') {
    STATE.depth = change.value;
    renderDepth(change.value);
  } else if (change.kind === 'info') {
    STATE.stockInfo = change.value;
    renderStockInfo(change.value);
  }
});

/** 快照更新只需改最新价线，避免为每个 1.25s 快照重建整张图。
 *  签位先算后建: 现价每 tick 都在动, 与风控签的重叠关系随之变化, 一次 setOption 同时
 *  更新线和位置 (画线层框签同列避让, 也跟随重绘)。
 *  model 未建 (首屏 setOption 之前) 直接让路 —— 本函数由 flush:'sync' 的行情 watcher 直接
 *  调用, 抛异常会打断行情回调; 首屏建图后 refreshPriceTagLayout 会补算签位。 */
function updateLivePriceLine(q, symbol = STATE.symbol) {
  if (!q || symbol !== STATE.symbol || q.last_price == null || !chartModel()) return;
  const bars = STATE.period === 'intraday'
    ? STATE.intradayData && STATE.intradayData.bars
    : STATE.klineData && STATE.klineData.klines;
  if (!bars || !bars.length) return;
  const before = STATE._tagKeys;
  layoutPriceTagSlots(bars, q.last_price);
  const line = buildKlineMarkLines(bars, q.last_price);
  if (!line) return;
  STATE.chart.setOption({ series: [{ name: 'K线', markLine: line }] },
    { lazyUpdate: true, silent: true });
  if (STATE._tagKeys !== before) redrawDrawings();
}

async function fetchQuote() { ensureQuoteStream(); liveQuotes.refresh(); }
function applyQuoteData(q) {
  ensureQuoteStream();
  return liveQuotes.accept('quote', STATE.symbol, q);
}
function reconcileLiveBars(data) {
  ensureQuoteStream();
  if (data._revision && data.klines) liveQuotes.accept('bars', data.symbol, {
    symbol: data.symbol, period: data.period, meta: data.meta,
    _revision: data._revision, bars: data.klines.slice(-2),
  });
  const latest = liveQuotes.get(data.symbol, 'bars');
  if (latest && latest.period === STATE.period && latest.meta.adjust === STATE.adjust) applyServerBars(latest.bars);
}
function updateLiveStockInfo(q, symbol = STATE.symbol) {
  if (!q || symbol !== STATE.symbol) return;
  const d = { ...(STATE.stockInfo || { symbol: STATE.symbol }), ...(q._live_info || {}) };
  if (q.last_price != null && Number.isFinite(Number(q.last_price))) d.last_price = Number(q.last_price);
  if (q.prev_close != null && Number.isFinite(Number(q.prev_close))) d.prev_close = Number(q.prev_close);
  for (const k of ['volume', 'amount', 'turnover_rate']) {
    if (q[k] != null) d[k] = q[k];
  }
  if (q.vol_ratio != null && Number.isFinite(Number(q.vol_ratio))) d.vol_ratio = Number(q.vol_ratio);
  // ETF 快照源有时不返回换手率；用实时成交量和 K 线返回的份额即时回算，
  // 让基本信息面板不必等待下一次 /api/stock-info（换手率只作近似展示）。
  if (q.turnover_rate == null && STATE.klineData && STATE.klineData.is_etf) {
    const fs = Number(STATE.klineData.float_shares);
    const vol = Number(q.volume);
    // 单位自证: 只在 amount 可用时由 amount/(vol*px) 推断 volume 是股还是手;
    // amount 缺失时不猜 (猜错差 100 倍), 宁可不显示
    const px = Number(q.last_price), amount = Number(q.amount);
    if (Number.isFinite(fs) && fs > 0 && Number.isFinite(vol) && vol > 0
        && Number.isFinite(px) && px > 0 && Number.isFinite(amount) && amount > 0) {
      const unit = amount / (vol * px) > 10 ? 100 : 1;
      d.turnover_rate = vol * unit / fs * 100;
    }
  }
  d.timestamp = q.timestamp || d.timestamp;
  // 基本信息与报价来自不同资源，不能复用报价 revision；否则价格先到时会
  // 把稍后返回的行业/PE/涨跌停基础资料判成旧数据。
  d._revision = Number(d._revision) || 0;
  marketStore.accept('info', symbol, d);
}

function ensureQuoteStream() {
  const tail = ['1d', '1w', '1M'].includes(STATE.period)
    ? { period: STATE.period, count: STATE.period === '1d' ? DAILY_COUNT : 300, adjust: STATE.adjust } : null;
  liveQuotes.setSymbols([STATE.symbol], depthSecOn(), tail);
}
function scheduleQuoteStream() { ensureQuoteStream(); }

/** 应用后端权威末根 bar (含指标): 按 date 合并/追加, 有变动返回 true。
 *  数据只来自服务端, 前端不派生 OHLCV。合并用 Object.assign 以保留服务端
 *  未提供的字段 (如 ETF premium)。旧于末根的 bar 忽略。 */
function applyServerBars(bars) {
  if (!['1d', '1w', '1M'].includes(STATE.period) || !STATE.klineData || !STATE.klineData.klines) return false;
  if (!Array.isArray(bars) || !bars.length) return false;
  const klines = STATE.klineData.klines;
  if (!klines.length) return false;
  let changed = false;
  for (const bar of bars) {
    if (!bar || !bar.date) continue;
    const d = String(bar.date).slice(0, 10);
    const last = klines[klines.length - 1];
    const lastDate = String(last.date).slice(0, 10);
    if (d > lastDate) {
      klines.push(bar);
      changed = true;
    } else if (d === lastDate) {
      const before = JSON.stringify(last);
      Object.assign(last, bar);
      if (JSON.stringify(last) !== before) changed = true;
    }
    // d < lastDate: 过期 bar, 忽略
  }
  const p = STATE.premium, last = klines[klines.length - 1];
  if (changed && p && p.symbol === STATE.symbol && p.period === STATE.period
      && !Object.prototype.hasOwnProperty.call(p.map, String(last.date).slice(0, 10))) resumePremium();
  return changed;
}

function buildMacdHistPoint(k) {
  return {
    value: k.macd_hist,
    itemStyle: { color: (k.macd_hist || 0) >= 0 ? C().up : C().down },
  };
}

function appendChannelSeriesPatches(seriesPatch, klines) {
  if (!STATE.channelEnabled || !isElderPeriod(STATE.period)) return;
  const ema13Arr = klines.map((k) => k.ema13);
  const atrArr = klines.map((k) => k.atr14);
  [1, 2, 3].forEach((mult) => {
    const upper = klines.map((k, i) => (ema13Arr[i] != null && atrArr[i] != null ? ema13Arr[i] + mult * atrArr[i] : null));
    const lower = klines.map((k, i) => (ema13Arr[i] != null && atrArr[i] != null ? ema13Arr[i] - mult * atrArr[i] : null));
    seriesPatch.push({ name: `+${mult}ATR`, data: upper });
    seriesPatch.push({ name: `-${mult}ATR`, data: lower });
  });
}

function appendIndicatorSeriesPatches(seriesPatch, klines, panels) {
  panels.forEach((p) => {
    if (p === 'macd') {
      seriesPatch.push(
        { name: 'DIF', data: klines.map((k) => k.macd_dif) },
        { name: 'DEA', data: klines.map((k) => k.macd_dea) },
        { name: 'MACD柱', data: klines.map((k) => buildMacdHistPoint(k)) },
      );
    } else if (p === 'kdj') {
      seriesPatch.push(
        { name: 'K', data: klines.map((k) => k.kdj_k) },
        { name: 'D', data: klines.map((k) => k.kdj_d) },
        { name: 'J', data: klines.map((k) => k.kdj_j) },
      );
    } else if (p === 'rsi') {
      seriesPatch.push(
        { name: 'RSI1', data: klines.map((k) => k.rsi6) },
        { name: 'RSI2', data: klines.map((k) => k.rsi12) },
        { name: 'RSI3', data: klines.map((k) => k.rsi24) },
      );
    } else if (p === 'atr') {
      seriesPatch.push({ name: 'ATR(14)', data: klines.map((k) => k.atr14) });
    } else if (p === 'obv') {
      seriesPatch.push(
        { name: 'OBV', data: klines.map((k) => k.obv) },
        { name: 'MAOBV', data: klines.map((k) => k.maobv) },
      );
    } else if (p === 'wr') {
      seriesPatch.push({ name: 'WR14', data: klines.map((k) => k.wr14) });
    } else if (p === 'cci') {
      seriesPatch.push({ name: 'CCI14', data: klines.map((k) => k.cci14) });
    } else if (p === 'bias') {
      seriesPatch.push(
        { name: 'BIAS6', data: klines.map((k) => k.bias6) },
        { name: 'BIAS12', data: klines.map((k) => k.bias12) },
        { name: 'BIAS24', data: klines.map((k) => k.bias24) },
      );
    } else if (p === 'dmi') {
      seriesPatch.push(
        { name: '+DI', data: klines.map((k) => k.dmi_pdi) },
        { name: '-DI', data: klines.map((k) => k.dmi_mdi) },
        { name: 'ADX', data: klines.map((k) => k.dmi_adx) },
      );
    }
  });
}

function patchIndicatorLastPoints(seriesPatch, k, lastIdx, seriesByName, klines) {
  const panels = getIndicatorPanels();
  const copyLast = (name, point) => {
    const s = seriesByName[name];
    if (!s || !s.data || s.data.length !== klines.length) return;
    const arr = s.data.slice();
    arr[lastIdx] = point;
    seriesPatch.push({ name, data: arr });
  };

  if (panels.includes('macd')) {
    copyLast('DIF', k.macd_dif);
    copyLast('DEA', k.macd_dea);
    copyLast('MACD柱', buildMacdHistPoint(k));
  }
  if (panels.includes('kdj')) {
    copyLast('K', k.kdj_k);
    copyLast('D', k.kdj_d);
    copyLast('J', k.kdj_j);
  }
  if (panels.includes('rsi')) {
    copyLast('RSI1', k.rsi6);
    copyLast('RSI2', k.rsi12);
    copyLast('RSI3', k.rsi24);
  }
  if (panels.includes('atr')) {
    copyLast('ATR(14)', k.atr14);
  }
  if (panels.includes('obv')) {
    copyLast('OBV', k.obv);
    copyLast('MAOBV', k.maobv);
  }
  if (panels.includes('wr')) {
    copyLast('WR14', k.wr14);
  }
  if (panels.includes('cci')) {
    copyLast('CCI14', k.cci14);
  }
  if (panels.includes('bias')) {
    copyLast('BIAS6', k.bias6);
    copyLast('BIAS12', k.bias12);
    copyLast('BIAS24', k.bias24);
  }
  if (panels.includes('dmi')) {
    copyLast('+DI', k.dmi_pdi);
    copyLast('-DI', k.dmi_mdi);
    copyLast('ADX', k.dmi_adx);
  }

  if (STATE.channelEnabled && isElderPeriod(STATE.period) && k.ema13 != null && k.atr14 != null) {
    [1, 2, 3].forEach((mult) => {
      copyLast(`+${mult}ATR`, k.ema13 + mult * k.atr14);
      copyLast(`-${mult}ATR`, k.ema13 - mult * k.atr14);
    });
  }
  if (document.getElementById('chk-boll').checked) {
    copyLast('BOLL中轨', k.boll_mid);
    copyLast('BOLL上轨', k.boll_up);
    copyLast('BOLL下轨', k.boll_low);
  }
}

function requestBarPatchDraw() {

/** 增量更新末根 K 线/成交量/MA，不 chart.clear */
function patchLastBarOnChart() {
  const chart = STATE.chart;
  const data = STATE.klineData;
  if (!chart || !data || STATE.period !== '1d' || !data.klines || !data.klines.length) return false;
  const klines = data.klines;
  const lastIdx = klines.length - 1;
  const k = klines[lastIdx];
  const impulseOn = STATE.impulseEnabled && isElderPeriod(STATE.period);
  const opt = chart.getOption();
  if (!opt || !opt.series) return false;

  const seriesByName = {};
  (opt.series || []).forEach((s) => { if (s.name) seriesByName[s.name] = s; });
  const klineS = seriesByName['K线'];
  if (!klineS || !klineS.data) return false;

  const curLen = klineS.data.length;
  if (curLen > klines.length) return false;

  const patchOpts = { lazyUpdate: true, silent: true };

  if (curLen < klines.length) {
    const dates = klines.map((x) => x.date);
    const xAxisPatch = (opt.xAxis || []).map(() => ({ data: dates }));
    const panels = getIndicatorPanels();
    const klinePatch = { name: 'K线', data: klines.map((kk) => buildOhlcPoint(kk, impulseOn)) };
    const gapMark = buildGapMarkArea(klines, dates);
    klinePatch.markArea = gapMark || { data: [] };
    layoutPriceTagSlots(klines);
    klinePatch.markLine = buildKlineMarkLines(klines);
    const eff = effectiveMaBoll(klines);
    const seriesPatch = [
      klinePatch,
      ...eff.ma.map((arr, i) => ({ name: `MA${STATE.maPeriods[i]}`, data: arr })),
    ];
    appendChannelSeriesPatches(seriesPatch, klines);
    if (document.getElementById('chk-boll').checked) {
      [['BOLL中轨', eff.boll.mid], ['BOLL上轨', eff.boll.up], ['BOLL下轨', eff.boll.low]]
        .forEach(([name, arr]) => { if (seriesByName[name]) seriesPatch.push({ name, data: arr }); });
    }
    if (seriesByName['成交量']) {
      seriesPatch.push({ name: '成交量', data: klines.map((kk) => buildVolPoint(kk)) });
      seriesPatch.push({ name: 'VOL MA5', data: klines.map((kk) => kk.vol_ma5) });
      seriesPatch.push({ name: 'VOL MA10', data: klines.map((kk) => kk.vol_ma10) });
      seriesPatch.push({ name: 'VOL MA20', data: klines.map((kk) => kk.vol_ma20) });
    }
    appendIndicatorSeriesPatches(seriesPatch, klines, panels);
    chart.setOption({ animation: false, xAxis: xAxisPatch, series: seriesPatch }, patchOpts);
    return true;
  }

  const copyLast = (name, point) => {
    const s = seriesByName[name];
    if (!s || !s.data || s.data.length !== klines.length) return null;
    const arr = s.data.slice();
    arr[lastIdx] = point;
    return { name, data: arr };
  };

  const seriesPatch = [];
  const pK = copyLast('K线', buildOhlcPoint(k, impulseOn));
  if (pK) {
    const dates = klines.map((x) => x.date);
    const gapMark = buildGapMarkArea(klines, dates);
    pK.markArea = gapMark || { data: [] };
    seriesPatch.push(pK);
  }
  const pV = copyLast('成交量', buildVolPoint(k));
  if (pV) seriesPatch.push(pV);
  const maMap = { MA5: 'ma5', MA10: 'ma10', MA20: 'ma20',
    'VOL MA5': 'vol_ma5', 'VOL MA10': 'vol_ma10', 'VOL MA20': 'vol_ma20' };
  Object.keys(maMap).forEach((name) => {
    const s = seriesByName[name];
    if (!s || !s.data || s.data.length !== klines.length) return;
    const arr = s.data.slice();
    arr[lastIdx] = k[maMap[name]];
    seriesPatch.push({ name, data: arr });
  });
  patchIndicatorLastPoints(seriesPatch, k, lastIdx, seriesByName, klines);

  if (!seriesPatch.length) return false;
  chart.setOption({ animation: false, series: seriesPatch }, patchOpts);
  return true;
}

// 人民币金额格式化: 万亿 / 亿 / 万
function fmtCN(v) {
  if (v == null) return '—';
  const a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(2) + '万亿';
  if (a >= 1e8) return (v / 1e8).toFixed(2) + '亿';
  if (a >= 1e4) return (v / 1e4).toFixed(2) + '万';
  return v.toFixed(0);
}

// 价格: 三位小数并去掉尾随0 (1.50→1.5, 1.234→1.234)
function fmtPrice3(v) {
  return VisualLive.price(v);
}

// 换手 (股票) / 流值 (股票) / 份额 (ETF) / 成交额
function updateFundInfo(q) {
  const d = STATE.klineData && STATE.klineData.symbol === STATE.symbol ? STATE.klineData : {};
  const isEtf = !!d.is_etf;
  const isIndex = !!d.is_index;
  const fs = d.float_shares;
  const last = q && q.last_price != null ? q.last_price : null;

  const turnoverEl = document.getElementById('info-turnover');
  const sharesEl = document.getElementById('info-shares');
  const amountEl = document.getElementById('info-amount');
  let turnover = q && q.turnover_rate != null ? Number(q.turnover_rate) : null;
  if (turnover == null && q && isEtf) {
    const shares = Number(fs), vol = Number(q.volume), px = Number(q.last_price), amount = Number(q.amount);
    // 单位自证: 只在 amount 可用时由 amount/(vol*px) 推断 volume 是股还是手;
    // amount 缺失时不猜 (volume 单位未知, 猜错差 100 倍), 宁可不显示
    if (Number.isFinite(px) && px > 0 && Number.isFinite(amount) && amount > 0
        && Number.isFinite(shares) && shares > 0 && Number.isFinite(vol) && vol > 0) {
      const unit = amount / (vol * px) > 10 ? 100 : 1;
      turnover = vol * unit / shares * 100;
    }
  }

  // 换手率 (股票/ETF; 指数通常没有成交换手率)
  if (turnover != null && Number.isFinite(turnover) && !isIndex) {
    turnoverEl.textContent = `换手 ${turnover.toFixed(2)}%`;
    turnoverEl.style.display = '';
  } else {
    turnoverEl.style.display = 'none';
  }

  // 流通市值 (股票) / 基金份额 (ETF)
  if (fs != null && fs > 0) {
    if (isEtf) {
      sharesEl.textContent = `份额 ${(fs / 1e8).toFixed(2)}亿份`;
      sharesEl.style.display = '';
    } else if (!isIndex && last != null) {
      sharesEl.textContent = `流通 ${fmtCN(fs * last)}`;
      sharesEl.style.display = '';
    } else {
      sharesEl.style.display = 'none';
    }
  } else {
    sharesEl.style.display = 'none';
  }

  // 当日成交额
  if (q && q.amount != null && q.amount > 0) {
    amountEl.textContent = `额 ${fmtCN(q.amount)}`;
    amountEl.style.display = '';
  } else {
    amountEl.style.display = 'none';
  }
}

/** 东财股吧地址: 指数 zs+市场前缀, ETF 小写市场前缀, 个股裸 6 位代码。
 *  取不到代码 (非 .SH/.SZ/.BJ 结尾或空) 返回 '' —— 调用方据此把链接摘掉。 */
function gubaUrl(symbol, isIndex, isEtf) {
  const m = String(symbol || '').match(/\.(SH|SZ|BJ)$/);
  const code6 = String(symbol || '').replace(/\.(SH|SZ|BJ)$/, '');
  if (!code6) return '';
  if (isIndex) return 'https://guba.eastmoney.com/list,' + (m && m[1] === 'SZ' ? 'zssz' : 'zssh') + code6 + '.html';
  if (isEtf && m) return 'https://guba.eastmoney.com/list,' + m[1].toLowerCase() + code6 + '.html';
  return 'https://guba.eastmoney.com/list,' + code6 + '.html';
}

/** 代码·名称链接的股吧地址 (点名称跳股吧; 点代码仍是复制, 见 DOMContentLoaded 里的处理器) */
function updateSymbolLink(data) {
  const el = document.getElementById('info-sym');
  if (!el) return;
  const url = gubaUrl(data && data.symbol, !!(data && data.is_index), !!(data && data.is_etf));
  if (url) {
    el.href = url;
    el.title = '去股吧';
  } else {
    el.removeAttribute('href');   // 无股吧页: 名称不可点、无指针、无提示
    el.removeAttribute('title');
  }
}

function updateInfo(data) {
  document.getElementById('info-code').textContent = (data.symbol || '').replace(/\.(SH|SZ|BJ)$/, '');
  document.getElementById('info-name').textContent = data.name || data.symbol;
  updateSymbolLink(data);
  if (data.quote) applyQuoteData(data.quote);
  data.quote = liveQuotes.get(STATE.symbol) || data.quote;
  const q = data.quote;
  const pf = fmtPrice3;

  if (q && q.last_price) {
    document.getElementById('info-price').textContent = pf(q.last_price);
    if (q.change_pct != null) {
      const pct = q.change_pct;
      const cls = pct >= 0 ? 'up' : 'down';
      document.getElementById('info-change').textContent = pctLabel(pct);
      document.getElementById('info-change').className = 'change ' + cls;
      document.getElementById('info-price').className = 'price ' + cls;
    }
  } else if (data.klines && data.klines.length > 0) {
    const last = data.klines[data.klines.length - 1];
    document.getElementById('info-price').textContent = pf(last.close);
    if (data.klines.length > 1) {
      const prev = data.klines[data.klines.length - 2];
      const chg = ((last.close - prev.close) / prev.close * 100);
      const cls = chg >= 0 ? 'up' : 'down';
      document.getElementById('info-change').textContent = pctLabel(chg);
      document.getElementById('info-change').className = 'change ' + cls;
    }
  }
  document.getElementById('info-time').textContent = new Date().toLocaleTimeString();
  // 初始加载也显示开高低 (非仅靠2s刷新)
  if (data.quote) updateQuoteDisplay(data.quote);

  // 溢价率显示 (ETF)
  const premLabel = document.getElementById('lbl-premium');
  if (data.is_etf && !MINUTE_PERIODS.includes(STATE.period)) {
    premLabel.style.display = '';
    const last = data.klines[data.klines.length - 1];
    if (last && last.premium != null) {
      const p = normPct(last.premium);
      const pcls = p >= 0 ? 'up' : 'down';
      const cached = STATE.premium;
      const matching = cached && cached.symbol === data.symbol && cached.period === data.period;
      const stale = !matching || cached.stale || Date.now() >= cached.expiresAt;
      document.getElementById('info-premium').textContent = `溢价${stale ? '（待更新）' : ''} ${p>=0?'+':''}${p.toFixed(2)}%`;
      document.getElementById('info-premium').title = matching && cached.generatedAt
        ? `计算时间：${new Date(cached.generatedAt * 1000).toLocaleString()}` : '';
      document.getElementById('info-premium').className = pcls;
      document.getElementById('info-premium').style.display = '';
    } else {
      document.getElementById('info-premium').style.display = 'none';
    }
  } else {
    premLabel.style.display = 'none';
    document.getElementById('info-premium').style.display = 'none';
  }

  // 换手/流值/份额/成交额 (无 quote 时用末根收盘价兜底显示流值/份额)
  let qf = data.quote;
  if (!qf && data.klines && data.klines.length) {
    qf = { last_price: data.klines[data.klines.length - 1].close };
  }
  updateFundInfo(qf);
  // K 线元数据（ETF 份额）到达后，重新用当前快照补齐基本信息的实时字段。
  if (qf) updateLiveStockInfo(qf, data.symbol || STATE.symbol);
}

// SEARCH HISTORY (localStorage + 服务端跟账号同步)
// ═══════════════════════════════════════════════════════════════
const HIST_KEY = 'visual_search_history';
const HIST_MAX = 20;
const LS_CACHE_BUDGET = 2 * 1024 * 1024; // vk_/vi_ 缓存上限 2MB，保留历史/配置键
const LS_KEEP_KEYS = new Set([HIST_KEY, 'visual_chart_config', 'visual-theme', 'trades-theme']);

/** 只取开头的 ts: 淘汰策略不必为每条 ~600KB 的响应整包 JSON.parse。
 *  缓存条目一律以 {"ts":<数字>,... 写入 (见 kline/chips/分时 三处 setItem),
 *  取不到时返回 0 (按最旧处理, 优先被淘汰, 安全降级)。 */
function _cacheEntryTs(v) {
  const m = /^\{"ts":(\d+)/.exec(v || '');
  return m ? Number(m[1]) : 0;
}

function _cleanLocalStorage() {
  try {
    let total = 0;
    const cacheEntries = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      const v = localStorage.getItem(k) || '';
      total += k.length + v.length;
      if ((k.startsWith('vk_') || k.startsWith('vi_') || k.startsWith('vc_')) && !LS_KEEP_KEYS.has(k)) {
        cacheEntries.push({ k, ts: _cacheEntryTs(v), size: k.length + v.length });
      }
    }
    if (total <= LS_CACHE_BUDGET) return;
    cacheEntries.sort((a, b) => a.ts - b.ts); // 先删最旧
    for (const e of cacheEntries) {
      if (total <= LS_CACHE_BUDGET) break;
      localStorage.removeItem(e.k);
      total -= e.size;
    }
  } catch (_) { /* ignore */ }
}

function loadHistory() {
  try {
    return sortHistory(JSON.parse(localStorage.getItem(HIST_KEY) || '[]'));
  } catch (e) { return []; }
}

function saveHistory(list) {
  const sorted = sortHistory(list).slice(0, HIST_MAX);
  try {
    localStorage.setItem(HIST_KEY, JSON.stringify(sorted));
  } catch (e) {
    _cleanLocalStorage();
    try { localStorage.setItem(HIST_KEY, JSON.stringify(sorted)); } catch (_) {}
  }
}

function sortHistory(list) {
  // 有 ts：按 ts 降序在前；无 ts 旧数据一律排后面（保持原相对顺序）
  // 同 symbol：优先带 ts；都有 ts 取较大；都无 ts 保留先出现的
  if (!Array.isArray(list) || !list.length) return [];
  const best = new Map();
  list.forEach((item, i) => {
    if (!item || item.symbol == null) return;
    const symbol = String(item.symbol).trim();
    if (!symbol) return;
    const name = String(item.name || symbol).trim() || symbol;
    let ts = null;
    if (item.ts != null && item.ts !== '') {
      const n = Number(item.ts);
      if (Number.isFinite(n) && n >= 0) ts = n;
    }
    const entry = { symbol, name, _i: i };
    if (ts != null) entry.ts = ts;
    const prev = best.get(symbol);
    if (!prev) {
      best.set(symbol, entry);
      return;
    }
    const prevTs = prev.ts;
    if (ts != null && (prevTs == null || ts >= prevTs)) best.set(symbol, entry);
  });
  const withTs = [];
  const withoutTs = [];
  for (const e of best.values()) {
    if (e.ts != null) withTs.push(e);
    else withoutTs.push(e);
  }
  withTs.sort((a, b) => b.ts - a.ts);
  withoutTs.sort((a, b) => a._i - b._i);
  return withTs.concat(withoutTs).slice(0, HIST_MAX).map(e => {
    const row = { symbol: e.symbol, name: e.name };
    if (e.ts != null) row.ts = e.ts;
    return row;
  });
}

function mergeHistory(local, server) {
  return sortHistory([...(Array.isArray(server) ? server : []), ...(Array.isArray(local) ? local : [])]);
}

function pushHistoryToServer(list) {
  const payload = sortHistory(list).slice(0, HIST_MAX);
  // 本地被清缓存后可能是 []，禁止上传空列表抹掉服务端已有历史
  if (!payload.length) return;
  fetch('/api/me/search-history', {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ history: payload }),
  }).catch(() => {});
}

async function syncHistoryWithServer() {
  try {
    const resp = await fetch('/api/me/search-history', { credentials: 'same-origin' });
    if (!resp.ok) return;
    const data = await resp.json();
    const merged = mergeHistory(loadHistory(), data.history || []);
    saveHistory(merged);
    // 仅在有内容时回写；空 merged 表示两边都没有，无需 PUT
    if (merged.length) pushHistoryToServer(merged);
    renderHistoryTags();
  } catch (_) { /* 未登录或网络失败: 仅用本地 */ }
}

function addToHistory(symbol, name, type) {
  const list = loadHistory().filter(h => h.symbol !== symbol);
  list.unshift({ symbol, name, ts: Date.now(), type: type || deriveSymbolType(symbol) });
  saveHistory(list);
  pushHistoryToServer(list);
  renderHistoryTags();
}

/** 按代码形态推断类型 (搜索/行情入口未显式给出 type 时兜底) */
function deriveSymbolType(symbol) {
  const s = String(symbol || '').toUpperCase();
  if (s.endsWith('.HK')) return 'hk';
  const code = s.split('.')[0];
  if (/^[A-Z]+$/.test(code)) return 'us';
  return ''; // A股/ETF/指数: 历史标签不区分 (旧数据兼容)
}

/** 类型徽标 (历史标签) */
function typeBadge(type) {
  const MAP = { index: '指数', etf: 'ETF', hk: '港股', us: '美股' };
  return MAP[type] ? `<span class="type-badge tb-${esc(type)}">${MAP[type]}</span>` : '';
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/** 搜索结果类型徽标: 指数/ETF 按类型, 港/美按代码形态 */
function badgeType(r) {
  if (r.type === 'index' || r.type === 'etf') return r.type;
  const s = String(r.symbol || '').toUpperCase();
  if (s.endsWith('.HK')) return 'hk';
  const code = s.split('.')[0];
  if (/^[A-Z]+$/.test(code)) return 'us';
  return '';
}
function searchBadge(r) {
  const LABELS = { index: '指数', etf: 'ETF', hk: '港股', us: '美股' };
  const t = badgeType(r);
  return LABELS[t] || '';
}

function renderHistoryTags() {
  const list = loadHistory();
  const bar = document.getElementById('history-bar');
  const tags = document.getElementById('history-tags');
  if (!list.length) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  // 角标按下标传参 (同 screener.html delCond(i)): 不把 symbol 插进内联 JS
  tags.innerHTML = list.map((h, i) =>
    `<span class="history-tag" onclick="switchToHistory('${esc(h.symbol)}')" title="${esc(h.symbol)}">
      ${typeBadge(h.type)}${esc(h.name)}
      <span class="tag-del" title="删除" onclick="event.stopPropagation();delHistoryTag(${i})">✕</span>
    </span>`
  ).join('');
}

/** 删除单条搜索历史。下标对应 renderHistoryTags 的顺序 (同样 loadHistory → sortHistory)。 */
function delHistoryTag(idx) {
  const list = loadHistory();
  if (!(idx >= 0) || idx >= list.length) return;
  const symbol = list[idx].symbol;
  list.splice(idx, 1);
  saveHistory(list);
  deleteHistoryOnServer(symbol);
  renderHistoryTags();
}

/** 服务端跟删: 否则下次 syncHistoryWithServer 会把删掉的标签合并回来。
 *  失败静默 (同 pushHistoryToServer): 离线删除会在下次加载时复活。 */
function deleteHistoryOnServer(symbol) {
  fetch('/api/me/search-history?symbol=' + encodeURIComponent(symbol), { method: 'DELETE' })
    .catch(() => {});
}

function switchToHistory(symbol) {
  switchSymbol(symbol);
  loadCurrent(); // 与搜索/回车一致: K线/分时 + 基本信息 + 五档
}
