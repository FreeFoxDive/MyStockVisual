function paintDrawing(c2, d, P, ctx, selected) {
  const g = Drawings.geom(d, P, ctx);
  if (!g) return;
  const color = d.style.color, width = d.style.width, dash = d.style.dash ? [6, 4] : [];
  switch (d.type) {
    case 'trend': case 'ray': case 'arrow': {
      if (!g.c) break;
      strokeSeg(c2, g.c[0], g.c[1], g.c[2], g.c[3], color, width, dash);
      if (d.type === 'arrow' && g.c[2] !== g.c[0]) {
        const tail = Drawings.arrowHead(g.c[0], g.c[1], g.c[2], g.c[3], 4 + width * 3);
        strokeSeg(c2, tail.lx, tail.ly, g.c[2], g.c[3], color, width, []);
        strokeSeg(c2, tail.rx, tail.ry, g.c[2], g.c[3], color, width, []);
      }
      break;
    }
    case 'hline':
      strokeSeg(c2, P.grid.left, g.y, P.grid.right, g.y, color, width, dash);
      paintTag(c2, fmtPrice3(g.price), P.grid.right, g.y, color);
      break;
    case 'vline':
      strokeSeg(c2, g.x, P.grid.top, g.x, P.grid.bottom, color, width, dash);
      break;
    case 'poly': {
      if (g.pts.length < 2) break;
      c2.beginPath();
      g.pts.forEach((p, i) => i ? c2.lineTo(p.x, p.y) : c2.moveTo(p.x, p.y));
      c2.strokeStyle = color; c2.lineWidth = width; c2.setLineDash(dash);
      c2.stroke(); c2.setLineDash([]);
      break;
    }
    case 'rect':
      c2.fillStyle = hexToRgba(color, 0.08);
      c2.fillRect(g.x, g.y, g.w, g.h);
      c2.strokeStyle = color; c2.lineWidth = width; c2.setLineDash(dash);
      c2.strokeRect(g.x, g.y, g.w, g.h); c2.setLineDash([]);
      break;
    case 'channel': {
      const c1 = Drawings.clipSeg(g.a.x, g.a.y, g.b.x, g.b.y, P.grid);
      const c2b = Drawings.clipSeg(g.a.x + g.dx, g.a.y + g.dy, g.b.x + g.dx, g.b.y + g.dy, P.grid);
      if (c1) strokeSeg(c2, c1[0], c1[1], c1[2], c1[3], color, width, dash);
      if (c2b) strokeSeg(c2, c2b[0], c2b[1], c2b[2], c2b[3], color, width, dash);
      break;
    }
    case 'fib': {
      c2.font = '10px monospace';
      for (let i = 0; i < g.levels.length; i++) {
        const lv = g.levels[i];
        if (i < g.levels.length - 1) {
          const y2 = g.levels[i + 1].y;
          c2.fillStyle = hexToRgba(color, i % 2 ? 0.04 : 0.08);
          c2.fillRect(g.xStart, Math.min(lv.y, y2), g.xEnd - g.xStart, Math.abs(y2 - lv.y));
        }
        strokeSeg(c2, g.xStart, lv.y, g.xEnd, lv.y, color, 1, []);
        c2.fillStyle = color;
        c2.fillText((lv.r * 100).toFixed(1) + '%  ' + fmtPrice3(lv.price), g.xStart + 4, lv.y - 4);
      }
      break;
    }
    case 'regression':
      strokeSeg(c2, g.up1.x, g.up1.y, g.up2.x, g.up2.y, color, 1, [4, 4]);
      strokeSeg(c2, g.lo1.x, g.lo1.y, g.lo2.x, g.lo2.y, color, 1, [4, 4]);
      strokeSeg(c2, g.mid1.x, g.mid1.y, g.mid2.x, g.mid2.y, color, width, dash);
      c2.font = '10px monospace'; c2.fillStyle = color;
      c2.textAlign = 'center';
      c2.fillText('REG ±' + Drawings.REG_SIGMA + 'σ', (g.x1 + g.x2) / 2, g.up2.y - 8);
      c2.textAlign = 'left';
      break;
    case 'text':
      c2.font = '13px sans-serif';
      c2.fillStyle = color;
      c2.fillText(g.text || ' ', g.x, g.y);
      break;
    case 'position': {
      const profitCol = g.dir === 'long' ? C().up : C().down;
      const lossCol = g.dir === 'long' ? C().down : C().up;
      const boxW = Math.max(g.x2 - g.x1, 10);
      c2.fillStyle = hexToRgba(profitCol, 0.15);
      c2.fillRect(g.x1, Math.min(g.entryY, g.targetY), boxW, Math.abs(g.targetY - g.entryY));
      c2.fillStyle = hexToRgba(lossCol, 0.15);
      c2.fillRect(g.x1, Math.min(g.entryY, g.stopY), boxW, Math.abs(g.stopY - g.entryY));
      strokeSeg(c2, g.x1, g.entryY, g.x2, g.entryY, color, width, []);
      strokeSeg(c2, g.x1, g.targetY, g.x2, g.targetY, profitCol, 1, [4, 4]);
      strokeSeg(c2, g.x1, g.stopY, g.x2, g.stopY, lossCol, 1, [4, 4]);
      c2.font = '10px monospace'; c2.fillStyle = color;
      c2.fillText((g.dir === 'long' ? '做多' : '做空') + '  R:R ' + g.rr.toFixed(2), g.x1 + 4, g.entryY - 8);
      break;
    }
  }
  if (selected) {
    Drawings.handlesOf(d, P, ctx).forEach(h => paintHandle(c2, h.x, h.y, color));
  }
}

function refreshAutoLines(ctx) {
  const key = STATE.symbol + ':' + STATE.period + ':' + ctx.n + ':' + ctx.bars[ctx.n - 1].date;
  if (STATE.draw._autoKey === key && STATE.draw._autoLines) return;
  STATE.draw._autoKey = key;
  STATE.draw._autoLines = Drawings.detectTrendlines(ctx.bars, {});
}

function paintAutoLines(c2, P, ctx) {
  (STATE.draw._autoLines || []).forEach(a => {
    if (a.points[1].i === a.points[0].i) return;
    const x1 = P.x(a.points[0].i), y1 = P.y(a.points[0].p);
    const slope = (a.points[1].p - a.points[0].p) / (a.points[1].i - a.points[0].i);
    const y2 = P.y(a.points[1].p + slope * (P.idxAt(P.grid.right) - a.points[1].i));
    const clipped = Drawings.clipSeg(x1, y1, P.grid.right, y2, P.grid);
    if (!clipped) return;
    const color = a.kind === 'L' ? C().up : C().down;
    strokeSeg(c2, clipped[0], clipped[1], clipped[2], clipped[3], color, 1, [3, 5]);
    c2.font = '10px monospace'; c2.fillStyle = color;
    c2.fillText((a.kind === 'L' ? '自动支撑' : '自动压力') + ' · ' + a.touches + '触点', clipped[0] + 4, clipped[1] - 6);
    c2.font = '12px monospace';
  });
}

function paintSuggest(c2, P, ctx) {
  const sug = STATE.draw.suggest;
  if (!sug) return;
  const d = STATE.draw.drawings.find(x => x.id === sug.forId);
  if (!d) return;
  const ghost = {
    id: 'sug', type: d.type,
    points: sug.points.map(pt => Drawings.pointFromIdx(pt.i, pt.p, ctx.dateMap, ctx.n)),
    style: { color: '#e6a23c', width: 2, dash: true }, extendRight: d.extendRight,
  };
  const g = Drawings.geom(ghost, P, ctx);
  if (!g || !g.c) return;
  strokeSeg(c2, g.c[0], g.c[1], g.c[2], g.c[3], '#e6a23c', 2, [6, 4]);
  paintHandle(c2, g.raw1.x, g.raw1.y, '#e6a23c');
  paintHandle(c2, g.raw2.x, g.raw2.y, '#e6a23c');
}

function paintDraft(c2, P, ctx) {
  const draft = STATE.draw.draft;
  if (!draft) return;
  const pts = draft.pts;
  const pointer = STATE.draw._pointer;
  const color = '#e6a23c';
  if (draft.tool === 'measure') {
    if (pts.length >= 1) {
      const a = pts[0], b = pts[1] || pointer;
      if (b) {
        const x1 = P.x(a.idx), y1 = P.y(a.price), x2 = P.x(b.idx), y2 = P.y(b.price);
        c2.fillStyle = 'rgba(230,162,60,0.12)';
        c2.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        c2.strokeStyle = color; c2.lineWidth = 1;
        c2.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        const st = Drawings.measureStats(ctx.dateMap.dates, Math.round(a.idx), Math.round(b.idx), a.price, b.price);
        c2.font = '12px monospace';
        c2.fillStyle = st.dp >= 0 ? C().up : C().down;
        c2.fillText((st.dp >= 0 ? '+' : '') + st.pct.toFixed(2) + '%', Math.max(x1, x2) + 6, Math.min(y1, y2) + 4);
        c2.fillText(st.bars + ' 根 / ' + Math.abs(st.days) + ' 天', Math.max(x1, x2) + 6, Math.min(y1, y2) + 20);
      }
    }
    return;
  }
  if (draft.tool === 'hline' && pts.length >= 1) {
    strokeSeg(c2, P.grid.left, P.y(pts[0].price), P.grid.right, P.y(pts[0].price), color, 1, []);
  } else if (draft.tool === 'vline' && pts.length >= 1) {
    strokeSeg(c2, P.x(pts[0].idx), P.grid.top, P.x(pts[0].idx), P.grid.bottom, color, 1, []);
  } else if (draft.tool === 'text') {
    /* 文本: 输入框交互, 无需预览 */
  } else if (pts.length >= 1) {
    const all = pointer ? pts.concat([pointer]) : pts;
    if (draft.tool === 'poly' && all.length >= 2) {
      c2.beginPath();
      all.forEach((p, i) => { const x = P.x(p.idx), y = P.y(p.price); i ? c2.lineTo(x, y) : c2.moveTo(x, y); });
      c2.strokeStyle = color; c2.lineWidth = 1; c2.stroke();
    } else if (draft.tool === 'channel' && pts.length >= 2 && pointer) {
      strokeSeg(c2, P.x(pts[0].idx), P.y(pts[0].price), P.x(pts[1].idx), P.y(pts[1].price), color, 1, []);
      const dx = P.x(pointer.idx) - P.x(pts[0].idx), dy = P.y(pointer.price) - P.y(pts[0].price);
      strokeSeg(c2, P.x(pts[0].idx) + dx, P.y(pts[0].price) + dy, P.x(pts[1].idx) + dx, P.y(pts[1].price) + dy, color, 1, []);
    } else if (all.length >= 2) {
      strokeSeg(c2, P.x(all[0].idx), P.y(all[0].price), P.x(all[1].idx), P.y(all[1].price), color, 1, []);
    }
    all.forEach(p => paintHandle(c2, P.x(p.idx), P.y(p.price), color));
  }
}

function _renderDrawingsNow() {
  const chart = STATE.chart;
  if (!chart) return;
  const c2 = drawOverlayCtx();
  if (!c2) return;
  const dctx = drawCtx();
  if (!dctx || !STATE.draw.visible) { positionDrawMenu(); return; }
  const P = drawMapper();
  if (STATE.draw.autoLines) refreshAutoLines(dctx);
  // 面板名/图例是图表固有元素, 不随 👁 画线显隐开关消失
  paintLabels(c2, STATE.draw._labels);
  paintLegend(c2, dctx);
  if (STATE.draw.autoLines && STATE.draw.visible) paintAutoLines(c2, P, dctx);
  if (STATE.draw.visible) {
    STATE.draw.drawings.forEach(d => paintDrawing(c2, d, P, dctx, STATE.draw.selectedId === d.id));
    if (STATE.draw.suggest) paintSuggest(c2, P, dctx);
    if (STATE.draw.draft) paintDraft(c2, P, dctx);
  }
  positionDrawMenu();
}

// ── 指针交互 ──
function initDrawEvents() {
  const zr = STATE.chart.getZr();
  zr.on('mousedown', onDrawMouseDown);
  zr.on('mousemove', onDrawMouseMove);
  zr.on('mouseup', onDrawMouseUp);
  zr.on('contextmenu', (e) => {
    if (!STATE.draw.enabled) return;
    if (e.event && e.event.preventDefault) e.event.preventDefault();
    if (STATE.draw.draft) cancelDraft();
    else selectDrawing(null);
  });
}

function drawPointer(e) {
  const ctx = drawCtx();
  if (!ctx) return null;
  const px = e.offsetX, py = e.offsetY;
  const gr = (STATE._gridRects && STATE._gridRects[0]) || null;
  if (!gr || py < gr.top - 4 || py > gr.bottom + 4) return null;
  const P = drawMapper();
  return { px, py, P, ctx, idxF: P.idxAt(px), price: P.priceAt(py) };
}

function snappedPoint(ptInfo) {
  if (STATE.draw.magnet && ptInfo.idxF <= ptInfo.ctx.n - 1) {
    const s = Drawings.snap(ptInfo.ctx.bars, ptInfo.idxF, ptInfo.price, ptInfo.P, Drawings.MAGNET_PX);
    return { idx: s.idx, price: s.price };
  }
  return { idx: ptInfo.idxF, price: ptInfo.price };
}

function onDrawMouseDown(e) {
  if (!STATE.draw.enabled || !drawSupported()) return;
  if (e.event && (e.event.button === 2)) return; // 右键: cancelDraft 在 contextmenu 处理
  if (e.event && e.event.button !== 0) return;
  const info = drawPointer(e);
  if (!info) return;
  const dr = STATE.draw;
  // 拖拽选中画线的手柄
  if (dr.tool === 'select' && dr.selectedId) {
    const d = dr.drawings.find(x => x.id === dr.selectedId);
    if (d) {
      const hit = Drawings.hitTest(d, info.P, info.ctx, info.px, info.py);
      if (hit && hit.part.startsWith('h')) {
        const ptIdx = parseInt(hit.part.slice(1), 10);
        dr.drag = { id: d.id, ptIdx, before: JSON.parse(JSON.stringify(d.points)) };
        try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: false }] }); } catch (err) { /* ignore */ }
        return;
      }
    }
  }
  if (dr.tool === 'select') {
    // 命中任一画线 → 选中
    for (let i = dr.drawings.length - 1; i >= 0; i--) {
      const hit = Drawings.hitTest(dr.drawings[i], info.P, info.ctx, info.px, info.py);
      if (hit) { selectDrawing(dr.drawings[i].id); return; }
    }
    selectDrawing(null);
    return;
  }
  // 画线工具: 逐点落子
  const pt = snappedPoint(info);
  if (dr.tool === 'text') {
    // 阻止 mousedown 默认行为(焦点转移到画布/body), 否则输入框刚 focus 即被 blur
    if (e.event && e.event.preventDefault) e.event.preventDefault();
    openTextInput(info, pt);
    return;
  }
  if (dr.tool === 'measure') {
    if (!dr.draft) {
      dr.draft = { tool: 'measure', pts: [pt] };
    } else {
      dr.draft.pts.push(pt);
      const snapshot = dr.draft;
      setTimeout(() => {
        if (STATE.draw.draft === snapshot) { STATE.draw.draft = null; redrawDrawings(); }
      }, 2500);
    }
    return;
  }
  if (!dr.draft) dr.draft = { tool: dr.tool, pts: [pt], need: DRAW_POINT_NEEDS[dr.tool] || 2 };
  else {
    // 折线: 双击结束的第二次按下与上一点重合, 不重复落点 (dblclick 事件负责结束)
    const lastPt = dr.draft.pts[dr.draft.pts.length - 1];
    if (dr.tool === 'poly' && lastPt
        && Math.abs(info.P.x(lastPt.idx) - info.px) < 6
        && Math.abs(info.P.y(lastPt.price) - info.py) < 6) return;
    dr.draft.pts.push(pt);
  }
  const need = dr.draft.need;
  if (dr.draft.pts.length >= need) finalizeDraft();
  else redrawDrawings();
}

function onDrawMouseMove(e) {
  if (!STATE.draw.enabled) return;
  const info = drawPointer(e);
  if (!info) return;
  STATE.draw._pointer = { idx: info.idxF, price: info.price };
  const dr = STATE.draw;
  if (dr.drag) {
    const d = dr.drawings.find(x => x.id === dr.drag.id);
    if (d) {
      const pt = snappedPoint(info);
      d.points[dr.drag.ptIdx] = Drawings.pointFromIdx(pt.idx, pt.price, info.ctx.dateMap, info.ctx.n);
      d.points[dr.drag.ptIdx].p = pt.price;
      redrawDrawings();
    }
    return;
  }
  if (dr.draft && dr.tool !== 'text') {
    // 预览端点跟随指针由 paintDraft 用 _pointer 绘制;
    // 已落子的锚点不可跟随鼠标, 否则第二击前 pt1 会被移动到 pt2 位置 (两点重合)
    redrawDrawings();
  }
}

function onDrawMouseUp() {
  const dr = STATE.draw;
  if (!dr.drag) return;
  const d = dr.drawings.find(x => x.id === dr.drag.id);
  if (d) {
    dr.undo.push({ op: 'move', id: d.id, before: dr.drag.before, after: JSON.parse(JSON.stringify(d.points)) });
    if (dr.undo.length > 50) dr.undo.shift();
    runSuggest(d);
    scheduleSave();
  }
  dr.drag = null;
  // 选择工具下恢复拖拽平移
  if (dr.enabled && dr.tool === 'select') {
    try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: true }] }); } catch (err) { /* ignore */ }
  }
  redrawDrawings();
}

// ── 草稿定稿 / 工具切换 / 选择 / 删除 / 撤销 ──
function finalizeDraft() {
  const dr = STATE.draw;
  const draft = dr.draft;
  if (!draft) return;
  dr.draft = null;
  if (!draft.pts.length) return;
  const ctx = drawCtx();
  if (!ctx) return;
  const pts = draft.pts.map(p => Drawings.pointFromIdx(p.idx, p.price, ctx.dateMap, ctx.n));
  let extra;
  if (draft.tool === 'position') {
    extra = { dir: draft.pts[1].price >= draft.pts[0].price ? 'long' : 'short' };
  }
  const d = Drawings.createDrawing(draft.tool, pts, extra);
  dr.drawings.push(d);
  dr.undo.push({ op: 'add', id: d.id });
  if (dr.undo.length > 50) dr.undo.shift();
  selectDrawing(d.id);
  if (draft.tool === 'trend' || draft.tool === 'ray') runSuggest(d);
  scheduleSave();
  redrawDrawings();
}

function finishPolyDraft() {
  const dr = STATE.draw;
  if (dr.draft && dr.draft.tool === 'poly' && dr.draft.pts.length >= 2) finalizeDraft();
  else cancelDraft();
}

function cancelDraft() {
  STATE.draw.draft = null;
  redrawDrawings();
}

/** 画线修正建议: 趋势线/射线定稿或拖拽后, 找触点更多的锚点方案 */
function runSuggest(d) {
  const ctx = drawCtx();
  if (!ctx || (d.type !== 'trend' && d.type !== 'ray')) return;
  const opt = Drawings.optimizeTrendline(ctx.bars, d, ctx, {});
  STATE.draw.suggest = opt ? { forId: d.id, points: opt.points, touches: opt.touches } : null;
  positionSuggestBox();
}

function selectDrawing(id) {
  STATE.draw.selectedId = id;
  if (!id) { STATE.draw.suggest = null; hideSuggestBox(); }
  if (id) showDrawMenu(); else hideDrawMenu();
  redrawDrawings();
}

function deleteSelectedDrawing() {
  const dr = STATE.draw;
  if (!dr.enabled || !dr.selectedId) return false;
  const idx = dr.drawings.findIndex(d => d.id === dr.selectedId);
  if (idx < 0) return false;
  dr.undo.push({ op: 'del', d: dr.drawings[idx], at: idx });
  dr.drawings.splice(idx, 1);
  dr.selectedId = null;
  dr.suggest = null;
  scheduleSave();
  redrawDrawings();
  return true;
}

function drawUndo() {
  const dr = STATE.draw;
  const op = dr.undo.pop();
  if (!op) return;
  if (op.op === 'add') {
    const i = dr.drawings.findIndex(d => d.id === op.id);
    if (i >= 0) dr.drawings.splice(i, 1);
    if (dr.selectedId === op.id) dr.selectedId = null;
  } else if (op.op === 'del') {
    dr.drawings.splice(Math.min(op.at, dr.drawings.length), 0, op.d);
  } else if (op.op === 'move') {
    const d = dr.drawings.find(x => x.id === op.id);
    if (d) d.points = op.before;
  }
  dr.suggest = null;
  scheduleSave();
  redrawDrawings();
}

// ── 工具面板 ──
function toggleDrawMode() {
  const dr = STATE.draw;
  if (!dr.enabled) {
    if (STATE.period === 'intraday') { showToast('分时视图暂不支持画线, 请切换到 K 线周期', { type: 'warn' }); return; }
    if (!drawSupported()) { showToast('图表尚未就绪', { type: 'warn' }); return; }
    dr.enabled = true;
    document.getElementById('btn-draw').classList.add('active');
    buildPalette();
    document.getElementById('draw-palette').style.display = 'flex';
  } else {
    dr.enabled = false;
    dr.draft = null;
    dr.drag = null;
    selectDrawing(null);
    document.getElementById('btn-draw').classList.remove('active');
    document.getElementById('draw-palette').style.display = 'none';
    hideDrawMenu();
    hideSuggestBox();
  }
  updateChart(false); // 未来bar空间随开关变化, 需重建坐标轴
}

function buildPalette() {
  const pal = document.getElementById('draw-palette');
  pal.innerHTML = '';
  DRAW_TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'dp-btn' + (STATE.draw.tool === t.id ? ' active' : '');
    b.textContent = t.icon;
    b.title = t.title;
    b.dataset.tool = t.id;
    b.addEventListener('click', () => setDrawTool(t.id));
    pal.appendChild(b);
  });
  const sep = document.createElement('div');
  sep.className = 'dp-sep';
  pal.appendChild(sep);
  [['magnet', '🧲', '磁吸吸附 K 线开高低收'], ['auto', '⚡', '自动建议支撑/压力趋势线'], ['hide', '👁', '显示/隐藏画线'], ['undo', '↩', '撤销 (Ctrl+Z)'], ['clear', '🗑', '清空全部画线']].forEach(([id, icon, tip]) => {
    const b = document.createElement('button');
    b.className = 'dp-btn' + ((id === 'magnet' && STATE.draw.magnet) || (id === 'auto' && STATE.draw.autoLines) ? ' toggled' : '');
    b.textContent = icon;
    b.title = tip;
    b.dataset.act = id;
    b.addEventListener('click', () => onPaletteAction(id, b));
    pal.appendChild(b);
  });
}

function setDrawTool(tool) {
  STATE.draw.tool = tool;
  STATE.draw.draft = null;
  if (tool !== 'select') selectDrawing(null);
  document.querySelectorAll('#draw-palette .dp-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
  // 拖拽平移锁: 非选择工具时禁用 (滚轮缩放不受影响)
  if (STATE.chart) {
    try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: tool === 'select' }] }); } catch (e) { /* ignore */ }
  }
  redrawDrawings();
}

function onPaletteAction(id, btn) {
  const dr = STATE.draw;
  if (id === 'magnet') {
    dr.magnet = !dr.magnet;
    btn.classList.toggle('toggled', dr.magnet);
    showToast('磁吸' + (dr.magnet ? '开启' : '关闭'));
  } else if (id === 'auto') {
    dr.autoLines = !dr.autoLines;
    btn.classList.toggle('toggled', dr.autoLines);
    dr._autoLines = null;
    updateChart(false); // 未来空间 + 重算
  } else if (id === 'hide') {
    dr.visible = !dr.visible;
    btn.classList.toggle('toggled', !dr.visible);
    redrawDrawings();
  } else if (id === 'undo') {
    drawUndo();
  } else if (id === 'clear') {
    if (!dr.drawings.length) return;
    if (!confirm('清空当前代码/周期下的全部 ' + dr.drawings.length + ' 条画线?')) return;
    dr.undo.push({ op: 'del-all', list: dr.drawings });
    dr.drawings = [];
    dr.selectedId = null;
    dr.suggest = null;
    scheduleSave();
    redrawDrawings();
  }
}

// ── 选中画线的迷你菜单 ──
function buildDrawMenu() {
  const box = document.getElementById('draw-menu-colors');
  box.innerHTML = '';
  Drawings.PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.className = 'dm-dot';
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => {
      const d = getSelected();
      if (!d) return;
      d.style.color = c;
      scheduleSave();
      redrawDrawings();
    });
    box.appendChild(b);
  });
  document.getElementById('dm-width').addEventListener('click', () => {
    const d = getSelected();
    if (!d) return;
    d.style.width = d.style.width === 2 ? 1 : 2;
    document.getElementById('dm-width').textContent = d.style.width === 2 ? '粗' : '细';
    scheduleSave();
    redrawDrawings();
  });
  document.getElementById('dm-extend').addEventListener('click', () => {
    const d = getSelected();
    if (!d) return;
    d.extendRight = !d.extendRight;
    document.getElementById('dm-extend').style.color = d.extendRight ? '#e6a23c' : '';
    scheduleSave();
    updateChart(false); // 延伸开关影响未来bar空间
  });
  document.getElementById('dm-delete').addEventListener('click', () => deleteSelectedDrawing());
}

function getSelected() {
  return STATE.draw.drawings.find(d => d.id === STATE.draw.selectedId) || null;
}

function showDrawMenu() {
  const d = getSelected();
  const menu = document.getElementById('draw-menu');
  if (!d) { hideDrawMenu(); return; }
  menu.style.display = 'flex';
  document.querySelectorAll('#draw-menu .dm-dot').forEach(b => {
    b.classList.toggle('active', b.title === d.style.color);
  });
  document.getElementById('dm-width').textContent = d.style.width === 2 ? '粗' : '细';
  const ext = document.getElementById('dm-extend');
  ext.style.color = d.extendRight ? '#e6a23c' : '';
  const canExtend = ['trend', 'fib', 'regression', 'position', 'rect'].includes(d.type);
  ext.style.display = canExtend ? '' : 'none';
  positionDrawMenu();
}

function positionDrawMenu() {
  const d = getSelected();
  const menu = document.getElementById('draw-menu');
  if (!d || menu.style.display === 'none') return;
  const ctx = drawCtx();
  if (!ctx) return;
  const P = drawMapper();
  const hs = Drawings.handlesOf(d, P, ctx);
  if (!hs.length) return;
  const wrap = document.getElementById('chart-wrap');
  menu.style.left = Math.max(4, Math.min(hs[0].x, wrap.clientWidth - menu.offsetWidth - 4)) + 'px';
  menu.style.top = Math.max(4, hs[0].y + 14) + 'px';
}

function hideDrawMenu() {
  document.getElementById('draw-menu').style.display = 'none';
}

// ── 修正建议浮框 ──
function positionSuggestBox() {
  const sug = STATE.draw.suggest;
  const box = document.getElementById('draw-suggest');
  if (!sug) { box.style.display = 'none'; return; }
  const ctx = drawCtx();
  if (!ctx) return;
  const P = drawMapper();
  const x = P.x(sug.points[0].i), y = P.y(sug.points[0].p);
  const wrap = document.getElementById('chart-wrap');
  box.style.display = 'flex';
  box.style.left = Math.max(4, Math.min(x + 12, wrap.clientWidth - box.offsetWidth - 4)) + 'px';
  box.style.top = Math.max(4, y - 30) + 'px';
}

function hideSuggestBox() {
  document.getElementById('draw-suggest').style.display = 'none';
}

function adoptSuggest() {
  const dr = STATE.draw;
  const sug = dr.suggest;
  if (!sug) return;
  const d = dr.drawings.find(x => x.id === sug.forId);
  const ctx = drawCtx();
  if (d && ctx) {
    dr.undo.push({ op: 'move', id: d.id, before: JSON.parse(JSON.stringify(d.points)) });
    d.points = sug.points.map(pt => Drawings.pointFromIdx(pt.i, pt.p, ctx.dateMap, ctx.n));
    scheduleSave();
  }
  dr.suggest = null;
  redrawDrawings();
}

// ── 文本标注输入 ──
function openTextInput(info, pt) {
  const box = document.getElementById('draw-text-input');
  const field = document.getElementById('draw-text-field');
  const wrap = document.getElementById('chart-wrap');
  box.style.display = 'block';
  box.style.left = Math.min(info.px + 8, wrap.clientWidth - 180) + 'px';
  box.style.top = Math.max(4, info.py - 14) + 'px';
  field.value = '';
  // mousedown 处理器内同步 focus 仍可能被浏览器默认行为覆盖, 延迟到下一拍再聚焦
  setTimeout(() => field.focus(), 0);
  const commit = () => {
    const text = field.value.trim();
    cleanup();
    if (!text) return;
    const ctx = drawCtx();
    if (!ctx) return;
    const d = Drawings.createDrawing('text', [Drawings.pointFromIdx(pt.idx, pt.price, ctx.dateMap, ctx.n)], { text });
    STATE.draw.drawings.push(d);
    STATE.draw.undo.push({ op: 'add', id: d.id });
    scheduleSave();
    redrawDrawings();
  };
  const cleanup = () => {
    box.style.display = 'none';
    field.removeEventListener('keydown', onKey);
    field.removeEventListener('blur', commit);
  };
  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { cleanup(); }
  };
  field.addEventListener('keydown', onKey);
  field.addEventListener('blur', commit);
}

function onDrawEscape() {
  const dr = STATE.draw;
  if (dr.draft) { cancelDraft(); return true; }
  if (dr.selectedId) { selectDrawing(null); return true; }
  if (dr.tool !== 'select') { setDrawTool('select'); return true; }
  return false;
}

// ── 服务器同步 ──
async function loadDrawings() {
  const key = STATE.symbol + ':' + STATE.period;
  if (STATE.draw._loadedKey === key) { redrawDrawings(); return; }
  if (STATE.period === 'intraday') return;
  STATE.draw._loadedKey = key;
  try {
    const resp = await fetch(`/api/drawings?symbol=${encodeURIComponent(STATE.symbol)}&period=${encodeURIComponent(STATE.period)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (STATE.symbol + ':' + STATE.period !== key) return; // 竞态
    STATE.draw.drawings = (data.drawings || []).map(d => Drawings.normalize(d));
    STATE.draw.undo = [];
    STATE.draw.selectedId = null;
    STATE.draw.suggest = null;
    STATE.draw._autoLines = null;
  } catch (e) { /* 离线/未登录: 画线仅本会话内存态 */ }
  redrawDrawings();
}

let _saveTimer = null;
function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveDrawings, 800);
}

async function saveDrawings() {
  if (STATE.period === 'intraday') return;
  try {
    await fetch('/api/drawings', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        symbol: STATE.symbol, period: STATE.period, drawings: STATE.draw.drawings,
      }),
    });
  } catch (e) { /* 静默: 下次编辑再同步 */ }
}

// 修正建议浮框按钮
document.getElementById('ds-adopt').addEventListener('click', adoptSuggest);
document.getElementById('ds-ignore').addEventListener('click', () => { STATE.draw.suggest = null; hideSuggestBox(); });
buildDrawMenu();

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initChart();

  // Restore saved config (theme, panels, etc.)
  loadConfig();

  // ── 自动主题: 系统偏好 > 时间 ──
  if (STATE._themeAuto) {
    applyTheme(detectSystemTheme());
    // 监听系统主题变化
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onSystemThemeChange);
    }
    // 每30分钟检查时间触发切换 (6:00→亮, 18:00→暗)
    setInterval(() => {
      if (!STATE._themeAuto) return;
      const sys = detectSystemTheme();
      if (sys !== STATE.theme) { applyTheme(sys); saveConfig(); }
    }, 30 * 60 * 1000);
  }

  // Search autocomplete
  const symInput = document.getElementById('symbol-input');
  const dropdown = document.getElementById('search-dropdown');
  let searchTimer = null, activeIdx = -1, searchResults = [];

  function doSearch() {
    const q = symInput.value.trim();
    if (!q || q.length < 1) { closeDropdown(); return; }
    fetch(`/api/search?q=${encodeURIComponent(q)}`)
      .then(r => r.json())
      .then(data => {
        searchResults = data.results || [];
        activeIdx = -1;
        renderDropdown();
      }).catch(() => closeDropdown());
  }

  function renderDropdown() {
    if (searchResults.length === 0) { closeDropdown(); return; }
    dropdown.innerHTML = searchResults.map((r, i) => {
      const badge = searchBadge(r)
        ? `<span class="type-badge tb-${badgeType(r)}">${searchBadge(r)}</span>` : '';
      return `<div class="item${i === activeIdx ? ' active' : ''}" data-idx="${i}">
        ${badge}${esc(r.name)}<span class="code">${esc(r.code)}</span>
      </div>`;
    }).join('');
    dropdown.classList.add('show');
    // Click + hover handlers
    dropdown.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        selectResult(parseInt(el.dataset.idx));
      });
      el.addEventListener('mouseenter', () => {
        // 只更新 active 状态，不重建 DOM
        dropdown.querySelectorAll('.item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        activeIdx = parseInt(el.dataset.idx);
      });
    });
  }

  function closeDropdown() {
    dropdown.classList.remove('show');
    searchResults = [];
    activeIdx = -1;
  }

  function selectResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    const r = searchResults[idx];
    closeDropdown();
    STATE._lastSearchType = r.type || '';
    switchSymbol(r.symbol);
    if (STATE.period === 'intraday') {
      STATE.intradayData = null;
      fetchIntraday();
    } else {
      refresh();
    }
  }

  symInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 250);
  });

  symInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, searchResults.length - 1);
      renderDropdown();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      renderDropdown();
    } else if (e.key === 'Enter') {
      if (activeIdx >= 0 && searchResults.length > 0) {
        e.preventDefault();
        selectResult(activeIdx);
      } else {
        refresh();
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  // Click outside to close dropdown
  document.addEventListener('click', (ev) => {
    if (!symInput.contains(ev.target) && !dropdown.contains(ev.target)) {
      closeDropdown();
    }
  });

  // ── 全局快捷键 (输入时失效): / 或 Ctrl+K 聚焦搜索, 1-9 切周期, Esc 关弹层 ──
  const PERIOD_KEYS = { '1': '1d', '2': '1w', '3': '1M', '4': 'intraday', '5': '1m', '6': '5m', '7': '15m', '8': '30m', '9': '60m' };
  document.addEventListener('keydown', (e) => {
    // 文本标注输入中: Esc/Enter 由输入框自身处理, 画线快捷键全部让路
    if (e.target && e.target.id === 'draw-text-field') return;
    if (e.key === 'Escape') {
      if (STATE.draw.enabled && onDrawEscape()) return;
      closeDropdown(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      symInput.focus();
      symInput.select();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && STATE.draw.enabled) {
      e.preventDefault();
      drawUndo();
      return;
    }
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (deleteSelectedDrawing()) e.preventDefault();
      return;
    }
    if (e.key === 'Enter' && STATE.draw.enabled && STATE.draw.draft && STATE.draw.draft.tool === 'poly') {
      finishPolyDraft();
      return;
    }
    if (e.key === '/') {
      e.preventDefault();
      symInput.focus();
      symInput.select();
    } else if (PERIOD_KEYS[e.key]) {
      switchPeriod(PERIOD_KEYS[e.key]);
    }
  });

  // Restore last search from history (本地) + 与账号同步
  renderHistoryTags();
  const hist = loadHistory();
  if (hist.length > 0) {
    const last = hist[0];
    document.getElementById('symbol-input').value = last.symbol;
    STATE.symbol = last.symbol;
  }

  // 支持从交易记录等页面跳转 ?symbol=000001.SZ 自动加载 (URL 参数优先于历史恢复)
  const jumpSymbol = new URLSearchParams(location.search).get('symbol');
  if (jumpSymbol) {
    document.getElementById('symbol-input').value = jumpSymbol;
    STATE.symbol = jumpSymbol;
  }
  syncSymbolUrl(true); // 规范化入口 URL, 浏览器返回键可回溯历史股票

  // 浏览器返回/前进: 回到上一只/下一只股票 (对标 TradingView)
  window.addEventListener('popstate', () => {
    const s = new URLSearchParams(location.search).get('symbol');
    if (!s || s === STATE.symbol) return;
    STATE.symbol = s;
    document.getElementById('symbol-input').value = s;
    loadCurrent();
  });

  // 点击代码复制 (便捷性: 分享/输入时一键取码)
  const codeEl = document.getElementById('info-code');
  codeEl.style.cursor = 'pointer';
  codeEl.title = '点击复制代码';
  codeEl.addEventListener('click', () => {
    if (!STATE.symbol) return;
    navigator.clipboard?.writeText(STATE.symbol)
      .then(() => showToast('已复制 ' + STATE.symbol))
      .catch(() => {});
  });

  // First load: 本地无历史时先等服务端同步，再拉 K 线（解决清站点数据后记录丢失）
  const container = document.getElementById('chart-container');
  let initDone = false;
  const initRender = () => { if (!initDone) { initDone = true; refresh(); } };
  const scheduleInit = () => {
    if (container.clientHeight > 0) {
      requestAnimationFrame(() => requestAnimationFrame(initRender));
    } else {
      const ro = new ResizeObserver(() => { if (container.clientHeight > 0) { ro.disconnect(); initRender(); } });
      ro.observe(container);
    }
  };
  if (!hist.length && !jumpSymbol) {
    syncHistoryWithServer().then(() => {
      const synced = loadHistory();
      if (synced.length > 0) {
        document.getElementById('symbol-input').value = synced[0].symbol;
        STATE.symbol = synced[0].symbol;
        syncSymbolUrl(true);
      }
      scheduleInit();
    }).catch(scheduleInit);
  } else {
    syncHistoryWithServer();
    scheduleInit();
  }


  // 时间 1s 刷新
  setInterval(() => {
    document.getElementById('info-time').textContent = new Date().toLocaleTimeString();
  }, 1000);

  // 盘中自动刷新: 快照 / 分时 / 分钟K 分开间隔; 午休、周末、节假日不拉
  STATE._lastQuoteAt = 0;
  STATE._lastBarAt = 0;
  STATE._lastBarPatchDrawAt = 0;
  STATE._pendingBarPatch = false;
  STATE._serverTradingDay = null; // false = 节假日 (交易日历)
  STATE._serverInSession = null;  // 服务端北京时间判定盘中 (含交易日历/午休)

  function inAshareSession() {
    // 服务端判定优先, 浏览器时区不再影响刷新启停;
    // ping 未就绪/失败时才回退本地时钟 (仅 UTC+8 浏览器准确)
    if (STATE._serverInSession !== null) return STATE._serverInSession;
    const now = new Date();
    const d = now.getDay();
    if (d === 0 || d === 6) return false;
    const t = now.getHours() * 60 + now.getMinutes();
    return (t >= 9 * 60 + 30 && t <= 11 * 60 + 30) || (t >= 13 * 60 && t <= 15 * 60);
  }

  function canAutoRefresh() {
    if (document.hidden) return false; // 后台标签页暂停轮询 (省电省流量), 切回自动恢复
    if (!inAshareSession()) return false;
    if (STATE._serverTradingDay === false) return false;
    return true;
  }

  async function syncSessionFlag() {
    try {
      const r = await fetch('/api/ping');
      const d = await r.json();
      if (typeof d.is_trading_day === 'boolean') STATE._serverTradingDay = d.is_trading_day;
      if (typeof d.in_session === 'boolean') STATE._serverInSession = d.in_session;
    } catch (e) { /* 失败时仅用本地时段 */ }
  }
  syncSessionFlag();
  setInterval(syncSessionFlag, 60e3);

  // 选股后台扫描状态: 每 10s 轻量轮询, 运行中入口脉冲 + 进度
  async function refreshScreenerBadge() {
    if (document.hidden) return;
    try {
      const s = await api("/api/screener/status");
      const btn = document.getElementById("screener-entry");
      if (!btn) return;
      if (s.running) {
        const pct = s.total ? Math.round((s.progress || 0) / s.total * 100) : 0;
        btn.classList.add("scanning");
        btn.innerHTML = `🎯 ${pct}%`;
        btn.title = `选股扫描中 ${s.progress || 0}/${s.total} (后台运行, 关页不中断)`;
        STATE._scanWasRunning = true;
      } else if (STATE._scanWasRunning) {
        STATE._scanWasRunning = false;
        btn.classList.remove("scanning");
        btn.innerHTML = "🎯 选股";
        btn.title = "条件选股: MACD金叉/MA20/筹码获利等";
        showToast(`选股扫描完成: 命中 ${(s.results || []).length} 只`);
      }
    } catch (e) { /* ignore */ }
  }
  refreshScreenerBadge();
  setInterval(refreshScreenerBadge, 10e3);

  setInterval(() => {
    if (!canAutoRefresh()) return;
    const now = Date.now();
    if (now - (STATE._lastQuoteAt || 0) >= QUOTE_REFRESH_MS) {
      STATE._lastQuoteAt = now;
      fetchQuote();
    }
    if (STATE.period === 'intraday') {
      if (now - (STATE._lastBarAt || 0) >= INTRADAY_REFRESH_MS) fetchIntraday();
    } else if (MINUTE_PERIODS.includes(STATE.period)) {
      const iv = MINUTE_REFRESH_MS[STATE.period] || 60e3;
      if (now - (STATE._lastBarAt || 0) >= iv) fetchData({ silent: true });
    }
    if (STATE._pendingBarPatch && STATE.period === '1d') {
      if (now - (STATE._lastBarPatchDrawAt || 0) >= LAST_BAR_PATCH_MS) {
        if (patchLastBarOnChart()) {
          STATE._lastBarPatchDrawAt = now;
          STATE._pendingBarPatch = false;
        }
      }
    }
    // 筹码分布: 盘中约 5 分钟重取一次
    if (isChipPeriod(STATE.period) && document.getElementById('chk-chip').checked
        && now - (STATE._lastChipsAt || 0) >= 300e3) {
      STATE._lastChipsAt = now;
      fetchChips(STATE.symbol);
    }
    // 五档: 盘中约 3s 刷新 (20/min = 2/3 × 30)
    if (STATE.period === 'intraday' && depthPanelOn()
        && now - (STATE._lastDepthAt || 0) >= 3000) {
      STATE._lastDepthAt = now;
      fetchDepth();
    }
  }, 1000);
});
