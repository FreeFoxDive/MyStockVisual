function loadConfig() {
  // 主题优先于面板配置应用: 即使本页尚无 visual-config (首次访问),
  // 也要读取共享键 visual-theme (与交易记录页同步), 避免被 auto 默认值覆盖
  try {
    const shared = VisualTheme.load();
    const hasShared = localStorage.getItem(VisualTheme.KEY) || localStorage.getItem(VisualTheme.LEGACY_KEY);
    const cfgRaw = localStorage.getItem(CFG_KEY);
    if (hasShared) {
      STATE._themeAuto = shared.auto === true;
      if (!STATE._themeAuto) applyTheme(shared.theme);
    } else {
      const cfgLegacy = cfgRaw ? JSON.parse(cfgRaw) : null;
      if (cfgLegacy && cfgLegacy.theme) {
        // themeAuto=true → 自动; 否则 → 锁定 (旧配置无themeAuto视为手动)
        STATE._themeAuto = cfgLegacy.themeAuto === true;
        if (!STATE._themeAuto) applyTheme(cfgLegacy.theme);
      } else {
        // 无任何配置时默认自动主题
        STATE._themeAuto = true;
      }
    }
  } catch(e) {}
  try {
    const cfg = JSON.parse(localStorage.getItem(CFG_KEY));
    if (cfg) applyConfig(cfg);
  } catch(e) {}
}

/** 把一份面板配置应用到 DOM/STATE (本地配置与服务器配置共用) */
function applyConfig(cfg) {
  if (!cfg) return;
  document.getElementById('chk-volume').checked = cfg.volume !== false;
  document.getElementById('chk-macd').checked = cfg.macd !== false;
  document.getElementById('chk-kdj').checked = !!cfg.kdj;
  document.getElementById('chk-rsi').checked = !!cfg.rsi;
  document.getElementById('chk-atr').checked = !!cfg.atr;
  document.getElementById('chk-obv').checked = !!cfg.obv;
  document.getElementById('chk-chip').checked = cfg.chip !== false;
  document.getElementById('chk-info').checked = cfg.info !== false;
  document.getElementById('chk-depth').checked = cfg.depth !== false;
  document.getElementById('tip-rsi').checked = cfg.tipRsi !== false;
  document.getElementById('tip-kdj').checked = cfg.tipKdj !== false;
  document.getElementById('tip-atr').checked = cfg.tipAtr !== false;
  const chkImpulse = document.getElementById('chk-impulse');
  chkImpulse.checked = !!cfg.impulse;
  STATE.impulseEnabled = !!cfg.impulse;
  const chkChannel = document.getElementById('chk-channel');
  chkChannel.checked = !!cfg.channel;
  STATE.channelEnabled = !!cfg.channel;
  const chkGap = document.getElementById('chk-gap');
  // 缺省开启；仅当配置显式 false 时关闭
  chkGap.checked = cfg.gap !== false;
  STATE.gapEnabled = cfg.gap !== false;
  // 新指标面板 / 复权 / 对数轴 / 参数
  document.getElementById('chk-boll').checked = !!cfg.boll;
  document.getElementById('chk-wr').checked = !!cfg.wr;
  document.getElementById('chk-cci').checked = !!cfg.cci;
  document.getElementById('chk-bias').checked = !!cfg.bias;
  document.getElementById('chk-dmi').checked = !!cfg.dmi;
  document.getElementById('chk-cross').checked = cfg.cross !== false; // 默认开启
  document.getElementById('chk-patterns').checked = cfg.patterns !== false; // 默认开启
  document.getElementById('chk-risk').checked = cfg.risk !== false; // 默认开启
  document.getElementById('chk-log').checked = !!cfg.logScale;
  STATE.logScale = !!cfg.logScale;
  STATE.adjust = ['forward', 'hfq', 'none'].includes(cfg.adjust) ? cfg.adjust : 'forward';
  document.getElementById('adj-select').value = STATE.adjust;
  if (Array.isArray(cfg.maPeriods) && cfg.maPeriods.length === 3
      && cfg.maPeriods.every(n => Number.isInteger(n) && n > 0 && n <= 250)) {
    STATE.maPeriods = cfg.maPeriods.slice();
  }
  if (cfg.bollParams && Number.isInteger(cfg.bollParams.n) && cfg.bollParams.n > 1
      && Number.isFinite(cfg.bollParams.k) && cfg.bollParams.k > 0) {
    STATE.bollParams = { n: cfg.bollParams.n, k: cfg.bollParams.k };
  }
  // 旧版 periodMore 配置已废弃；周期改为固定单行滚动，不再改变工具栏高度。
  if (cfg.indMore === true) {
    STATE._indMore = true;
    document.getElementById('indicator-bar').classList.add('show-extra');
  }
}

// ── 面板设置服务器同步 (跟账号; 默认开启) ──
const PANEL_CFG_PUSH_DELAY = 1000;
let _panelCfgTimer = null;
let _panelCfgSuppress = false;  // 应用服务端配置期间抑制回推, 防回声

/** 上传载荷: 剔除主题 (主题走共享本地键 visual-theme, 不做账号同步) */
function panelCfgPayload(cfg) {
  const out = Object.assign({}, cfg);
  delete out.theme;
  delete out.themeAuto;
  return out;
}

function scheduleSavePanelConfig() {
  if (_panelCfgSuppress) return;
  clearTimeout(_panelCfgTimer);
  _panelCfgTimer = setTimeout(pushPanelConfig, PANEL_CFG_PUSH_DELAY);
}

async function pushPanelConfig() {
  if (_panelCfgSuppress) return;
  try {
    await fetch('/api/me/panel-config', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ config: panelCfgPayload(buildConfig()) }),
    });
  } catch (e) { /* 未登录/离线: 静默, 下次改动再同步 */ }
}

/** 启动对齐: 服务端有配置 → 合并覆盖本地; 服务端为空 → 用本地(或默认)初始化账号配置 */
async function syncPanelConfigWithServer() {
  try {
    const resp = await fetch('/api/me/panel-config', { credentials: 'same-origin' });
    if (!resp.ok) return false;
    const server = (await resp.json()).config || {};
    if (!Object.keys(server).length) {
      pushPanelConfig();
      return false;
    }
    let local = {};
    try { local = JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch (_) {}
    const merged = Object.assign({}, local, server);
    _panelCfgSuppress = true;
    try {
      applyConfig(merged);
      try { localStorage.setItem(CFG_KEY, JSON.stringify(merged)); } catch (_) {}
    } finally {
      _panelCfgSuppress = false;
    }
    return true;
  } catch (e) { return false; }
}

// ═══════════════════════════════════════════════════════════════
// INTRADAY (分时图)
// ═══════════════════════════════════════════════════════════════
async function fetchIntraday(opts) {
  if (STATE.period !== 'intraday') return;
  const symbol = STATE.symbol;
  const fetchTs = Date.now(); STATE._intraFetchTs = fetchTs;
  STATE._lastBarAt = fetchTs;
  const _cacheKey = `vi_${symbol}_1m`;

  // ── 浏览器缓存 ──
  let cacheHit = false;
  if (!STATE.intradayData) {
    try {
      const raw = localStorage.getItem(_cacheKey);
      if (raw) {
        const cached = JSON.parse(raw);
        if (Date.now() - cached.ts < 120000 && cached.data) {  // 120s TTL
          STATE.intradayData = cached.data;
          renderIntraday(cached.data);
          fetchDepth();
          cacheHit = true;
        }
      }
    } catch(e) { /* ignore */ }
  }

  const loading = !cacheHit && !STATE.intradayData && !(opts && opts.retainChart);
  if (loading && STATE.chart) STATE.chart.showLoading({ text: '加载中...', maskColor: 'rgba(0,0,0,0.15)' });
  try {
    const [idResp, qResp] = await Promise.all([
      fetch(`/api/intraday?symbol=${encodeURIComponent(symbol)}&period=1m&count=240`),
      // /api/quotes keeps an unavailable snapshot as an empty 200 response;
      // a transient upstream miss must not produce a noisy 404 in the console.
      fetch(`/api/quotes?symbols=${encodeURIComponent(symbol)}`),
      // 分时图也画持仓风控线/显示「持仓中」徽章, 交易记录要跟 K 线一样随后台请求走
      loadTrades(symbol),
    ]);
    const id = await idResp.json();
    const quoteBody = await qResp.json();
    const quote = quoteBody && quoteBody[symbol] || liveQuotes.get(symbol) || null;
    if (STATE._intraFetchTs !== fetchTs) return;
    if (!id.bars || id.bars.length === 0) { if (loading) showToast('暂无分时数据'); return; }
    id.prev_close = (liveQuotes.get(symbol) || quote || {}).prev_close;
    STATE.intradayData = id;
    if (quote) applyQuoteData(quote);
    renderIntraday(STATE.intradayData);
    fetchDepth();  // 五档初始拉取
    // 保存到 localStorage
    try {
      localStorage.setItem(_cacheKey, JSON.stringify({ ts: Date.now(), data: id }));
      _cleanLocalStorage();
    } catch(e) { /* ignore */ }
  } catch(e) { if (loading) showToast('分时数据获取失败: ' + e.message, { type: 'err', actionLabel: '重试', onAction: () => fetchIntraday() }); }
  finally { if (loading && STATE.chart) STATE.chart.hideLoading(); }
}

function renderIntraday(data) {
  const chart = STATE.chart;
  // 左侧栏 (基本信息 + 五档): 显隐 + 用当前缓存渲染
  showSidePanel(sidePanelOn());
  showDepthSection(depthSecOn());
  if (sidePanelOn() && !STATE.stockInfo) fetchStockInfo();
  if (STATE.depth) renderDepth(STATE.depth);
  if (!chart) return; // echarts 兜底: 图表不可用时仍保证侧栏可用
  const gridLeft = panelGridLeft();
  const bars = data.bars;
  const times = bars.map(b => b.time);
  const ohlc = bars.map(b => {
    const value = [b.open, b.close, b.low, b.high];
    if (isHaltBar(b)) return { value, itemStyle: haltCandleStyle() };
    return value;
  });

  const showVolume = document.getElementById('chk-volume').checked;
  const showMacd = document.getElementById('chk-macd').checked;
  const showKdj = document.getElementById('chk-kdj').checked;
  const showRsi = document.getElementById('chk-rsi').checked;
  const showAtr = document.getElementById('chk-atr').checked;
  const subPanels = [showMacd, showKdj, showRsi, showAtr].filter(Boolean).length;

  // 有成交量时 K线 45%, 无成交量时 K线 70%
  const klineH = showVolume ? (subPanels > 0 ? 40 : 65) : (subPanels > 0 ? 55 : 78);
  const nextTop = 12 + klineH + 3;
  const subStart = showVolume ? (nextTop + 13) : nextTop;

  const grids = [{ left: gridLeft, right: '2%', top: '12%', height: `${klineH}%` }];
  const xAxes = [{ gridIndex: 0, type: 'category', data: times, show: false }];
  const yAxes = [{ gridIndex: 0, type: 'value', scale: true, position: 'left', splitLine: { lineStyle: { color: C().gridLine } }, axisLabel: { color: C().text, fontSize: 11 } }];
  const series = [
    { name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, data: ohlc,
      itemStyle: { color: C().up, color0: C().down, borderColor: C().up, borderColor0: C().down },
      markLine: buildKlineMarkLines(bars) },
  ];
  const zoomIndices = [0];
  let gi = 1;
  let xAxisShowBase = false; // 最后才设 true

  // 成交量（可关闭）
  if (showVolume) {
    const vols = bars.map(b => {
      if (isHaltBar(b)) return { value: b.volume || 0, itemStyle: { color: C().halt } };
      const up = (b.close || 0) >= (b.open || 0);
      return { value: b.volume || 0, itemStyle: { color: up ? C().up : C().down } };
    });
    grids.push({ left: gridLeft, right: '2%', top: `${nextTop}%`, height: '11%' });
    xAxes.push({ gridIndex: gi, type: 'category', data: times, show: false, axisLabel: { color: C().text, fontSize: 10, rotate: 30, interval: 29 } });
    yAxes.push({ gridIndex: gi, type: 'value', scale: true, position: 'left', splitLine: { show: false }, axisLabel: { color: C().text, fontSize: 10, formatter: fmtVolume } });
    series.push({ name: '成交量', type: 'bar', xAxisIndex: gi, yAxisIndex: gi, data: vols });
    zoomIndices.push(gi);
    gi++;
  }
  const subList = [showMacd && 'macd', showKdj && 'kdj', showRsi && 'rsi', showAtr && 'atr'].filter(Boolean);
  const perSubH = subPanels > 0 ? Math.min(15, (93 - subStart) / subPanels) : 0;

  subList.forEach((p, pi) => {
    const top = subStart + pi * perSubH;
    grids.push({ left: gridLeft, right: '2%', top: `${top}%`, height: `${perSubH - 1}%` });
    xAxes.push({ gridIndex: gi, type: 'category', data: times, show: false, axisLabel: { color: C().text, fontSize: 10, rotate: 30, interval: 29 } });
    yAxes.push({ gridIndex: gi, type: 'value', scale: true, position: 'left', splitLine: { lineStyle: { color: C().gridLine } }, axisLabel: { color: C().text, fontSize: 9 } });
    zoomIndices.push(gi);
    if (p === 'macd') {
      series.push(
        { name: 'DIF', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.macd_dif), symbol: 'none', lineStyle: { color: C().macdDif, width: 1 } },
        { name: 'DEA', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.macd_dea), symbol: 'none', lineStyle: { color: C().macdDea, width: 1 } },
        { name: 'MACD柱', type: 'bar', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => ({ value: b.macd_hist, itemStyle: { color: (b.macd_hist || 0) >= 0 ? C().up : C().down } })) },
      );
    } else if (p === 'kdj') {
      series.push(
        { name: 'K', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.kdj_k), symbol: 'none', lineStyle: { color: C().kdjK, width: 1 } },
        { name: 'D', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.kdj_d), symbol: 'none', lineStyle: { color: C().kdjD, width: 1 } },
        { name: 'J', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.kdj_j), symbol: 'none', lineStyle: { color: C().kdjJ, width: 1 } },
      );
    } else if (p === 'rsi') {
      series.push(
        { name: 'RSI1', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.rsi6), symbol: 'none', lineStyle: { color: C().rsi6, width: 1 } },
        { name: 'RSI2', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.rsi12), symbol: 'none', lineStyle: { color: C().rsi12, width: 1 } },
        { name: 'RSI3', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.rsi24), symbol: 'none', lineStyle: { color: C().rsi24, width: 1 } },
      );
    } else if (p === 'atr') {
      series.push(
        { name: 'ATR(14)', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: bars.map(b => b.atr14), symbol: 'none', areaStyle: { color: 'rgba(144,164,174,0.08)' }, lineStyle: { color: C().atr, width: 1 } },
      );
    }
    gi++;
  });

  // 参考线：RSI 30/70, KDJ 20/80, MACD 零轴
  series.forEach(s => {
    if (showRsi && s.name === 'RSI1') {
      s.markLine = { silent: true, symbol: 'none', lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
        data: [{ yAxis: 70, label: { show: true, formatter: '70', color: C().text, fontSize: 10 } }, { yAxis: 30, label: { show: true, formatter: '30', color: C().text, fontSize: 10 }, lineStyle: { color: C().oversold } }] };
    }
    if (showKdj && s.name === 'K') {
      s.markLine = { silent: true, symbol: 'none', lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
        data: [{ yAxis: 80, label: { show: true, formatter: '80', color: C().text, fontSize: 10 } }, { yAxis: 20, label: { show: true, formatter: '20', color: C().text, fontSize: 10 }, lineStyle: { color: C().oversold } }] };
    }
    if (showMacd && s.name === 'DIF') {
      s.markLine = { silent: true, symbol: 'none', lineStyle: { color: C().zeroLine, type: 'solid', width: 1 },
        label: { show: false }, data: [{ yAxis: 0 }] };
    }
  });

  const option = {
    backgroundColor: C().bg,
    animation: false,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: C().tipBg,
      borderColor: C().tipBorder,
      textStyle: { color: C().tipText, fontSize: 12, fontFamily: 'monospace' },
      formatter: function(ps) {
        const idx = ps[0] && ps[0].dataIndex;
        const b = data.bars[idx];
        if (!b) return '';
        const prevBar = idx > 0 ? data.bars[idx - 1] : null;
        const pc = prevBar ? prevBar.close : b.open;
        const cFn = v => v == null ? '—' : `<span style="color:${v>pc?C().up:v<pc?C().down:C().tipText}">${fmtPrice3(v)}</span>`;
        let h = `<div><b>${b.time}</b>${haltLabel(b)}</div><div>开 ${cFn(b.open)} 高 ${cFn(b.high)} 低 ${cFn(b.low)} 收 ${cFn(b.close)}</div><div>量 ${fmtVolume(b.volume)}</div>`;
        if (showMacd && b.macd_dif != null) h += `<div>MACD DIF ${b.macd_dif.toFixed(3)} DEA ${b.macd_dea.toFixed(3)}</div>`;
        const cKdjV = (v,clr) => v == null ? '—' : `<span style="color:${v>80?C().overbought:v<20?C().oversold:clr}">${v.toFixed(2)}</span>`;
        const cRsiV = (v,clr) => v == null ? '—' : `<span style="color:${v>70?C().overbought:v<30?C().oversold:clr}">${v.toFixed(1)}</span>`;
        if (document.getElementById('tip-kdj').checked && b.kdj_k != null) h += `<div><span style="color:${C().kdjK}">K</span> ${cKdjV(b.kdj_k,C().kdjK)} <span style="color:${C().kdjD}">D</span> ${cKdjV(b.kdj_d,C().kdjD)} <span style="color:${C().kdjJ}">J</span> ${cKdjV(b.kdj_j,C().kdjJ)}</div>`;
        if (document.getElementById('tip-rsi').checked && b.rsi6 != null) h += `<div><span style="color:${C().rsi6}">RSI1</span> ${cRsiV(b.rsi6,C().rsi6)} <span style="color:${C().rsi12}">RSI2</span> ${cRsiV(b.rsi12,C().rsi12)} <span style="color:${C().rsi24}">RSI3</span> ${cRsiV(b.rsi24,C().rsi24)}</div>`;
        if (document.getElementById('tip-atr').checked && b.atr14 != null) h += `<div><span style="color:${C().atr}">ATR</span> ${b.atr14.toFixed(3)}</div>`;
        return h;
      }
    },
    grid: grids, xAxis: xAxes, yAxis: yAxes,
    dataZoom: [
      { type: 'inside', xAxisIndex: zoomIndices, start: 0, end: 100 },
      { type: 'slider', xAxisIndex: zoomIndices, top: 2, height: 16,
        borderColor: C().gridLine, backgroundColor: 'transparent',
        fillerColor: 'rgba(128,128,128,0.15)', handleStyle: { color: C().text },
        textStyle: { color: C().text, fontSize: 10 } }
    ],
    series: series,
  };
  // 最后面板显示日期（setOption 之前设置）
  if (xAxes.length > 0) xAxes[xAxes.length - 1].show = true;
  // notMerge 会替换上一周期的坐标轴/系列，但不先清空 canvas，切换时旧图可保留到新图就绪。
  // 同样必须同步提交 (见 updateChart 处的说明): 换 model 与跑数据管线不能跨帧, 否则旧元素会在
  // 这一帧里命中无数据的新 series, 鼠标事件一碰就抛 TypeError。
  chart.setOption(option, { notMerge: true, silent: true });
  // 分时面板名称标签 (graphic)
  const igraphics = [];
  const iLabels = { macd: 'MACD', kdj: 'KDJ', rsi: 'RSI', atr: 'ATR' };
  const iColors = { macd: C().macdDif, kdj: C().kdjK, rsi: C().rsi6, atr: C().macdDif };
  let gIdx = showVolume ? 1 : 0;
  subList.forEach((p, pi) => {
    const gTop = parseFloat(grids[gIdx + 1 + pi].top) / 100 * chart.getHeight();
    igraphics.push({
      type: 'text', left: 10, top: gTop + 2,
      style: { text: iLabels[p] || p, fill: iColors[p] || C().text, font: 'bold 11px monospace' },
      z: 100,
    });
  });
  // 成交量标签
  if (showVolume) {
    const vgTop = parseFloat(grids[1].top) / 100 * chart.getHeight();
    igraphics.push({
      type: 'text', left: 10, top: vgTop + 2,
      style: { text: 'VOL', fill: C().macdDif, font: 'bold 11px monospace' },
      z: 100,
    });
  }
  chart.setOption({ graphic: igraphics });
  cacheGridRects(grids);
  refreshPriceTagLayout(); // 分时也要按新刻度重排现价/风控签位
  // 分时视图无画线层: 清空 overlay, 避免 K 线周期的画线残留
  const ov = document.getElementById('draw-overlay');
  if (ov && ov.width) {
    const c2 = ov.getContext('2d');
    c2.setTransform(1, 0, 0, 1, 0, 0);
    c2.clearRect(0, 0, ov.width, ov.height);
  }
}

function onConfigChange() {
  STATE.impulseEnabled = document.getElementById('chk-impulse').checked;
  STATE.channelEnabled = document.getElementById('chk-channel').checked;
  STATE.gapEnabled = document.getElementById('chk-gap').checked;
  STATE.logScale = document.getElementById('chk-log').checked;
  STATE._maCache = null;  // 自定义 MA/BOLL 参数时客户端重算缓存失效
  saveConfig();
  // 打开筹码但尚未加载 → 触发拉取
  if (isChipPeriod(STATE.period) && document.getElementById('chk-chip').checked
      && !STATE.chips && STATE.klineData) {
    fetchChips(STATE.symbol);
  }
  // 侧栏开关 (信息/五档): 重排图/面板并即时拉取
  showSidePanel(sidePanelOn());
  showDepthSection(depthSecOn());
  if (depthSecOn()) fetchDepth();
  if (sidePanelOn() && !STATE.stockInfo) fetchStockInfo();
  syncPosition(); // 持仓徽章 + 风控线开关显隐 (线条由下方 onIndicatorChange 重建)
  onIndicatorChange();
}

/** 指标栏低频项折叠切换 (信息/五档/MA/金叉死叉/WR/CCI/BIAS/DMI/对数轴) */
function toggleIndMore() {
  const bar = document.getElementById('indicator-bar');
  bar.classList.toggle('show-extra');
  STATE._indMore = bar.classList.contains('show-extra');
  saveConfig();
}

/** 将当前周期滚入固定宽度的可视区，不改变任何布局高度。 */
function ensurePeriodVisible(period) {
  const btn = document.getElementById('btn-' + period);
  const viewport = document.getElementById('period-viewport');
  if (!btn || !viewport) return;
  const left = btn.offsetLeft - viewport.offsetLeft;
  const right = left + btn.offsetWidth;
  if (left < viewport.scrollLeft || right > viewport.scrollLeft + viewport.clientWidth) {
    viewport.scrollTo({ left: Math.max(0, left - (viewport.clientWidth - btn.offsetWidth) / 2), behavior: 'smooth' });
  }
}

function initPeriodScroller() {
  const viewport = document.getElementById('period-viewport');
  const left = document.getElementById('period-scroll-left');
  const right = document.getElementById('period-scroll-right');
  if (!viewport || !left || !right) return;
  const sync = () => {
    left.disabled = viewport.scrollLeft <= 1;
    right.disabled = viewport.scrollLeft + viewport.clientWidth >= viewport.scrollWidth - 1;
  };
  const move = direction => viewport.scrollBy({ left: direction * Math.max(120, viewport.clientWidth * .8), behavior: 'smooth' });
  left.addEventListener('click', () => move(-1));
  right.addEventListener('click', () => move(1));
  viewport.addEventListener('scroll', sync, { passive: true });
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(sync).observe(viewport);
  sync();
}

/** 复权切换: 重新拉取 (分钟周期固定前复权, 由后端钳制) */
function onAdjustChange(v) {
  STATE._prevAdjust = STATE.adjust;  // 切换失败时回退用
  STATE.adjust = ['forward', 'hfq', 'none'].includes(v) ? v : 'forward';
  document.getElementById('adj-select').value = STATE.adjust;
  saveConfig();
  STATE._maCache = null;
  fetchData();
}

/** 当前周期是否绘制缺口 markArea */
function gapsEnabledForPeriod() {
  return STATE.gapEnabled && typeof GapScanner !== 'undefined' && GapScanner.isGapPeriod(STATE.period);
}

/** 扫描并构建 K 线 markArea（无缺口时返回 undefined） */
function buildGapMarkArea(klines, dates) {
  if (!gapsEnabledForPeriod() || !klines || !klines.length) return undefined;
  const gaps = GapScanner.scanGaps(klines, { isHalt: isHaltBar });
  STATE._gaps = gaps;
  return GapScanner.buildMarkArea(gaps, dates, C());
}

/** 百分数归一: |v|<0.005 按 0 处理, 避免 "▼ -0.00%" (箭头向下数值为零) */
function normPct(v) {
  return (typeof v === 'number' && v !== 0 && Math.abs(v) < 0.005) ? 0 : v;
}

/** 涨跌幅文本: 颜色之外附加 ▲/▼ 形状冗余 (色盲友好) */
function pctLabel(v) {
  v = normPct(v);
  return (v >= 0 ? '▲ +' : '▼ ') + v.toFixed(2) + '%';
}

function updateQuoteDisplay(quote) {
  if (!quote || !quote.last_price) return;
  const p = quote.last_price, pc = quote.prev_close || p;
  const colorCls = p > pc ? 'up' : (p < pc ? 'down' : ''); // 红涨 绿跌 黑平
  const chgPct = pc > 0 ? ((p - pc) / pc * 100) : 0;
  const pf = fmtPrice3;

  document.getElementById('info-code').textContent = STATE.symbol.replace(/\.(SH|SZ|BJ)$/, '');
  document.getElementById('info-name').textContent = quote.name || '';
  document.getElementById('info-price').textContent = pf(p);
  document.getElementById('info-price').className = 'price ' + colorCls;
  document.getElementById('info-change').textContent = pctLabel(chgPct);
  document.getElementById('info-change').className = 'change ' + colorCls;
  if (quote.open != null) {
    const oCls = quote.open > pc ? 'up' : (quote.open < pc ? 'down' : '');
    const hCls = quote.high > pc ? 'up' : (quote.high < pc ? 'down' : '');
    const lCls = quote.low > pc ? 'up' : (quote.low < pc ? 'down' : '');
    document.getElementById('info-open').textContent = '开 ' + pf(quote.open);
    document.getElementById('info-open').className = 'oh ' + oCls;
    document.getElementById('info-high').textContent = '高 ' + pf(quote.high);
    document.getElementById('info-high').className = 'oh ' + hCls;
    document.getElementById('info-low').textContent = '低 ' + pf(quote.low);
    document.getElementById('info-low').className = 'oh ' + lCls;
  }
  document.getElementById('info-time').textContent = new Date().toLocaleTimeString();
  updateFundInfo(quote);
}

// CHART RENDERING
// ═══════════════════════════════════════════════════════════════
function initChart() {
  const dom = document.getElementById('chart-container');
  // CDN 兜底: ECharts 加载失败时给出提示, 工具栏/行情/五档等 DOM 功能不受影响
  if (typeof echarts === 'undefined') {
    dom.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;'
      + 'color:var(--text-secondary);font-size:13px;text-align:center;padding:0 16px;line-height:1.8">'
      + '图表库 (ECharts CDN) 加载失败，K线图暂不可用。<br>工具栏与行情信息不受影响，请检查网络后刷新重试。</div>';
    return;
  }
  STATE.chart = echarts.init(dom, null, { renderer: 'canvas' });
  // resize 时重渲染 (解决全屏/窗口变化后日期被截断)
  let resizeTimer, resizeFrame = 0;
  window.addEventListener('resize', () => {
    if (!resizeFrame) resizeFrame = requestAnimationFrame(() => {
      resizeFrame = 0;
      STATE.chart.resize({ animation: { duration: 0 } });
    });
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (STATE.period === 'intraday' && STATE.intradayData) renderIntraday(STATE.intradayData);
      else if (STATE.klineData) updateChart(false);
    }, 150);
  });
  // 用底层 zrender canvas 追踪鼠标在哪个 grid 面板上 (解决细线 mousemove 不触发问题)
  STATE.chart.getZr().on('mousemove', function(e) {
    const y = e.offsetY;
    if (!STATE._gridRects || STATE._gridRects.length === 0) return;
    for (let i = 0; i < STATE._gridRects.length; i++) {
      const r = STATE._gridRects[i];
      if (y >= r.top && y <= r.bottom) {
        STATE.hoveredGrid = i;
        // 主图十字线价位：供缺口 hover 命中
        if (i === 0 && STATE.chart) {
          try {
            const pt = STATE.chart.convertFromPixel({ gridIndex: 0 }, [e.offsetX, e.offsetY]);
            STATE._pointerPrice = pt && pt.length > 1 ? pt[1] : null;
          } catch (_) {
            STATE._pointerPrice = null;
          }
        } else {
          STATE._pointerPrice = null;
        }
        return;
      }
    }
    STATE.hoveredGrid = -1;
    STATE._pointerPrice = null;
  });
  STATE.chart.getZr().on('globalout', function() {
    STATE.hoveredGrid = -1;
    STATE._pointerPrice = null;
  });
  // 双击复位缩放 (TradingView 惯例): 回到全景; 折线草稿进行中时用于结束画线
  STATE.chart.getZr().on('dblclick', function(e) {
    if (STATE.draw && STATE.draw.draft) { finishPolyDraft(); return; }
    try { STATE.chart.dispatchAction({ type: 'dataZoom', start: 0, end: 100 }); } catch (e) { /* ignore */ }
  });
  // 筹码面板价格轴随主图缩放联动 (rAF 节流, 避免高频重采样); 画线层同步重投影
  STATE.chart.on('dataZoom', function() {
    if (STATE._chipSyncPending) return;
    STATE._chipSyncPending = true;
    requestAnimationFrame(function() {
      STATE._chipSyncPending = false;
      if (STATE._chip) syncChipAxis();
      redrawDrawings();
      refreshPriceTagLayout();   // 缩放改变可见价格区间 → 签位要重排
    });
  });
  initDrawEvents();
}

// K 线主图 y 轴可见范围: 可见 K 线 low/high + (通道开启时) 可见 ±3ATR 带
// (主图 yAxis scale:true 会包含通道带, 筹码轴需与之对齐, 否则错位)
function klineVisibleYRange(klines, startPct, endPct) {
  const r = ChipChart.visibleRange(klines, startPct, endPct);
  if (!r) return null;
  if (STATE.channelEnabled && isElderPeriod(STATE.period)) {
    const n = klines.length;
    let i0 = Math.floor(n * (startPct == null ? 0 : startPct) / 100);
    let i1 = Math.ceil(n * (endPct == null ? 100 : endPct) / 100) - 1;
    i0 = Math.max(0, Math.min(n - 1, i0));
    i1 = Math.max(i0, Math.min(n - 1, i1));
    for (let i = i0; i <= i1; i++) {
      const k = klines[i];
      if (k.ema13 != null && k.atr14 != null) {
        const u = k.ema13 + 3 * k.atr14;
        const l = k.ema13 - 3 * k.atr14;
        if (u > r.max) r.max = u;
        if (l < r.min) r.min = l;
      }
    }
  }
  return r;
}

// 主图 y 轴实际渲染范围 (scale:true 会取整为 nice 范围); 筹码轴须用同一范围才能像素对齐
function resolvedKlineYExtent() {
  const chart = STATE.chart;
  if (!chart) return null;
  try {
    const m = chart.getModel().getComponent('yAxis', 0);
    const ext = m && m.axis && m.axis.scale && m.axis.scale.getExtent();
    if (ext && isFinite(ext[0]) && isFinite(ext[1]) && ext[1] > ext[0]) {
      return { min: ext[0], max: ext[1] };
    }
  } catch (e) { /* ignore */ }
  return null;
}

// 筹码面板价格轴 + 柱数据随主图 dataZoom 联动 (按可见区间重采样, 保持细密)
function syncChipAxis() {
  const chip = STATE._chip;
  const chart = STATE.chart;
  const data = STATE.klineData;
  if (!chip || chip.gi < 0 || !chart || !chartModel() || !data || !data.klines) return;
  const opt = chart.getOption();
  const dzs = opt.dataZoom || [];
  const dz = dzs.find(z => z.type === 'inside') || dzs[0] || {};
  const range = resolvedKlineYExtent() || klineVisibleYRange(data.klines, dz.start, dz.end);
  if (!range) return;
  const yAxes = (opt.yAxis || []).map((y, i) => (i === chip.gi ? { min: range.min, max: range.max } : {}));
  const patch = { yAxis: yAxes };
  if (STATE.chips && chip.n) {
    const bars = ChipChart.resample(STATE.chips, range.min, range.max, chip.n);
    const seriesPatch = [{ name: '筹码', data: bars }];
    // 价格区间变了, 标签像素间距也变 → 重算避让偏移, 否则缩放后可能重新叠字
    const off = ChipChart.endLabelOffsets(
      STATE.chips.avgCost, STATE.chips.medianCost, range.min, range.max, chip.pxHeight);
    const costColors = C();
    ['筹码均本', '筹码中位价'].forEach(function (nm) {
      const s = (opt.series || []).find(x => x.name === nm);
      if (!s) return;
      const isAvg = nm === '筹码均本';
      seriesPatch.push({
        name: nm,
        data: s.data,
        endLabel: ChipChart.costEndLabel(
          isAvg ? costColors.chipAvg : costColors.chipMedian,
          isAvg ? STATE.chips.avgCost : STATE.chips.medianCost,
          isAvg ? off.avg : off.median),
      });
    });
    patch.series = seriesPatch;
  }
  chart.setOption(patch, { lazyUpdate: true, silent: true });
}

function getIndicatorPanels() {
  const panels = [];
  if (document.getElementById('chk-macd').checked) panels.push('macd');
  if (document.getElementById('chk-kdj').checked) panels.push('kdj');
  if (document.getElementById('chk-rsi').checked) panels.push('rsi');
  if (document.getElementById('chk-atr').checked) panels.push('atr');
  if (document.getElementById('chk-obv').checked) panels.push('obv');
  if (document.getElementById('chk-premium').checked && !MINUTE_PERIODS.includes(STATE.period)) panels.push('premium');
  if (document.getElementById('chk-wr').checked) panels.push('wr');
  if (document.getElementById('chk-cci').checked) panels.push('cci');
  if (document.getElementById('chk-bias').checked) panels.push('bias');
  if (document.getElementById('chk-dmi').checked) panels.push('dmi');
  return panels;
}

function calcGridLayout(panels, chipOn) {
  const showVolume = document.getElementById('chk-volume').checked;
  const rightPct = chipOn ? '17%' : '2%'; // 筹码面板占用右侧空间 (含摘要两列文本)
  const topGap = 2, bottomGap = 8, mGap = 2, volPct = showVolume ? 10 : 0;
  const nPanels = panels.length, totalGaps = (showVolume ? 1 : 0) + nPanels;
  const gapTotal = mGap * totalGaps;
  const indEach = nPanels > 0 ? Math.max(8, Math.min(14, (100 - topGap - bottomGap - volPct - gapTotal - 20) / nPanels)) : 0;
  const indTotal = indEach * nPanels;
  const klinePct = 100 - topGap - bottomGap - volPct - indTotal - gapTotal;

  const grids = [];
  const xAxes = [];
  const yAxes = [];
  const gLeft = panelGridLeft(); // 侧栏展开时左侧让出面板宽度

  // K-line grid (index 0)
  grids.push({ left: gLeft, right: rightPct, top: `${topGap}%`, height: `${klinePct}%` });
  xAxes.push({ gridIndex: 0, type: 'category', data: [], show: false });
  yAxes.push({ gridIndex: 0, type: STATE.logScale ? 'log' : 'value', scale: true, position: 'left', splitLine: { lineStyle: { color: C().gridLine } }, axisLabel: { color: C().text, fontSize: 11 } });

  let cursor = topGap + klinePct + mGap;
  let nextGi = 1;
  const hasVolume = showVolume;

  // 成交量 grid
  if (hasVolume) {
    grids.push({ left: gLeft, right: rightPct, top: `${cursor}%`, height: `${volPct}%` });
    xAxes.push({ gridIndex: nextGi, type: 'category', data: [], show: false });
    yAxes.push({ gridIndex: nextGi, type: 'value', scale: true, position: 'left', splitLine: { show: false }, axisLabel: { color: C().text, fontSize: 10, formatter: fmtVolume } });
    cursor += volPct + mGap;
    nextGi++;
  }

  // 指标面板
  panels.forEach((p, i) => {
    grids.push({ left: gLeft, right: rightPct, top: `${cursor}%`, height: `${indEach}%` });
    xAxes.push({ gridIndex: nextGi + i, type: 'category', data: [], show: false });
    yAxes.push({ gridIndex: nextGi + i, type: 'value', scale: true, position: 'left', splitLine: { lineStyle: { color: C().gridLine } }, axisLabel: { color: C().text, fontSize: 10 } });
    cursor += indEach + mGap;
  });

  // 最后一个 grid 显示日期标签
  if (xAxes.length > 0) {
    xAxes[xAxes.length - 1].show = true;
    xAxes[xAxes.length - 1].axisLabel = { color: C().text, fontSize: 10, rotate: 30 };
  }

  return { grids, xAxes, yAxes, panels, hasVolume, indicatorStartGi: nextGi };
}

function fmtVolume(v) {
  if (v == null) return '';
  const abs = Math.abs(v);
  if (abs >= 1e8) return (v / 1e8).toFixed(1) + '亿';
  if (abs >= 1e4) return (v / 1e4).toFixed(0) + '万';
  return v.toFixed(0);
}

/** 客户端 SMA (自定义均线参数时使用); 返回数组与 klines 等长 (前 n-1 为 null) */
function clientSma(values, n) {
  const out = new Array(values.length).fill(null);
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= n) sum -= values[i - n];
    if (i >= n - 1) out[i] = sum / n;
  }
  return out;
}

/** 客户端 BOLL(N,K); 返回 {mid, up, low} 数组 */
function clientBoll(values, n, k) {
  const mid = clientSma(values, n);
  const up = new Array(values.length).fill(null);
  const low = new Array(values.length).fill(null);
  for (let i = n - 1; i < values.length; i++) {
    let acc = 0;
    for (let j = i - n + 1; j <= i; j++) {
      const d = values[j] - mid[i];
      acc += d * d;
    }
    const std = Math.sqrt(acc / (n - 1)); // 样本标准差 (与后端口径一致)
    up[i] = mid[i] + k * std;
    low[i] = mid[i] - k * std;
  }
  return { mid, up, low };
}

/** K线形态扫描缓存 (数据未变化时不重扫; tooltip 与 markPoint 共用) */
function cachedPatterns(klines) {
  if (!klines || !klines.length) return [];
  const key = STATE.symbol + ':' + STATE.period + ':' + klines.length + ':'
    + String(klines[klines.length - 1].date) + ':' + String(klines[klines.length - 1].close);
  if (STATE._patternCache && STATE._patternCache.key === key) return STATE._patternCache.vals;
  const vals = (typeof PatternScanner !== 'undefined') ? PatternScanner.scanPatterns(klines) : [];
  STATE._patternCache = { key, vals };
  return vals;
}

/** 生效的 MA/BOLL 序列: 自定义参数 → 客户端重算; 否则用服务器列 (带缓存) */
function effectiveMaBoll(klines) {
  const closes = klines.map(k => k.close);
  const key = STATE.symbol + ':' + STATE.period + ':' + klines.length + ':'
    + (klines.length ? String(klines[klines.length - 1].close) : '') + ':'
    + STATE.maPeriods.join(',') + ':' + STATE.bollParams.n + ',' + STATE.bollParams.k;
  if (STATE._maCache && STATE._maCache.key === key) return STATE._maCache.val;
  const customMa = JSON.stringify(STATE.maPeriods) !== JSON.stringify([5, 10, 20]);
  const customBoll = STATE.bollParams.n !== 20 || STATE.bollParams.k !== 2;
  const val = {
    ma: customMa
      ? STATE.maPeriods.map(n => clientSma(closes, n))
      : [klines.map(k => k.ma5), klines.map(k => k.ma10), klines.map(k => k.ma20)],
    boll: customBoll ? clientBoll(closes, STATE.bollParams.n, STATE.bollParams.k)
      : { mid: klines.map(k => k.boll_mid), up: klines.map(k => k.boll_up), low: klines.map(k => k.boll_low) },
  };
  STATE._maCache = { key, val };
  return val;
}

function updateChart(reTheme) {
  const data = STATE.klineData;
  if (!data || !data.klines || data.klines.length === 0) return;
  if (!STATE.chart) return; // echarts 兜底

  showSidePanel(sidePanelOn());   // 基本信息所有周期常驻
  showDepthSection(depthSecOn()); // 五档仅分时

  const chart = STATE.chart;
  const klines = data.klines;
  const pf = fmtPrice3;
  const dates = klines.map(k => k.date);
  const panels = getIndicatorPanels();
  const chipOn = isChipPeriod(STATE.period)
    && document.getElementById('chk-chip').checked
    && !!STATE.chips && !!STATE.chips.buckets;
  const { grids, xAxes, yAxes, hasVolume, indicatorStartGi } = calcGridLayout(panels, chipOn);
  const visibleBars = STATE.period === '1m' ? 240 : 80;
  const futureBars = drawNeedsFuture() ? (window.Drawings ? Drawings.FUTURE_BARS : 0) : 0;
  const totalSlots = Math.max(dates.length, 1) + futureBars;
  const startPct = Math.max(0, Math.min(100, (1 - (visibleBars + futureBars) / totalSlots) * 100));

  // ── Readonly series data ──
  const impulseOn = STATE.impulseEnabled && isElderPeriod(STATE.period);
  const ohlc = klines.map((k) => buildOhlcPoint(k, impulseOn));
  const vols = klines.map((k) => buildVolPoint(k));
  const eff = effectiveMaBoll(klines);
  const maDefs = eff.ma.map((arr, i) => ({ name: `MA${STATE.maPeriods[i]}`, data: arr }));
  const maColors = [C().ma5, C().ma10, C().ma20];

  const series = [];

  // ── 金叉死叉 + K线形态 markPoint (与交易标记合并进 K线 series) ──
  const extraMarks = [];
  if (document.getElementById('chk-cross').checked) {
    // 短均线上/下穿 MA20 (基于生效均线序列)
    const a = eff.ma[0], c20 = eff.ma[eff.ma.length - 1];
    for (let i = 1; i < klines.length; i++) {
      if (a[i] == null || a[i - 1] == null || c20[i] == null || c20[i - 1] == null) continue;
      if (a[i - 1] <= c20[i - 1] && a[i] > c20[i]) {
        extraMarks.push({ coord: [i, klines[i].low], symbol: 'triangle', symbolSize: 8,
          symbolRotate: 0, itemStyle: { color: C().up }, name: '金叉',
          label: { show: true, position: 'bottom', formatter: '金叉', fontSize: 9, color: C().up } });
      } else if (a[i - 1] >= c20[i - 1] && a[i] < c20[i]) {
        extraMarks.push({ coord: [i, klines[i].high], symbol: 'triangle', symbolSize: 8,
          symbolRotate: 180, itemStyle: { color: C().down }, name: '死叉',
          label: { show: true, position: 'top', formatter: '死叉', fontSize: 9, color: C().down } });
      }
    }
  }
  if (document.getElementById('chk-patterns').checked && window.PatternScanner) {
    cachedPatterns(klines).forEach(pt => {
      extraMarks.push({
        coord: [pt.idx, pt.dir > 0 ? klines[pt.idx].low : klines[pt.idx].high],
        symbol: pt.dir > 0 ? 'triangle' : 'triangle', symbolSize: 7,
        symbolRotate: pt.dir > 0 ? 0 : 180,
        itemStyle: { color: pt.dir > 0 ? C().up : C().down, opacity: 0.85 },
        name: pt.name, value: pt.note,
        label: { show: false },   // 形态只在悬浮提示里说明, 不往图上写字
      });
    });
  }
  const mpBase = buildTradeMarkers(klines, dates);
  const klineMarkPoint = mpBase || { data: [] };
  if (extraMarks.length) {
    klineMarkPoint.data = (klineMarkPoint.data || []).concat(extraMarks);
  }

  // ── Grid 0: K-line ──
  const klineSeries = {
    name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, data: ohlc,
    itemStyle: { color: C().up, color0: C().down, borderColor: C().up, borderColor0: C().down },
    markPoint: klineMarkPoint,
  };
  const gapMark = buildGapMarkArea(klines, dates);
  klineSeries.markArea = gapMark || { data: [] };
  klineSeries.markLine = buildKlineMarkLines(klines);
  if (!gapMark) STATE._gaps = [];

  series.push(klineSeries);
  maDefs.forEach((d, i) => {
    series.push({ name: d.name, type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: d.data,
      symbol: 'none', smooth: true, lineStyle: { color: maColors[i], width: 1 },
      itemStyle: { color: maColors[i] } });
  });

  // ── BOLL(N,K) 主图叠加 ──
  if (document.getElementById('chk-boll').checked) {
    const bNames = ['BOLL中轨', 'BOLL上轨', 'BOLL下轨'];
    [eff.boll.mid, eff.boll.up, eff.boll.low].forEach((arr, i) => {
      series.push({
        name: bNames[i], type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: arr,
        symbol: 'none', smooth: true,
        lineStyle: { color: C().boll, width: 1, type: i === 0 ? 'solid' : 'dashed', opacity: 0.9 },
        itemStyle: { color: C().boll }, silent: true,
      });
    });
  }

  // ── ATR Channel (Elder, 日/周/月K) ──
  if (STATE.channelEnabled && isElderPeriod(STATE.period)) {
    const ema13Arr = klines.map(k => k.ema13);
    const atrArr = klines.map(k => k.atr14);
    const bands = [
      { mult: 1, key: 'ch_1atr' },
      { mult: 2, key: 'ch_2atr' },
      { mult: 3, key: 'ch_3atr' },
    ];
    bands.forEach(({ mult, key }) => {
      const upper = klines.map((k, i) => (ema13Arr[i] != null && atrArr[i] != null) ? ema13Arr[i] + mult * atrArr[i] : null);
      const lower = klines.map((k, i) => (ema13Arr[i] != null && atrArr[i] != null) ? ema13Arr[i] - mult * atrArr[i] : null);
      const color = C()[key];
      const labelCfg = { show: true, position: 'end', fontSize: 10, offset: [4, 0] };
      series.push(
        { name: `+${mult}ATR`, type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: upper,
          symbol: 'none', smooth: false,
          lineStyle: { color, width: 1, type: 'dashed' },
          endLabel: { ...labelCfg, color, formatter: `+${mult}ATR` } },
        { name: `-${mult}ATR`, type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: lower,
          symbol: 'none', smooth: false,
          lineStyle: { color, width: 1, type: 'dashed' },
          endLabel: { ...labelCfg, color, formatter: `-${mult}ATR` } },
      );
    });
  }

  // ── Grid 1: Volume (only if enabled) + 量均线 MA5/10/20 (东财口径) ──
  if (hasVolume) {
    series.push(
      { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: vols },
      { name: 'VOL MA5', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
        data: klines.map(k => k.vol_ma5), symbol: 'none',
        lineStyle: { color: C().ma5, width: 1 } },
      { name: 'VOL MA10', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
        data: klines.map(k => k.vol_ma10), symbol: 'none',
        lineStyle: { color: C().ma10, width: 1 } },
      { name: 'VOL MA20', type: 'line', xAxisIndex: 1, yAxisIndex: 1,
        data: klines.map(k => k.vol_ma20), symbol: 'none',
        lineStyle: { color: C().ma20, width: 1 } }
    );
  }

  // ── Indicator panels ──
  panels.forEach((p, i) => {
    const gi = indicatorStartGi + i;
    if (p === 'macd') {
      const dif = klines.map(k => k.macd_dif);
      const dea = klines.map(k => k.macd_dea);
      const hist = klines.map(k => ({
        value: k.macd_hist,
        itemStyle: { color: (k.macd_hist || 0) >= 0 ? C().up : C().down }
      }));
      const macdCross = [];
      if (document.getElementById('chk-cross').checked) {
        for (let ci = 1; ci < klines.length; ci++) {
          const d0 = dif[ci - 1], d1 = dif[ci], e0 = dea[ci - 1], e1 = dea[ci];
          if (d0 == null || d1 == null || e0 == null || e1 == null) continue;
          if (d0 <= e0 && d1 > e1) {
            macdCross.push({ coord: [ci, dif[ci]], symbol: 'triangle', symbolSize: 7,
              symbolRotate: 0, itemStyle: { color: C().up } });
          } else if (d0 >= e0 && d1 < e1) {
            macdCross.push({ coord: [ci, dif[ci]], symbol: 'triangle', symbolSize: 7,
              symbolRotate: 180, itemStyle: { color: C().down } });
          }
        }
      }
      series.push(
        { name: 'DIF', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: dif,
          symbol: 'none', lineStyle: { color: C().macdDif, width: 1 },
          markPoint: macdCross.length ? { data: macdCross, animation: false } : undefined },
        { name: 'DEA', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: dea,
          symbol: 'none', lineStyle: { color: C().macdDea, width: 1 } },
        { name: 'MACD柱', type: 'bar', xAxisIndex: gi, yAxisIndex: gi, data: hist }
      );
    } else if (p === 'kdj') {
      const k = klines.map(x => x.kdj_k);
      const d = klines.map(x => x.kdj_d);
      const j = klines.map(x => x.kdj_j);
      series.push(
        { name: 'K', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: k,
          symbol: 'none', lineStyle: { color: C().kdjK, width: 1 } },
        { name: 'D', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: d,
          symbol: 'none', lineStyle: { color: C().kdjD, width: 1 } },
        { name: 'J', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: j,
          symbol: 'none', lineStyle: { color: C().kdjJ, width: 1 } }
      );
    } else if (p === 'rsi') {
      const r6 = klines.map(x => x.rsi6);
      const r12 = klines.map(x => x.rsi12);
      const r24 = klines.map(x => x.rsi24);
      series.push(
        { name: 'RSI1', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: r6,
          symbol: 'none', lineStyle: { color: C().rsi6, width: 1 } },
        { name: 'RSI2', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: r12,
          symbol: 'none', lineStyle: { color: C().rsi12, width: 1 } },
        { name: 'RSI3', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: r24,
          symbol: 'none', lineStyle: { color: C().rsi24, width: 1 } }
      );
    } else if (p === 'atr') {
      const a = klines.map(x => x.atr14);
      series.push(
        { name: 'ATR(14)', type: 'line', xAxisIndex: gi, yAxisIndex: gi, data: a,
          symbol: 'none', areaStyle: { color: 'rgba(144,164,174,0.08)' },
          lineStyle: { color: C().atr, width: 1 } }
      );
    } else if (p === 'obv') {
      series.push(
        { name: 'OBV', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.obv), symbol: 'none',
          lineStyle: { color: C().obv, width: 1 } },
        { name: 'MAOBV', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.maobv), symbol: 'none',
          lineStyle: { color: C().maobv, width: 1 } }
      );
    } else if (p === 'premium') {
      const premVals = klines.map(x => {
        const v = x.premium;
        if (v == null) return null;
        return { value: v, itemStyle: { color: v >= 0 ? C().up : C().down } };
      });
      series.push(
        { name: '溢价率', type: 'bar', xAxisIndex: gi, yAxisIndex: gi, data: premVals }
      );
    } else if (p === 'wr') {
      series.push(
        { name: 'WR14', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.wr14), symbol: 'none',
          lineStyle: { color: C().rsi6, width: 1 } }
      );
    } else if (p === 'cci') {
      series.push(
        { name: 'CCI14', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.cci14), symbol: 'none',
          lineStyle: { color: C().macdDif, width: 1 } }
      );
    } else if (p === 'bias') {
      series.push(
        { name: 'BIAS6', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.bias6), symbol: 'none',
          lineStyle: { color: C().ma5, width: 1 } },
        { name: 'BIAS12', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.bias12), symbol: 'none',
          lineStyle: { color: C().ma10, width: 1 } },
        { name: 'BIAS24', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.bias24), symbol: 'none',
          lineStyle: { color: C().ma20, width: 1 } }
      );
    } else if (p === 'dmi') {
      series.push(
        { name: '+DI', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.dmi_pdi), symbol: 'none',
          lineStyle: { color: C().up, width: 1 } },
        { name: '-DI', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.dmi_mdi), symbol: 'none',
          lineStyle: { color: C().down, width: 1 } },
        { name: 'ADX', type: 'line', xAxisIndex: gi, yAxisIndex: gi,
          data: klines.map(x => x.dmi_adx), symbol: 'none',
          lineStyle: { color: C().macdDea, width: 1 } }
      );
    }
  });

  // ── 筹码分布叠加 (右侧, 与主图价格轴联动) ──
  let chipGi = -1;
  if (chipOn) {
    chipGi = grids.length;
    const range = klineVisibleYRange(klines, startPct, 100)
      || { min: STATE.chips.min, max: STATE.chips.max };
    const chipPxH = parseFloat(grids[0].height) / 100 * chart.getHeight();
    const overlay = ChipChart.buildOverlay(STATE.chips, {
      gi: chipGi,
      left: '83%', right: '3%',
      top: grids[0].top, height: grids[0].height,
      colors: C(),
      lastClose: klines[klines.length - 1].close,
      min: range.min, max: range.max,
      pxHeight: chipPxH,
    });
    grids.push(overlay.grid);
    xAxes.push(overlay.xAxis);
    yAxes.push(overlay.yAxis);
    overlay.series.forEach(s => series.push(s));
    STATE._chip = { gi: chipGi, n: overlay.n, pxHeight: overlay.pxHeight };
  } else {
    STATE._chip = null;
  }

  // ── 未来预测区标注: 每个图表 grid 的右侧空白 bar 铺一条淡色带 + 「预测区」 ──
  const zoneItem = buildFutureZoneMarkArea(dates, futureBars, C());
  if (zoneItem) {
    const zoneMarked = new Set();
    series.forEach(s => {
      const gi = s.xAxisIndex;
      if (gi == null || gi === chipGi || zoneMarked.has(gi)) return; // 每个 grid 只挂一次; 筹码 value 轴不标注
      if (!s.markArea) s.markArea = { data: [] };
      if (s.markArea.silent == null) s.markArea.silent = true; // 不抢 axis tooltip (与缺口 markArea 一致)
      if (s.markArea.z == null) s.markArea.z = 1;
      s.markArea.data = (s.markArea.data || []).concat([zoneItem]);
      zoneMarked.add(gi);
    });
  }

  // ── xAxis data ──
  // 画线模式/预测延伸存在时, 右侧预留未来 bar 空间 (趋势线/回归通道向右虚线延伸)
  applyFutureSlots(xAxes, dates, futureBars);

  // ── DataZoom ──
  const allXAxisIndices = [0, ...(hasVolume ? [1] : []), ...panels.map((_, i) => indicatorStartGi + i)];
  const dzLocked = STATE.draw.enabled && STATE.draw.tool !== 'select'; // 画线工具激活时禁用拖拽平移(滚轮缩放保留)
  const dataZoom = [
    { type: 'inside', xAxisIndex: allXAxisIndices, start: startPct, end: 100, moveOnMouseMove: !dzLocked },
    { type: 'slider', xAxisIndex: allXAxisIndices, top: 2, height: 16,
      borderColor: C().gridLine, backgroundColor: 'transparent',
      fillerColor: 'rgba(128,128,128,0.15)', handleStyle: { color: C().text },
      textStyle: { color: C().text, fontSize: 10 } }
  ];

  // ── Tooltip (adaptive: shows different data per panel) ──
  const tooltip = {
    trigger: 'axis',
    axisPointer: { type: 'cross',
      crossStyle: { color: C().crossLine },
      label: { backgroundColor: C().bg, color: C().text, borderColor: C().border }
    },
    backgroundColor: C().tipBg,
    borderColor: C().tipBorder,
    textStyle: { color: C().tipText, fontSize: 12, fontFamily: 'monospace' },
    formatter: function(ps) {
      if (!ps || ps.length === 0) return '';
      const idx = ps[0].dataIndex;
      const k = klines[idx];
      if (!k) return '';
      const prev = idx > 0 ? klines[idx - 1] : null;
      const chgPct = prev && prev.close ? ((k.close - prev.close) / prev.close * 100) : null;
      const g = STATE.hoveredGrid; // grid index: 0=K线, (1=成交量), indicatorStartGi+=指标
      const panel = g >= indicatorStartGi ? panels[g - indicatorStartGi] : null;

      // ── Helper ──
      const pc = prev ? prev.close : k.close; // 前一根收盘价
      const hdr = `<div style="font-weight:700;margin-bottom:4px">📅 ${escHtml(k.date)}${haltLabel(k)}</div>`;
      const patternTip = (typeof PatternScanner !== 'undefined' && document.getElementById('chk-patterns').checked)
        ? (cachedPatterns(klines).find(p => p.idx === idx) || null) : null;
      const cfn = (v) => v == null ? '—' : `<span style="color:${v>pc?C().up:v<pc?C().down:C().tipText};font-weight:700">${pf(v)}</span>`;

      // Grid 0: K-line — full detail
      if (g === 0) {
        let html = hdr;
        html += `<div>开 ${cfn(k.open)} 高 ${cfn(k.high)} 低 ${cfn(k.low)} 收 ${cfn(k.close)}`;
        if (chgPct != null) html += ` <span style="color:${chgPct>=0?C().up:C().down}">${chgPct>=0?'+':''}${chgPct.toFixed(2)}%</span>`;
        const effTip = effectiveMaBoll(klines);
        const maLabels = STATE.maPeriods.map((n, i) =>
          `MA${n} <span style="color:${maColors[i] || C().ma5}">${pf(effTip.ma[i][idx])}</span>`).join(' ');
        html += `</div><div>${maLabels}</div>`;
        html += `<div>量 ${fmtVolume(k.volume)} 额 ${k.amount!=null?(k.amount/1e8).toFixed(2):'—'}亿</div>`;
        if (document.getElementById('chk-macd').checked) {
          html += `<div>MACD DIF <span style="color:${C().macdDif}">${k.macd_dif?.toFixed(3)||'—'}</span> DEA <span style="color:${C().macdDea}">${k.macd_dea?.toFixed(3)||'—'}</span> 柱 <span style="color:${(k.macd_hist||0)>=0?C().up:C().down}">${k.macd_hist?.toFixed(3)||'—'}</span></div>`;
        }
        let extras = [];
        if (document.getElementById('tip-rsi').checked) {
          const cV = (v,clr) => v == null ? '—' : `<span style="color:${v>70?C().overbought:v<30?C().oversold:clr}">${v.toFixed(1)}</span>`;
          extras.push(`<span style="color:${C().rsi6}">RSI1</span> ${cV(k.rsi6,C().rsi6)} <span style="color:${C().rsi12}">RSI2</span> ${cV(k.rsi12,C().rsi12)} <span style="color:${C().rsi24}">RSI3</span> ${cV(k.rsi24,C().rsi24)}`);
        }
        if (document.getElementById('tip-kdj').checked) {
          const cV = (v,clr) => v == null ? '—' : `<span style="color:${v>80?C().overbought:v<20?C().oversold:clr}">${v.toFixed(2)}</span>`;
          extras.push(`<span style="color:${C().kdjK}">K</span> ${cV(k.kdj_k,C().kdjK)} <span style="color:${C().kdjD}">D</span> ${cV(k.kdj_d,C().kdjD)} <span style="color:${C().kdjJ}">J</span> ${cV(k.kdj_j,C().kdjJ)}`);
        }
        if (document.getElementById('tip-atr').checked) {
          extras.push(`<span style="color:${C().atr}">ATR</span> ${k.atr14?.toFixed(3)||'—'}`);
        }
        if (extras.length > 0) html += `<div>${extras.join(' | ')}</div>`;
        if (k.premium != null) html += `<div>溢价率 <span style="color:${k.premium>=0?C().up:C().down}">${k.premium>=0?'+':''}${normPct(k.premium).toFixed(2)}%</span></div>`;
        // 十字线落在未回补缺口灰区内时追加缺口信息（markArea 与 axis tooltip 冲突，走此注入）
        if (typeof GapScanner !== 'undefined' && STATE._gaps && STATE._gaps.length) {
          const hit = GapScanner.findGapAt(STATE._gaps, idx, STATE._pointerPrice);
          if (hit) {
            html += `<div style="margin-top:4px;padding-top:4px;border-top:1px solid ${C().tipBorder}">${GapScanner.gapTooltipHtml(hit)}</div>`;
          }
        }
        if (patternTip) {
          html += `<div style="margin-top:4px;padding-top:4px;border-top:1px solid ${C().tipBorder}">`
            + `<span style="color:${patternTip.dir > 0 ? C().up : C().down};font-weight:700">▲ ${escHtml(patternTip.name)}</span>`
            + ` <span class="dim">${escHtml(patternTip.note || '')}</span></div>`;
        }
        // 线型画线与该 bar 相交时: 相交价 + 相对 close 的偏离百分比 (正负着色)
        html += drawingCrossTooltipHtml(idx, k.close);
        return html;
      }

      // Volume (only if enabled)
      if (hasVolume && g === 1) {
        return hdr
          + `<div>成交量 ${fmtVolume(k.volume)}</div>`
          + `<div>VOL MA5 <span style="color:${C().ma5}">${fmtVolume(k.vol_ma5)}</span> MA10 <span style="color:${C().ma10}">${fmtVolume(k.vol_ma10)}</span> MA20 <span style="color:${C().ma20}">${fmtVolume(k.vol_ma20)}</span></div>`
          + `<div>成交额 ${k.amount!=null?(k.amount/1e8).toFixed(2):'—'}亿</div>`;
      }

      // Grid 2+: Indicator panels
      if (panel === 'macd') {
        return hdr + `<div>DIF <span style="color:${C().macdDif}">${k.macd_dif?.toFixed(3)||'—'}</span> DEA <span style="color:${C().macdDea}">${k.macd_dea?.toFixed(3)||'—'}</span> 柱 <span style="color:${(k.macd_hist||0)>=0?C().up:C().down}">${k.macd_hist?.toFixed(3)||'—'}</span></div>`;
      }
      if (panel === 'kdj') {
        const cV = (v,clr) => v == null ? '—' : `<span style="color:${v>80?C().overbought:v<20?C().oversold:clr};font-weight:700">${v.toFixed(2)}</span>`;
        return hdr + `<div><span style="color:${C().kdjK}">K</span> ${cV(k.kdj_k,C().kdjK)} <span style="color:${C().kdjD}">D</span> ${cV(k.kdj_d,C().kdjD)} <span style="color:${C().kdjJ}">J</span> ${cV(k.kdj_j,C().kdjJ)}</div>`;
      }
      if (panel === 'rsi') {
        const cV = (v,clr) => v == null ? '—' : `<span style="color:${v>70?C().overbought:v<30?C().oversold:clr};font-weight:700">${v.toFixed(1)}</span>`;
        return hdr + `<div><span style="color:${C().rsi6}">RSI1</span> ${cV(k.rsi6,C().rsi6)} <span style="color:${C().rsi12}">RSI2</span> ${cV(k.rsi12,C().rsi12)} <span style="color:${C().rsi24}">RSI3</span> ${cV(k.rsi24,C().rsi24)}</div>`;
      }
      if (panel === 'atr') {
        return hdr + `<div>ATR(14) ${k.atr14?.toFixed(3)||'—'}</div>`;
      }
      if (panel === 'wr') {
        return hdr + `<div>WR(14) ${k.wr14?.toFixed(2)||'—'} <span class="dim">(越小越强势)</span></div>`;
      }
      if (panel === 'cci') {
        return hdr + `<div>CCI(14) ${k.cci14?.toFixed(1)||'—'}</div>`;
      }
      if (panel === 'bias') {
        return hdr + `<div>BIAS6 ${k.bias6?.toFixed(2)||'—'}% BIAS12 ${k.bias12?.toFixed(2)||'—'}% BIAS24 ${k.bias24?.toFixed(2)||'—'}%</div>`;
      }
      if (panel === 'dmi') {
        return hdr + `<div>+DI ${k.dmi_pdi?.toFixed(1)||'—'} -DI ${k.dmi_mdi?.toFixed(1)||'—'} ADX ${k.dmi_adx?.toFixed(1)||'—'}</div>`;
      }
      if (panel === 'obv') {
        return hdr
          + `<div><span style="color:${C().obv}">OBV</span> ${fmtVolume(k.obv)} <span style="color:${C().maobv}">MAOBV</span> ${fmtVolume(k.maobv)}</div>`;
      }
      if (panel === 'premium') {
        return hdr + `<div>溢价率 <span style="color:${(k.premium||0)>=0?C().up:C().down}">${k.premium!=null?(k.premium>=0?'+':'')+normPct(k.premium).toFixed(2)+'%':'—'}</span></div>`;
      }

      // fallback
      return hdr + `<div>收 <b>${pf(k.close)}</b></div>`;
    }
  };

  // ── Build option ──
  const option = {
    backgroundColor: C().bg,
    animation: reTheme ? false : !STATE._periodSwitching,
    tooltip: tooltip,
    grid: grids,
    xAxis: xAxes,
    yAxis: yAxes,
    dataZoom: dataZoom,
    series: series,
  };

  // ── Reference lines for indicator panels ──
  panels.forEach((p, i) => {
    const gi = indicatorStartGi + i;
    if (p === 'rsi') {
      for (let s = 0; s < series.length; s++) {
        if (series[s].name === 'RSI1' && series[s].xAxisIndex === gi) {
          series[s].markLine = {
            silent: true,
            symbol: 'none',
            lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
            data: [
              { yAxis: 70, label: { show: true, formatter: '70', color: C().text, fontSize: 10, position: 'end' } },
              { yAxis: 30, label: { show: true, formatter: '30', color: C().text, fontSize: 10, position: 'end' }, lineStyle: { color: C().oversold } },
              { yAxis: 50, label: { show: false }, lineStyle: { color: C().gridLine } },
            ]
          };
          break;
        }
      }
    }
    if (p === 'kdj') {
      for (let s = 0; s < series.length; s++) {
        if (series[s].name === 'K' && series[s].xAxisIndex === gi) {
          series[s].markLine = {
            silent: true, symbol: 'none',
            lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
            data: [
              { yAxis: 80, label: { show: true, formatter: '80', color: C().text, fontSize: 10, position: 'end' } },
              { yAxis: 20, label: { show: true, formatter: '20', color: C().text, fontSize: 10, position: 'end' }, lineStyle: { color: C().oversold } },
            ]
          };
          break;
        }
      }
    }
    if (p === 'macd' || p === 'premium' || p === 'obv' || p === 'bias') {
      for (let s = 0; s < series.length; s++) {
        const name = p === 'macd' ? 'DIF' : (p === 'obv' ? 'OBV' : (p === 'bias' ? 'BIAS6' : '溢价率'));
        if (series[s].name === name && series[s].xAxisIndex === gi) {
          series[s].markLine = {
            silent: true, symbol: 'none',
            lineStyle: { color: C().zeroLine, type: 'solid', width: 1 },
            // 零轴是面板基线, 无需标注; 不写 label 时 markLine 默认在末端显示数值 0,
            // 单边行情下零轴贴近底部, 那个 "0" 会落在日期刻度区像横轴出了异常刻度。
            label: { show: false },
            data: [{ yAxis: 0 }]
          };
          break;
        }
      }
    }
    if (p === 'wr') {
      for (let s = 0; s < series.length; s++) {
        if (series[s].name === 'WR14' && series[s].xAxisIndex === gi) {
          series[s].markLine = {
            silent: true, symbol: 'none',
            lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
            data: [
              { yAxis: 80, label: { show: true, formatter: '80', color: C().text, fontSize: 10, position: 'end' } },
              { yAxis: 20, label: { show: true, formatter: '20', color: C().text, fontSize: 10, position: 'end' }, lineStyle: { color: C().oversold } },
            ]
          };
          break;
        }
      }
    }
    if (p === 'cci') {
      for (let s = 0; s < series.length; s++) {
        if (series[s].name === 'CCI14' && series[s].xAxisIndex === gi) {
          series[s].markLine = {
            silent: true, symbol: 'none',
            lineStyle: { color: C().overbought, type: 'dashed', width: 1 },
            data: [
              { yAxis: 100, label: { show: true, formatter: '+100', color: C().text, fontSize: 10, position: 'end' } },
              { yAxis: -100, label: { show: true, formatter: '-100', color: C().text, fontSize: 10, position: 'end' }, lineStyle: { color: C().oversold } },
            ]
          };
          break;
        }
      }
    }
  });

  // 保留旧 canvas 至新 option 原子替换，避免周期切换出现白屏闪烁 (防闪烁靠的是不 clear canvas,
  // 不是 lazyUpdate)。全量重建必须同步提交: notMerge 会立刻换掉 model 与全部 seriesModel, 若再
  // lazyUpdate, 数据管线要等下一帧才跑, 而画布上还是带旧 seriesIndex 的旧元素 —— 这中间移一下
  // 鼠标, ECharts 内部事件桥接就会拿旧索引去查新 series 的 getDataParams, getData() 为空直接抛
  // TypeError (getRawIndex)。增量补丁 (merge 语义, 模型实例不变) 保留 lazyUpdate 没问题。
  chart.setOption(option, { notMerge: true, silent: true });
  if (chipOn) requestAnimationFrame(syncChipAxis); // 布局后取主图轴实际范围(nice), 校正筹码轴
  cacheGridRects(grids);
  refreshPriceTagLayout(); // 布局后按新刻度重排现价/风控签位 (建图前拿不到新刻度)
  const cw = chart.getWidth(), ch = chart.getHeight(); // 面板标签/筹码摘要按像素定位
  // 每个指标面板左上角放名称标签 (graphic)
  const PANEL_LABELS = { macd: 'MACD', kdj: 'KDJ', rsi: 'RSI', atr: 'ATR', obv: 'OBV', premium: '溢价%' };
  const LABEL_COLORS = { macd: C().macdDif, kdj: C().kdjK, rsi: C().rsi6, atr: C().macdDif, obv: C().obv, premium: C().macdDif };
  const graphics = [];
  // 面板标签: 抽象文本规格, 由画线 overlay canvas (paintLabels) 绘制
  panels.forEach((p, i) => {
    const g = grids[indicatorStartGi + i];
    const gridTop = spanPx(g.top, ch, false);
    const gridLeft = spanPx(g.left, cw, false);
    graphics.push({
      text: PANEL_LABELS[p] || p.toUpperCase(), x: gridLeft + 6, y: gridTop + 15,
      fill: LABEL_COLORS[p] || C().text, font: 'bold 11px monospace',
    });
  });
  // 成交量面板也加标签
  if (hasVolume) {
    const vg = grids[1];
    const volGridTop = spanPx(vg.top, ch, false);
    graphics.push({
      text: 'VOL', x: spanPx(vg.left, cw, false) + 6, y: volGridTop + 15,
      fill: C().macdDif, font: 'bold 11px monospace',
    });
  }
  // 筹码分布摘要 (筹码条正下方右侧空白窄带): 两列, 标签左对齐 + 数值右对齐成列。
  // 字号自适应 13→10: 基准 13px, 窄窗/矮带逐级减小以免超宽或超出画布。
  // 标题行比明细大 2px 且加粗, 单独占一行。
  if (chipOn) {
    const chipColors = C();
    const rows = ChipChart.summaryRows(STATE.chips);
    const titleRow = rows.find(r => r.title);
    const titleText = titleRow ? titleRow.label : '';
    const body = rows.filter(r => !r.title);
    const colLeft = cw * 0.835, colRight = cw * 0.968;
    const bandW = colRight - colLeft;
    const klineBottom = (parseFloat(grids[0].top) + parseFloat(grids[0].height)) / 100 * ch;
    const bandH = ch - klineBottom - 6;
    const estW = (s, f) => {   // monospace 估算 (略偏保守): CJK≈1.02×字号, ASCII≈0.62×字号
      let w = 0;
      for (const cc of String(s)) w += (cc.charCodeAt(0) > 0x2e80 ? 1.02 : 0.62) * f;
      return w;
    };
    let fs = 13, titleFs = fs + 2;
    while (fs > 10) {
      titleFs = fs + 2;
      const bodyW = body.reduce((m, r) => Math.max(m, estW(r.label, fs) + 10 + estW(r.value, fs)), 0);
      const needW = Math.max(bodyW, estW(titleText, titleFs));
      const needH = (titleFs + 3) + (fs + 3) * body.length;
      if (needW <= bandW && needH <= bandH) break;
      fs -= 1;
    }
    titleFs = fs + 2;
    let sy = klineBottom + titleFs + 3;
    rows.forEach(function (row) {
      if (row.title) {
        graphics.push({ text: row.label, x: colLeft, y: sy, fill: chipColors.text,
                        font: 'bold ' + titleFs + 'px monospace' });
        sy += titleFs + 3;
        return;
      }
      graphics.push({ text: row.label, x: colLeft, y: sy, fill: chipColors.text,
                      font: fs + 'px monospace' });
      graphics.push({ text: row.value, x: colRight, y: sy,
                      fill: chipColors[row.color] || chipColors.text,
                      align: 'right', font: 'bold ' + fs + 'px monospace' });
      sy += fs + 3;
    });
  }
  loadDrawings();            // 画线: 切代码/周期后从服务器同步 (_loadedKey 防重复拉取)
  redrawDrawings(graphics);  // 面板标签 + 画线层绘制到 overlay canvas
  // 首次渲染延迟 resize，解决底部日期轴被截断
  if (!STATE._initResized) { STATE._initResized = true; setTimeout(() => chart.resize({ animation: { duration: 0 } }), 100); }
}

/** 同步周期相关的按钮/标签/侧栏显隐 (不触发数据请求) */
function applyPeriodUI(period) {
  STATE.period = period;
  ensurePeriodVisible(period);
  ALL_PERIODS.forEach(p => {
    const btn = document.getElementById('btn-' + p);
    if (btn) btn.classList.toggle('active', p === period);
  });
  const isIntra = period === 'intraday';
  // Show/hide impulse & channel checkboxes (日/周/月K)
  const lblImpulse = document.getElementById('lbl-impulse');
  if (lblImpulse) lblImpulse.style.display = isElderPeriod(period) ? '' : 'none';
  const lblChannel = document.getElementById('lbl-channel');
  if (lblChannel) lblChannel.style.display = isElderPeriod(period) ? '' : 'none';
  const lblGap = document.getElementById('lbl-gap');
  if (lblGap) {
    const showGap = typeof GapScanner !== 'undefined' && GapScanner.isGapPeriod(period);
    lblGap.style.display = showGap ? '' : 'none';
  }
  // 筹码: 日/周/月 K
  const lblChip = document.getElementById('lbl-chip');
  if (lblChip) lblChip.style.display = isChipPeriod(period) ? '' : 'none';
  if (!isChipPeriod(period)) STATE.chips = null;
  // 五档: 所有周期常显
  const lblDepth = document.getElementById('lbl-depth');
  if (lblDepth) lblDepth.style.display = '';
  showSidePanel(sidePanelOn());
  showDepthSection(depthSecOn());
}

function switchPeriod(period) {
  if (!ALL_PERIODS.includes(period) || period === STATE.period) return;
  STATE._periodSwitching = true;
  applyPeriodUI(period);
  syncSymbolUrl(true); // 周期写入 URL: 刷新/分享/从监控中心跳转保持一致
  ensureQuoteStream(); // 订阅跟随标的；切周期不重置基本信息/五档
  if (period === 'intraday') {
    fetchIntraday({ retainChart: true });
  } else {
    fetchData({ retainPanels: true });
  }
}

/** 筹码分布: 日/周/月K (分时不适用); 服务端始终按日线粒度算, 周/月K 窗口更长 */
function isChipPeriod(p) {
  return p === '1d' || p === '1w' || p === '1M';
}

/** Elder 通道 (EMA13±ATR) 与动力系统 (EMA13+MACD柱): 日/周/月K 适用 */
function isElderPeriod(p) {
  return p === '1d' || p === '1w' || p === '1M';
}

function onIndicatorChange() {
  if (STATE.period === 'intraday' && STATE.intradayData) {
    renderIntraday(STATE.intradayData);
  } else if (STATE.klineData) {
    updateChart(false);
  }
}

/** 图表规范 URL: /?symbol=X[&period=P]; 日K 省略 period (与旧链接兼容) */
function chartUrl(symbol, period) {
  let url = '/?symbol=' + encodeURIComponent(symbol || '');
  if (period && period !== '1d') url += '&period=' + encodeURIComponent(period);
  return url;
}

/** 用户切换符号统一入口: 同步输入框与 STATE, 符号变化时 pushState (返回键可回到上一只股票) */
function switchSymbol(symbol) {
  symbol = (symbol || '').trim();
  if (!symbol) return false;
  document.getElementById('symbol-input').value = symbol;
  if (symbol === STATE.symbol) return false;
  STATE.symbol = symbol;
  try { history.pushState({ symbol }, '', chartUrl(symbol, STATE.period)); } catch (e) { /* ignore */ }
  return true;
}

/** 规范化当前 URL 为 /?symbol=[&period=] (入口加载/周期切换用 replaceState, 不产生新历史) */
function syncSymbolUrl(replace) {
  if (!replace) return;
  try { history.replaceState({ symbol: STATE.symbol }, '', chartUrl(STATE.symbol, STATE.period)); } catch (e) { /* ignore */ }
}

/** 换股: 丢弃上只股票的面板快照, 并解除节流让信息/五档立即重取 */
function resetSidePanelData() {
  STATE.stockInfo = null;
  STATE.depth = null;
  STATE._lastInfoAt = 0;
  STATE._lastDepthAt = 0;
  setTrades(null);   // 持仓/风控线同属"上一只股票的数据", 换股先作废 (两条加载路径各自会重新拉)
}

function loadCurrent() {
  resetSidePanelData(); // 换股先作废旧股面板数据, 避免信息/五档停留在上一只
  ensureQuoteStream();  // SSE 快照流跟随当前标的 (含分时换股)
  refreshSymbolPanels(); // 市场数据抽屉/预警弹窗随换股刷新
  if (STATE.period === 'intraday') {
    STATE.intradayData = null; // 清缓存，强制重新加载分时
    fetchIntraday();
  } else {
    fetchData();
  }
  fetchStockInfo(); // 基本信息随换股刷新
  if (depthSecOn()) fetchDepth(); // 五档随换股刷新
}

function refresh() {
  const input = document.getElementById('symbol-input').value.trim();
  if (!input) { switchSymbol('000001.SH'); loadCurrent(); return; }
  // 如果输入包含非数字/字母字符（如中文名），触发搜索而不是直接请求
  if (/[^\w.]/.test(input)) {
    fetch(`/api/search?q=${encodeURIComponent(input)}`)
      .then(r => r.json())
      .then(data => {
        const results = data.results || [];
        if (results.length > 0) {
          const r = results[0];
          switchSymbol(r.symbol);
          loadCurrent();
        }
      })
      .catch(() => {});
    return;
  }
  switchSymbol(input);
  loadCurrent();
}
