function drawSupported() {
  return !!Drawings && !!STATE.chart && STATE.klineData && STATE.klineData.klines
    && STATE.klineData.klines.length > 1 && STATE.period !== 'intraday';
}

/** 画线纯逻辑上下文: {n, dateMap:{map,dates}, bars} */
function drawCtx() {
  if (!drawSupported()) return null;
  if (!STATE.draw._dateMap || STATE.draw._dateMapKey !== STATE.klineData.klines[STATE.klineData.klines.length - 1].date + ':' + STATE.klineData.klines.length) {
    STATE.draw._dateMap = Drawings.buildDateIndexMap(STATE.klineData.klines);
    STATE.draw._dateMapKey = STATE.klineData.klines[STATE.klineData.klines.length - 1].date + ':' + STATE.klineData.klines.length;
  }
  return {
    n: STATE.klineData.klines.length,
    dateMap: STATE.draw._dateMap,
    bars: STATE.klineData.klines,
  };
}

/** 像素投影 P: x(idx)/y(price) 外推 (支持未来bar越界换算), grid=主图像素矩形。
 *  坐标轴未就绪时 (setOption 以 lazyUpdate 提交, 下一帧才 flush) convertToPixel 返回
 *  undefined —— 此时返回 null 让调用方跳过本次绘制, 不要拿它硬算。
 *  x 探针的价格: 对数轴下 price=0 非法 (会拿到 [x, null]), 改用末根 low 当参照。 */
function drawMapper() {
  const chart = STATE.chart;
  const bars = STATE.klineData && STATE.klineData.klines;
  if (!chart || !chartModel() || !bars || !bars.length) return null;
  const n = bars.length;
  const yMap = priceYMapper(bars);
  if (!yMap) return null;
  const barLow = Number(bars[n - 1].low);
  const xRef = (STATE.logScale && Number.isFinite(barLow) && barLow > 0) ? barLow : 0;
  const pLast = chart.convertToPixel({ gridIndex: 0 }, [n - 1, xRef]);
  if (!pLast || !Number.isFinite(pLast[0])) return null;
  const pxLast = pLast[0];
  const pPrev = n >= 2 ? chart.convertToPixel({ gridIndex: 0 }, [n - 2, xRef]) : null;
  const pxPrev = (pPrev && Number.isFinite(pPrev[0])) ? pPrev[0] : pxLast - 10;
  const xStep = (n >= 2 && pxLast !== pxPrev) ? pxLast - pxPrev : 10;
  const gr = (STATE._gridRects && STATE._gridRects[0]) || { left: 0, right: chart.getWidth(), top: 0, bottom: chart.getHeight() };
  return {
    W: chart.getWidth(), H: chart.getHeight(), grid: gr,
    x: (idx) => pxLast + (idx - (n - 1)) * xStep,
    y: yMap.yOf,
    idxAt: (px) => (n - 1) + (px - pxLast) / xStep,
    priceAt: yMap.priceAt,
  };
}

function drawNeedsFuture() {
  const dr = STATE.draw;
  if (dr.enabled || dr.autoLines) return true;
  return dr.drawings.some(d => d.extendRight || (d.points || []).some(p => p.off > 0));
}

/**
 * 未来预测区 markArea 项: 画线/延伸时右侧预留的 futureBars 根空白 bar 上铺淡色带 + 「预测区」标注,
 * 否则那段空白会被当成渲染缺口 (日期到不了右缘的原因见 drawNeedsFuture)。
 * category 轴上 markArea 的数值坐标会吸附到槽位中心, 故起止取未来槽两端 (±0.5); 无未来槽返回 null。
 */
function buildFutureZoneMarkArea(dates, futureBars, colors) {
  if (!dates || !dates.length || !(futureBars > 0)) return null;
  const n = dates.length;
  return [
    {
      xAxis: n - 0.5,
      itemStyle: { color: colors.predictFill, borderColor: colors.predictBorder, borderWidth: 1 },
      label: { show: true, formatter: '预测区', position: 'insideTop', color: colors.text, fontSize: 10, opacity: 0.75 },
    },
    { xAxis: n - 1 + futureBars + 0.5 },
  ];
}

/**
 * 分类轴写入日期 + 未来 bar 槽位 (画线/预测延伸时右侧留白)。
 * 只作用于 category 轴: 筹码叠加的 xAxis 是 value 轴 (0..权重), 量纲与 bar 数量无关,
 * 若一并写入 dates.length+futureBars 会把筹码柱压成亚像素宽 → 画线模式下筹码峰不可见。
 */
function applyFutureSlots(xAxes, dates, futureBars) {
  xAxes.forEach(x => {
    if (x.type !== 'category') return;
    x.data = dates;
    if (futureBars > 0) x.max = dates.length - 1 + futureBars;
  });
}

// ── 主图 tooltip 相交提示: 线型画线在该 bar 的价位与相对 close 的偏离 ──
const DRAW_SHORT_LABELS = {
  trend: '趋势线', ray: '射线', arrow: '箭头线', hline: '水平线',
  channel: '通道线', regression: '回归中线',
};

function drawingCrossTooltipHtml(idx, close) {
  const dr = STATE.draw;
  if (!dr || !dr.visible) return '';
  const hasAuto = dr.autoLines && (dr._autoLines || []).length > 0;
  if (!dr.drawings.length && !hasAuto) return '';
  const ctx = drawCtx();
  if (!ctx) return '';
  const rows = [];
  const pushRow = (label, color, val) => {
    if (val == null || !Number.isFinite(val)) return;
    let pctHtml = '';
    if (close) {
      const pct = normPct((close - val) / Math.abs(close) * 100);
      const clr = pct >= 0 ? C().up : C().down;
      pctHtml = ` <span style="color:${clr};font-weight:700">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>`;
    }
    rows.push(`<div><span style="color:${color}">${escHtml(label)}</span> <b>${fmtPrice3(val)}</b>${pctHtml}</div>`);
  };
  dr.drawings.forEach(d => {
    const label = DRAW_SHORT_LABELS[d.type];
    if (!label) return;
    const mon = (d.monitor && d.monitor.enabled && d.name) ? '🔔' + d.name + '·' : '';
    pushRow(mon + label, d.style.color, Drawings.valueAt(d, idx, ctx));
  });
  if (hasAuto) {
    (dr._autoLines || []).forEach(a => {
      if (idx < a.points[0].i) return;
      const v = Drawings.lineValue(a.points[0], a.points[1], idx);
      pushRow(a.kind === 'L' ? '自动支撑' : '自动压力', a.kind === 'L' ? C().up : C().down, v);
    });
  }
  if (!rows.length) return '';
  return `<div style="margin-top:4px;padding-top:4px;border-top:1px solid ${C().tipBorder}">${rows.join('')}</div>`;
}

// ── 渲染: 面板标签 + 画线 + 自动建议线 + 草稿 (replaceMerge 整层刷新) ──
// ── 渲染: 独立覆盖 canvas ──
// 画线层不进 ECharts graphic (其增量合并对新增元素不可靠且静默失败),
// 改为透明 overlay canvas 重绘; 事件仍由 zrender 派发 (pointer-events:none 不遮挡图表)。
function redrawDrawings(panelLabels) {
  const dr = STATE.draw;
  if (panelLabels) dr._labels = panelLabels;
  if (dr._raf) { dr._rafAgain = true; return; }
  dr._raf = true;
  requestAnimationFrame(() => {
    dr._raf = false;
    const again = dr._rafAgain === true;
    dr._rafAgain = false;
    const done = _renderDrawingsNow();
    if (done === false && dr._retry < 3) {   // 投影未就绪: 保留上一帧并补绘, 有上限防空转
      dr._retry += 1;
      redrawDrawings();
      return;
    }
    if (done !== false && again) {           // 排期期间又被请求: 内容可能已变, 再画一帧
      dr._retry = 0;
      redrawDrawings();
      return;
    }
    dr._retry = 0;
  });
}

function drawOverlayCtx() {
  const chart = STATE.chart;
  const cv = document.getElementById('draw-overlay');
  if (!chart || !cv) return null;
  const dpr = window.devicePixelRatio || 1;
  const W = chart.getWidth(), H = chart.getHeight();
  const bw = Math.round(W * dpr), bh = Math.round(H * dpr);
  if (cv.width !== bw || cv.height !== bh) {
    cv.width = bw; cv.height = bh;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  const c2 = cv.getContext('2d');
  c2.setTransform(dpr, 0, 0, dpr, 0, 0);
  c2.clearRect(0, 0, W, H);
  return c2;
}

function strokeSeg(c2, x1, y1, x2, y2, color, width, dash) {
  if (![x1, y1, x2, y2].every(Number.isFinite)) return; // 脏坐标会毒化整个 canvas 状态
  c2.beginPath();
  c2.moveTo(x1, y1);
  c2.lineTo(x2, y2);
  c2.strokeStyle = color;
  c2.lineWidth = width || 1;
  c2.setLineDash(dash || []);
  c2.stroke();
  c2.setLineDash([]);
}

function hexToRgba(hex, alpha) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
  if (!m) return hex;
  const v = parseInt(m[1], 16);
  return `rgba(${(v >> 16) & 255},${(v >> 8) & 255},${v & 255},${alpha})`;
}

function paintHandle(c2, x, y, color) {
  if (!Number.isFinite(x) || !Number.isFinite(y)) return;
  c2.beginPath();
  c2.arc(x, y, Drawings.HANDLE_R, 0, Math.PI * 2);
  c2.fillStyle = '#fff';
  c2.fill();
  c2.lineWidth = 2;
  c2.strokeStyle = color;
  c2.stroke();
}

function paintTag(c2, text, xRight, y, bg) {
  c2.font = '10px monospace';
  const w = c2.measureText(text).width + 8;
  const h = 15;
  c2.fillStyle = bg;
  c2.fillRect(xRight + 2, y - h / 2, w, h);
  c2.fillStyle = '#fff';
  c2.fillText(text, xRight + 6, y + 3.5);
  c2.font = '12px monospace';
}

/** 贴线框签归属哪一列: 贴网格左缘 / 右缘的算列内 (要纵向错开), 其它位置各自独立 */
function tagColumnOf(x, grid) {
  if (!grid) return 'free';
  if (Math.abs(x - grid.left) <= 12) return 'left';
  if (Math.abs(x - grid.right) <= 12) return 'right';
  return 'free';
}

/** 画线层贴线框签: 同一列"先收集后错开"再落笔。
 *  左缘列把现价/风控签当不可移动的占位 —— 画线注解给行情签让位, 谁也不会盖谁。
 *  注: 斐波那契档位/仓位盒 R:R/测量尺等文字在各自锚点 (非同一列), 不走这里。 */
function paintTagLayer(c2, tags, P) {
  if (!tags || !tags.length || !P) return;
  const bounds = { top: P.grid.top, bottom: P.grid.bottom };
  const reserve = [];
  Object.keys(STATE._tagSlots || {}).forEach(k => {
    const s = STATE._tagSlots[k];
    if (s && !s.dropped && Number.isFinite(s.centerY)) reserve.push(s.centerY);
  });
  ['right', 'left'].forEach(col => {
    const list = tags.filter(t => t.col === col);
    if (!list.length) return;
    const res = stackTags(list.map(t => ({ key: t.id, y: t.y, priority: 10 })),
      bounds, col === 'left' ? reserve : []);
    const byKey = {};
    res.forEach(r => { byKey[r.key] = r; });
    list.forEach(t => {
      const r = byKey[t.id];
      if (!r || r.dropped) return;
      paintTag(c2, t.text, t.x, r.y, t.bg);
    });
  });
  tags.filter(t => t.col === 'free').forEach(t => paintTag(c2, t.text, t.x, t.y, t.bg));
}

function paintLabels(c2, labels) {
  (labels || []).forEach(l => {
    c2.font = l.font || 'bold 11px monospace';
    c2.fillStyle = l.fill;
    c2.textAlign = l.align || 'left';   // 支持右对齐列 (筹码摘要数值列)
    c2.fillText(l.text, l.x, l.y);
  });
  c2.textAlign = 'left';
  c2.font = '12px monospace';
}

/** 面板图例: 每个面板名下方常显最近可见 bar 的指标值 ( TradingView 图例栏) */
function paintLegend(c2, dctx) {
  if (!STATE.klineData || !STATE.klineData.klines) return;
  const klines = STATE.klineData.klines;
  const n = klines.length;
  let endIdx = n - 1;
  try {
    const dz = STATE.chart.getOption().dataZoom[0];
    if (dz && dz.endValue != null) endIdx = Math.max(0, Math.min(n - 1, Math.round(dz.endValue)));
  } catch (e) { /* 用最新 bar */ }
  const k = klines[endIdx];
  if (!k) return;
  const fmt3 = fmtPrice3;
  const hasVolume = document.getElementById('chk-volume').checked;
  const panels = getIndicatorPanels();
  const startGi = hasVolume ? 2 : 1;
  if (!STATE._gridRects || STATE._gridRects.length <= startGi) return;

  // 面板内绘制: 文本放网格左上角内侧, 加半透明底衬; 超宽按词截断
  const put = (gi, text, fill, yOff) => {
    const rect = STATE._gridRects[gi];
    if (!rect) return;
    const x = rect.left + 6;
    const y = rect.top + (yOff || 17);
    const maxW = rect.right - rect.left - 14;
    let t = text;
    if (c2.measureText(t).width > maxW) {
      const words = t.split('  ');
      while (words.length > 1 && c2.measureText(words.join('  ') + ' …').width > maxW) words.pop();
      t = words.join('  ');
      while (t.length > 4 && c2.measureText(t + '…').width > maxW) t = t.slice(0, -1);
      if (t !== text) t += '…';
    }
    const w = Math.min(c2.measureText(t).width + 10, maxW + 10);
    c2.fillStyle = C().bg;
    c2.globalAlpha = 0.65;
    c2.fillRect(x - 4, y - 12, w, 16);
    c2.globalAlpha = 1;
    c2.fillStyle = fill;
    c2.fillText(t, x, y);
  };

  c2.font = '11px monospace';
  // 主图: MA + BOLL
  const eff = effectiveMaBoll(klines);
  const parts = STATE.maPeriods.map((p, i) => `MA${p} ${fmt3(eff.ma[i][endIdx])}`);
  if (document.getElementById('chk-boll').checked) {
    parts.push(`BOLL ${fmt3(eff.boll.up[endIdx])}/${fmt3(eff.boll.mid[endIdx])}/${fmt3(eff.boll.low[endIdx])}`);
  }
  put(0, parts.join('  '), C().text, 31);

  const valText = {
    macd: () => `DIF ${fmt3(k.macd_dif)}  DEA ${fmt3(k.macd_dea)}  柱 ${fmt3(k.macd_hist)}`,
    kdj: () => `K ${fmt3(k.kdj_k)}  D ${fmt3(k.kdj_d)}  J ${fmt3(k.kdj_j)}`,
    rsi: () => `RSI ${fmt3(k.rsi6, 1)} / ${fmt3(k.rsi12, 1)} / ${fmt3(k.rsi24, 1)}`,
    atr: () => `ATR14 ${fmt3(k.atr14, 3)}`,
    obv: () => `OBV ${fmtVolume(k.obv)}  MAOBV ${fmtVolume(k.maobv)}`,
    premium: () => `溢价率 ${k.premium == null ? '—' : k.premium.toFixed(2) + '%'}`,
    wr: () => `WR14 ${fmt3(k.wr14)}`,
    cci: () => `CCI14 ${fmt3(k.cci14, 1)}`,
    bias: () => `BIAS ${fmt3(k.bias6)} / ${fmt3(k.bias12)} / ${fmt3(k.bias24)}`,
    dmi: () => `+DI ${fmt3(k.dmi_pdi, 1)}  -DI ${fmt3(k.dmi_mdi, 1)}  ADX ${fmt3(k.dmi_adx, 1)}`,
  };
  panels.forEach((p, i) => {
    if (!valText[p]) return;
    put(startGi + i, valText[p](), C().text, 31);
  });
  c2.font = '12px monospace';
}

/** JSON 请求助手 (市场数据抽屉/预警弹窗用; 401 由全局 fetch 包装器跳登录) */
async function api(path, options = {}) {
  const resp = await fetch(path, options);
  try { return await resp.json(); } catch (e) { return { error: "HTTP " + resp.status }; }
}

// ── A股市场数据抽屉 ──
let _cnTab = "fund-flow";
let _cnSeq = 0;   // 请求序号: 丢弃过期响应, 防止旧 tab/旧股票的数据覆盖新内容
function toggleCnDrawer() {
  const d = document.getElementById("cn-drawer");
  const show = d.style.display !== "block";
  d.style.display = show ? "block" : "none";
  if (show) showCnTab(_cnTab);
}
/** 抽屉宽度按表格内容自适应 (下限 440, 上限 92vw); 无表格时回落到 CSS clamp */
function fitCnDrawer() {
  const drawer = document.getElementById('cn-drawer');
  if (!drawer) return;
  const table = document.querySelector('#cn-body table');
  if (!table) { drawer.style.width = ''; return; }
  const maxW = Math.round(window.innerWidth * 0.92);
  const need = Math.ceil(table.scrollWidth) + 26;   // 左右 padding + 边框
  drawer.style.width = Math.min(Math.max(need, 440), maxW) + 'px';
}

function showCnTab(tab) {
  _cnTab = tab;
  const seq = ++_cnSeq;
  document.querySelectorAll(".cn-tab").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".cn-tab").forEach(b => {
    if (b.getAttribute("onclick") === `showCnTab('${tab}')`) b.classList.add("active");
  });
  const body = document.getElementById("cn-body");
  body.innerHTML = '<div style="color:var(--text-secondary)">加载中…</div>';
  const symbol = STATE.symbol;
  const url = `/api/cn/${tab}?symbol=${encodeURIComponent(symbol)}`;
  api(url).then(data => {
    if (seq !== _cnSeq) return;                // 已切到新 tab, 丢弃过期响应
    if (STATE.symbol !== symbol) return;       // 已切股
    if (data.error) { body.innerHTML = `<div style="color:var(--down-text)">加载失败: ${escHtml(data.error)}</div>`; return; }
    const rows = data.rows || [];
    const hint = data.hint ? `<div style="color:var(--text-secondary);margin-bottom:6px">${escHtml(data.hint)}</div>` : "";
    const fmtNum = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(2));
    // 单票键值视图 (如主力净流入): kv=[[label, value], ...], 数值按正负着色
    if (Array.isArray(data.kv) && data.kv.length) {
      body.innerHTML = hint + `<div class="cn-kv">` + data.kv.map(it => {
        const label = it[0], value = it[1];
        let v;
        if (value == null) v = "—";
        else if (typeof value === "number") v = `<span class="${value >= 0 ? "pos" : "neg"}">${fmtNum(value)}</span>`;
        else v = escHtml(String(value));
        return `<div class="cn-kv-row"><span class="cn-kv-label">${escHtml(label)}</span>` +
               `<span class="cn-kv-val">${v}</span></div>`;
      }).join("") + `</div>`;
      return;
    }
    if (!rows.length) { body.innerHTML = hint + '<div style="color:var(--text-secondary)">暂无数据</div>'; return; }
    const cols = Object.keys(rows[0]).slice(0, 7);
    const hl = data.highlight_symbol ? String(data.highlight_symbol) : "";
    body.innerHTML = hint + `<table><thead><tr>${cols.map(c => `<th>${escHtml(c)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => {
        const rowHl = hl && String(r[cols[0]]) === hl ? ' class="hl"' : "";
        return `<tr${rowHl}>${cols.map(c => {
          const v = r[c];
          if (typeof v === "string" && v.startsWith("http")) {
            return `<td><a href="${escHtml(v)}" target="_blank" rel="noopener noreferrer" style="color:var(--btn-active)">查看</a></td>`;
          }
          const cls = typeof v === "number" ? (v >= 0 ? "pos" : "neg") : "";
          return `<td class="${cls}">${typeof v === "number" ? fmtNum(v) : escHtml(v)}</td>`;
        }).join("")}</tr>`;
      }).join("")}</tbody></table>`;
  }).catch(e => {
    if (seq !== _cnSeq) return;                // 过期请求的报错不覆盖新内容
    body.innerHTML = `<div style="color:var(--down-text)">加载失败: ${escHtml(e.message || e)}</div>`;
  }).finally(() => {
    if (seq === _cnSeq) fitCnDrawer();         // 仅当前请求按内容宽度自适应
  });
}

function paintDrawing(c2, d, P, ctx, selected, tags) {
  const g = Drawings.geom(d, P, ctx);
  if (!g) return;
  const color = d.style.color, width = d.style.width, dash = d.style.dash ? [6, 4] : [];
  switch (d.type) {
    case 'trend': case 'ray': case 'arrow': {
      if (!g.c) break;
      strokeSeg(c2, g.c[0], g.c[1], g.c[2], g.c[3], color, width, dash);
      if (d.type === 'arrow' && g.c[2] !== g.c[0]) {
        const tail = Drawings.arrowHead(g.c[0], g.c[1], g.c[2], g.c[3], 4 + width * 3);
        strokeSeg(c2, tail.lx, tail.ly, g.c[2], g.c[3], color, width, []);
        strokeSeg(c2, tail.rx, tail.ry, g.c[2], g.c[3], color, width, []);
      }
      break;
    }
    case 'hline':
      strokeSeg(c2, P.grid.left, g.y, P.grid.right, g.y, color, width, dash);
      const tag = { id: 'px:' + d.id, text: fmtPrice3(g.price), x: P.grid.right, y: g.y,
        bg: color, col: tagColumnOf(P.grid.right, P.grid) };
      if (tags) tags.push(tag); else paintTag(c2, tag.text, tag.x, tag.y, tag.bg);
      break;
    case 'vline':
      strokeSeg(c2, g.x, P.grid.top, g.x, P.grid.bottom, color, width, dash);
      break;
    case 'poly': {
      if (g.pts.length < 2) break;
      c2.beginPath();
      g.pts.forEach((p, i) => i ? c2.lineTo(p.x, p.y) : c2.moveTo(p.x, p.y));
      c2.strokeStyle = color; c2.lineWidth = width; c2.setLineDash(dash);
      c2.stroke(); c2.setLineDash([]);
      break;
    }
    case 'rect':
      c2.fillStyle = hexToRgba(color, 0.08);
      c2.fillRect(g.x, g.y, g.w, g.h);
      c2.strokeStyle = color; c2.lineWidth = width; c2.setLineDash(dash);
      c2.strokeRect(g.x, g.y, g.w, g.h); c2.setLineDash([]);
      break;
    case 'channel': {
      const c1 = Drawings.clipSeg(g.a.x, g.a.y, g.b.x, g.b.y, P.grid);
      const c2b = Drawings.clipSeg(g.a.x + g.dx, g.a.y + g.dy, g.b.x + g.dx, g.b.y + g.dy, P.grid);
      if (c1) strokeSeg(c2, c1[0], c1[1], c1[2], c1[3], color, width, dash);
      if (c2b) strokeSeg(c2, c2b[0], c2b[1], c2b[2], c2b[3], color, width, dash);
      break;
    }
    case 'fib': {
      c2.font = '10px monospace';
      for (let i = 0; i < g.levels.length; i++) {
        const lv = g.levels[i];
        if (i < g.levels.length - 1) {
          const y2 = g.levels[i + 1].y;
          c2.fillStyle = hexToRgba(color, i % 2 ? 0.04 : 0.08);
          c2.fillRect(g.xStart, Math.min(lv.y, y2), g.xEnd - g.xStart, Math.abs(y2 - lv.y));
        }
        strokeSeg(c2, g.xStart, lv.y, g.xEnd, lv.y, color, 1, []);
        c2.fillStyle = color;
        c2.fillText((lv.r * 100).toFixed(1) + '%  ' + fmtPrice3(lv.price), g.xStart + 4, lv.y - 4);
      }
      break;
    }
    case 'regression':
      strokeSeg(c2, g.up1.x, g.up1.y, g.up2.x, g.up2.y, color, 1, [4, 4]);
      strokeSeg(c2, g.lo1.x, g.lo1.y, g.lo2.x, g.lo2.y, color, 1, [4, 4]);
      strokeSeg(c2, g.mid1.x, g.mid1.y, g.mid2.x, g.mid2.y, color, width, dash);
      c2.font = '10px monospace'; c2.fillStyle = color;
      c2.textAlign = 'center';
      c2.fillText('REG ±' + Drawings.REG_SIGMA + 'σ', (g.x1 + g.x2) / 2, g.up2.y - 8);
      c2.textAlign = 'left';
      break;
    case 'text':
      c2.font = '13px sans-serif';
      c2.fillStyle = color;
      c2.fillText(g.text || ' ', g.x, g.y);
      break;
    case 'position': {
      const profitCol = g.dir === 'long' ? C().up : C().down;
      const lossCol = g.dir === 'long' ? C().down : C().up;
      const boxW = Math.max(g.x2 - g.x1, 10);
      c2.fillStyle = hexToRgba(profitCol, 0.15);
      c2.fillRect(g.x1, Math.min(g.entryY, g.targetY), boxW, Math.abs(g.targetY - g.entryY));
      c2.fillStyle = hexToRgba(lossCol, 0.15);
      c2.fillRect(g.x1, Math.min(g.entryY, g.stopY), boxW, Math.abs(g.stopY - g.entryY));
      strokeSeg(c2, g.x1, g.entryY, g.x2, g.entryY, color, width, []);
      strokeSeg(c2, g.x1, g.targetY, g.x2, g.targetY, profitCol, 1, [4, 4]);
      strokeSeg(c2, g.x1, g.stopY, g.x2, g.stopY, lossCol, 1, [4, 4]);
      c2.font = '10px monospace'; c2.fillStyle = color;
      c2.fillText((g.dir === 'long' ? '做多' : '做空') + '  R:R ' + g.rr.toFixed(2), g.x1 + 4, g.entryY - 8);
      break;
    }
  }
  // 监控趋势线名称标签 (🔔名称, 随线色)
  if (d.monitor && d.monitor.enabled && d.name &&
      (d.type === 'trend' || d.type === 'ray' || d.type === 'hline')) {
    let lx, ly;
    if (d.type === 'hline') { lx = P.grid.left + 4; ly = g.y; }
    else if (g.c) { lx = g.c[2]; ly = g.c[3]; }
    else { lx = g.raw2.x; ly = g.raw2.y; }
    const tag = { id: 'mn:' + d.id, text: '🔔' + d.name, x: lx, y: ly, bg: color,
      col: tagColumnOf(lx - 4, P.grid) };
    if (tags) tags.push(tag); else paintTag(c2, tag.text, tag.x, tag.y, tag.bg);
  }
  if (selected) {
    Drawings.handlesOf(d, P, ctx).forEach(h => paintHandle(c2, h.x, h.y, color));
  }
}

function refreshAutoLines(ctx) {
  const key = STATE.symbol + ':' + STATE.period + ':' + ctx.n + ':' + ctx.bars[ctx.n - 1].date;
  if (STATE.draw._autoKey === key && STATE.draw._autoLines) return;
  STATE.draw._autoKey = key;
  STATE.draw._autoLines = Drawings.detectTrendlines(ctx.bars, {});
}

function paintAutoLines(c2, P, ctx) {
  (STATE.draw._autoLines || []).forEach(a => {
    if (a.points[1].i === a.points[0].i) return;
    const x1 = P.x(a.points[0].i), y1 = P.y(a.points[0].p);
    const slope = (a.points[1].p - a.points[0].p) / (a.points[1].i - a.points[0].i);
    const y2 = P.y(a.points[1].p + slope * (P.idxAt(P.grid.right) - a.points[1].i));
    const clipped = Drawings.clipSeg(x1, y1, P.grid.right, y2, P.grid);
    if (!clipped) return;
    const color = a.kind === 'L' ? C().up : C().down;
    strokeSeg(c2, clipped[0], clipped[1], clipped[2], clipped[3], color, 1, [3, 5]);
    c2.font = '10px monospace'; c2.fillStyle = color;
    c2.fillText((a.kind === 'L' ? '自动支撑' : '自动压力') + ' · ' + a.touches + '触点', clipped[0] + 4, clipped[1] - 6);
    c2.font = '12px monospace';
  });
}

function paintSuggest(c2, P, ctx) {
  const sug = STATE.draw.suggest;
  if (!sug) return;
  const d = STATE.draw.drawings.find(x => x.id === sug.forId);
  if (!d) return;
  const ghost = {
    id: 'sug', type: d.type,
    points: sug.points.map(pt => Drawings.pointFromIdx(pt.i, pt.p, ctx.dateMap, ctx.n)),
    style: { color: '#e6a23c', width: 2, dash: true }, extendRight: d.extendRight,
  };
  const g = Drawings.geom(ghost, P, ctx);
  if (!g || !g.c) return;
  strokeSeg(c2, g.c[0], g.c[1], g.c[2], g.c[3], '#e6a23c', 2, [6, 4]);
  paintHandle(c2, g.raw1.x, g.raw1.y, '#e6a23c');
  paintHandle(c2, g.raw2.x, g.raw2.y, '#e6a23c');
}

function paintDraft(c2, P, ctx) {
  const draft = STATE.draw.draft;
  if (!draft) return;
  const pts = draft.pts;
  const pointer = STATE.draw._pointer;
  const color = '#e6a23c';
  if (draft.tool === 'measure') {
    if (pts.length >= 1) {
      const a = pts[0], b = pts[1] || pointer;
      if (b) {
        const x1 = P.x(a.idx), y1 = P.y(a.price), x2 = P.x(b.idx), y2 = P.y(b.price);
        c2.fillStyle = 'rgba(230,162,60,0.12)';
        c2.fillRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        c2.strokeStyle = color; c2.lineWidth = 1;
        c2.strokeRect(Math.min(x1, x2), Math.min(y1, y2), Math.abs(x2 - x1), Math.abs(y2 - y1));
        const st = Drawings.measureStats(ctx.dateMap.dates, Math.round(a.idx), Math.round(b.idx), a.price, b.price);
        c2.font = '12px monospace';
        c2.fillStyle = st.dp >= 0 ? C().up : C().down;
        c2.fillText((st.dp >= 0 ? '+' : '') + normPct(st.pct).toFixed(2) + '%', Math.max(x1, x2) + 6, Math.min(y1, y2) + 4);
        c2.fillText(st.bars + ' 根 / ' + Math.abs(st.days) + ' 天', Math.max(x1, x2) + 6, Math.min(y1, y2) + 20);
      }
    }
    return;
  }
  if (draft.tool === 'hline' && pts.length >= 1) {
    strokeSeg(c2, P.grid.left, P.y(pts[0].price), P.grid.right, P.y(pts[0].price), color, 1, []);
  } else if (draft.tool === 'vline' && pts.length >= 1) {
    strokeSeg(c2, P.x(pts[0].idx), P.grid.top, P.x(pts[0].idx), P.grid.bottom, color, 1, []);
  } else if (draft.tool === 'text') {
    /* 文本: 输入框交互, 无需预览 */
  } else if (pts.length >= 1) {
    const all = pointer ? pts.concat([pointer]) : pts;
    if (draft.tool === 'poly' && all.length >= 2) {
      c2.beginPath();
      all.forEach((p, i) => { const x = P.x(p.idx), y = P.y(p.price); i ? c2.lineTo(x, y) : c2.moveTo(x, y); });
      c2.strokeStyle = color; c2.lineWidth = 1; c2.stroke();
    } else if (draft.tool === 'channel' && pts.length >= 2 && pointer) {
      strokeSeg(c2, P.x(pts[0].idx), P.y(pts[0].price), P.x(pts[1].idx), P.y(pts[1].price), color, 1, []);
      const dx = P.x(pointer.idx) - P.x(pts[0].idx), dy = P.y(pointer.price) - P.y(pts[0].price);
      strokeSeg(c2, P.x(pts[0].idx) + dx, P.y(pts[0].price) + dy, P.x(pts[1].idx) + dx, P.y(pts[1].price) + dy, color, 1, []);
    } else if (all.length >= 2) {
      strokeSeg(c2, P.x(all[0].idx), P.y(all[0].price), P.x(all[1].idx), P.y(all[1].price), color, 1, []);
    }
    all.forEach(p => paintHandle(c2, P.x(p.idx), P.y(p.price), color));
  }
}

function _renderDrawingsNow() {
  const chart = STATE.chart;
  if (!chart) return false;
  const dctx = drawCtx();
  const paint = !!dctx && STATE.draw.visible;
  // 投影必须先于清屏算好: lazyUpdate 后坐标轴未 flush 时 drawMapper 返回 null,
  // 若先 clearRect, 上一帧画线就被擦成空白 (退出画线模式丢线的症状)。
  const P = paint ? drawMapper() : null;
  if (paint && !P) return false; // 保留上一帧, 由 redrawDrawings 下一帧补绘
  const c2 = drawOverlayCtx();
  if (!c2) return false;
  if (!dctx) { positionDrawMenu(); return true; }
  // 面板名/图例是图表固有元素, 不随 👁 画线显隐开关消失
  paintLabels(c2, STATE.draw._labels);
  paintLegend(c2, dctx);
  if (!STATE.draw.visible) { positionDrawMenu(); return true; }
  if (STATE.draw.autoLines) refreshAutoLines(dctx);
  if (STATE.draw.autoLines) paintAutoLines(c2, P, dctx);
  const tags = [];  // 贴线框签: 先收集, 全部图形画完再按列错开落笔
  STATE.draw.drawings.forEach(d => paintDrawing(c2, d, P, dctx, STATE.draw.selectedId === d.id, tags));
  if (STATE.draw.suggest) paintSuggest(c2, P, dctx);
  if (STATE.draw.draft) paintDraft(c2, P, dctx);
  paintTagLayer(c2, tags, P);
  positionDrawMenu();
  return true;
}

// ── 指针交互 ──
function initDrawEvents() {
  const zr = STATE.chart.getZr();
  zr.on('mousedown', onDrawMouseDown);
  zr.on('mousemove', onDrawMouseMove);
  zr.on('mouseup', onDrawMouseUp);
  zr.on('contextmenu', (e) => {
    if (!STATE.draw.enabled) return;
    if (e.event && e.event.preventDefault) e.event.preventDefault();
    if (STATE.draw.draft) cancelDraft();
    else selectDrawing(null);
  });
}

function drawPointer(e) {
  const ctx = drawCtx();
  if (!ctx) return null;
  const px = e.offsetX, py = e.offsetY;
  const gr = (STATE._gridRects && STATE._gridRects[0]) || null;
  if (!gr || py < gr.top - 4 || py > gr.bottom + 4) return null;
  const P = drawMapper();
  if (!P) return null;
  return { px, py, P, ctx, idxF: P.idxAt(px), price: P.priceAt(py) };
}

function snappedPoint(ptInfo) {
  if (STATE.draw.magnet && ptInfo.idxF <= ptInfo.ctx.n - 1) {
    const s = Drawings.snap(ptInfo.ctx.bars, ptInfo.idxF, ptInfo.price, ptInfo.P, Drawings.MAGNET_PX);
    return { idx: s.idx, price: s.price };
  }
  return { idx: ptInfo.idxF, price: ptInfo.price };
}

function onDrawMouseDown(e) {
  if (!STATE.draw.enabled || !drawSupported()) return;
  if (e.event && (e.event.button === 2)) return; // 右键: cancelDraft 在 contextmenu 处理
  if (e.event && e.event.button !== 0) return;
  const info = drawPointer(e);
  if (!info) return;
  const dr = STATE.draw;
  // 拖拽选中画线的手柄
  if (dr.tool === 'select' && dr.selectedId) {
    const d = dr.drawings.find(x => x.id === dr.selectedId);
    if (d) {
      const hit = Drawings.hitTest(d, info.P, info.ctx, info.px, info.py);
      if (hit && hit.part.startsWith('h')) {
        const ptIdx = parseInt(hit.part.slice(1), 10);
        dr.drag = { id: d.id, ptIdx, before: JSON.parse(JSON.stringify(d.points)) };
        try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: false }] }); } catch (err) { /* ignore */ }
        return;
      }
    }
  }
  if (dr.tool === 'select') {
    // 命中任一画线 → 选中
    for (let i = dr.drawings.length - 1; i >= 0; i--) {
      const hit = Drawings.hitTest(dr.drawings[i], info.P, info.ctx, info.px, info.py);
      if (hit) { selectDrawing(dr.drawings[i].id); return; }
    }
    selectDrawing(null);
    return;
  }
  // 画线工具: 逐点落子
  const pt = snappedPoint(info);
  if (dr.tool === 'text') {
    // 阻止 mousedown 默认行为(焦点转移到画布/body), 否则输入框刚 focus 即被 blur
    if (e.event && e.event.preventDefault) e.event.preventDefault();
    openTextInput(info, pt);
    return;
  }
  if (dr.tool === 'measure') {
    if (!dr.draft) {
      dr.draft = { tool: 'measure', pts: [pt] };
    } else {
      dr.draft.pts.push(pt);
      const snapshot = dr.draft;
      setTimeout(() => {
        if (STATE.draw.draft === snapshot) { STATE.draw.draft = null; redrawDrawings(); }
      }, 2500);
    }
    return;
  }
  if (!dr.draft) dr.draft = { tool: dr.tool, pts: [pt], need: DRAW_POINT_NEEDS[dr.tool] || 2 };
  else {
    // 折线: 双击结束的第二次按下与上一点重合, 不重复落点 (dblclick 事件负责结束)
    const lastPt = dr.draft.pts[dr.draft.pts.length - 1];
    if (dr.tool === 'poly' && lastPt
        && Math.abs(info.P.x(lastPt.idx) - info.px) < 6
        && Math.abs(info.P.y(lastPt.price) - info.py) < 6) return;
    dr.draft.pts.push(pt);
  }
  const need = dr.draft.need;
  if (dr.draft.pts.length >= need) finalizeDraft();
  else redrawDrawings();
}

function onDrawMouseMove(e) {
  if (!STATE.draw.enabled) return;
  const info = drawPointer(e);
  if (!info) return;
  STATE.draw._pointer = { idx: info.idxF, price: info.price };
  const dr = STATE.draw;
  if (dr.drag) {
    const d = dr.drawings.find(x => x.id === dr.drag.id);
    if (d) {
      const pt = snappedPoint(info);
      d.points[dr.drag.ptIdx] = Drawings.pointFromIdx(pt.idx, pt.price, info.ctx.dateMap, info.ctx.n);
      d.points[dr.drag.ptIdx].p = pt.price;
      redrawDrawings();
    }
    return;
  }
  if (dr.draft && dr.tool !== 'text') {
    // 预览端点跟随指针由 paintDraft 用 _pointer 绘制;
    // 已落子的锚点不可跟随鼠标, 否则第二击前 pt1 会被移动到 pt2 位置 (两点重合)
    redrawDrawings();
  }
}

function onDrawMouseUp() {
  const dr = STATE.draw;
  if (!dr.drag) return;
  const d = dr.drawings.find(x => x.id === dr.drag.id);
  if (d) {
    dr.undo.push({ op: 'move', id: d.id, before: dr.drag.before, after: JSON.parse(JSON.stringify(d.points)) });
    if (dr.undo.length > 50) dr.undo.shift();
    runSuggest(d);
    scheduleSave();
  }
  dr.drag = null;
  // 选择工具下恢复拖拽平移
  if (dr.enabled && dr.tool === 'select') {
    try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: true }] }); } catch (err) { /* ignore */ }
  }
  redrawDrawings();
}

// ── 草稿定稿 / 工具切换 / 选择 / 删除 / 撤销 ──
function finalizeDraft() {
  const dr = STATE.draw;
  const draft = dr.draft;
  if (!draft) return;
  dr.draft = null;
  if (!draft.pts.length) return;
  const ctx = drawCtx();
  if (!ctx) return;
  const pts = draft.pts.map(p => Drawings.pointFromIdx(p.idx, p.price, ctx.dateMap, ctx.n));
  let extra;
  if (draft.tool === 'position') {
    extra = { dir: draft.pts[1].price >= draft.pts[0].price ? 'long' : 'short' };
  }
  const d = Drawings.createDrawing(draft.tool, pts, extra);
  dr.drawings.push(d);
  dr.undo.push({ op: 'add', id: d.id });
  if (dr.undo.length > 50) dr.undo.shift();
  selectDrawing(d.id);
  if (draft.tool === 'trend' || draft.tool === 'ray') runSuggest(d);
  scheduleSave();
  redrawDrawings();
}

function finishPolyDraft() {
  const dr = STATE.draw;
  if (dr.draft && dr.draft.tool === 'poly' && dr.draft.pts.length >= 2) finalizeDraft();
  else cancelDraft();
}

function cancelDraft() {
  STATE.draw.draft = null;
  redrawDrawings();
}

/** 画线修正建议: 趋势线/射线定稿或拖拽后, 找触点更多的锚点方案 */
function runSuggest(d) {
  const ctx = drawCtx();
  if (!ctx || (d.type !== 'trend' && d.type !== 'ray')) return;
  const opt = Drawings.optimizeTrendline(ctx.bars, d, ctx, {});
  STATE.draw.suggest = opt ? { forId: d.id, points: opt.points, touches: opt.touches } : null;
  positionSuggestBox();
}

function selectDrawing(id) {
  if (id !== STATE.draw.selectedId) hideMonitorInput();
  STATE.draw.selectedId = id;
  if (!id) { STATE.draw.suggest = null; hideSuggestBox(); }
  if (id) showDrawMenu(); else hideDrawMenu();
  redrawDrawings();
}

function deleteSelectedDrawing() {
  const dr = STATE.draw;
  if (!dr.enabled || !dr.selectedId) return false;
  const idx = dr.drawings.findIndex(d => d.id === dr.selectedId);
  if (idx < 0) return false;
  dr.undo.push({ op: 'del', d: dr.drawings[idx], at: idx });
  dr.drawings.splice(idx, 1);
  dr.selectedId = null;
  dr.suggest = null;
  scheduleSave();
  redrawDrawings();
  return true;
}

function drawUndo() {
  const dr = STATE.draw;
  const op = dr.undo.pop();
  if (!op) return;
  if (op.op === 'add') {
    const i = dr.drawings.findIndex(d => d.id === op.id);
    if (i >= 0) dr.drawings.splice(i, 1);
    if (dr.selectedId === op.id) dr.selectedId = null;
  } else if (op.op === 'del') {
    dr.drawings.splice(Math.min(op.at, dr.drawings.length), 0, op.d);
  } else if (op.op === 'move') {
    const d = dr.drawings.find(x => x.id === op.id);
    if (d) d.points = op.before;
  }
  dr.suggest = null;
  scheduleSave();
  redrawDrawings();
}

// ── 工具面板 ──
function toggleDrawMode() {
  const dr = STATE.draw;
  if (!dr.enabled) {
    if (STATE.period === 'intraday') { showToast('分时视图暂不支持画线, 请切换到 K 线周期', { type: 'warn' }); return; }
    if (!drawSupported()) { showToast('图表尚未就绪', { type: 'warn' }); return; }
    dr.enabled = true;
    document.getElementById('btn-draw').classList.add('active');
    buildPalette();
    document.getElementById('draw-palette').style.display = 'flex';
  } else {
    dr.enabled = false;
    dr.draft = null;
    dr.drag = null;
    document.getElementById('btn-draw').classList.remove('active');
    document.getElementById('draw-palette').style.display = 'none';
    hideDrawMenu();
    hideSuggestBox();
    // futureBars 归零要重建坐标轴, 且重建必须先于清选中态触发的重绘:
    // setOption 用 lazyUpdate 提交, 坐标轴下一帧才 flush, 先重绘会拿不到投影
    // (drawMapper → null) 并把画线层清成空白 —— 退出画线模式丢线就是这么来的。
    updateChart(false);
    selectDrawing(null);
    return;
  }
  updateChart(false); // 未来bar空间随开关变化, 需重建坐标轴
}

function buildPalette() {
  const pal = document.getElementById('draw-palette');
  pal.innerHTML = '';
  DRAW_TOOLS.forEach(t => {
    const b = document.createElement('button');
    b.className = 'dp-btn' + (STATE.draw.tool === t.id ? ' active' : '');
    b.textContent = t.icon;
    b.title = t.title;
    b.dataset.tool = t.id;
    b.addEventListener('click', () => setDrawTool(t.id));
    pal.appendChild(b);
  });
  const sep = document.createElement('div');
  sep.className = 'dp-sep';
  pal.appendChild(sep);
  [['magnet', '🧲', '磁吸吸附 K 线开高低收'], ['auto', '⚡', '自动建议支撑/压力趋势线'], ['hide', '👁', '显示/隐藏画线'], ['undo', '↩', '撤销 (Ctrl+Z)'], ['clear', '🗑', '清空全部画线']].forEach(([id, icon, tip]) => {
    const b = document.createElement('button');
    b.className = 'dp-btn' + ((id === 'magnet' && STATE.draw.magnet) || (id === 'auto' && STATE.draw.autoLines) ? ' toggled' : '');
    b.textContent = icon;
    b.title = tip;
    b.dataset.act = id;
    b.addEventListener('click', () => onPaletteAction(id, b));
    pal.appendChild(b);
  });
}

function setDrawTool(tool) {
  STATE.draw.tool = tool;
  STATE.draw.draft = null;
  if (tool !== 'select') selectDrawing(null);
  document.querySelectorAll('#draw-palette .dp-btn[data-tool]').forEach(b => {
    b.classList.toggle('active', b.dataset.tool === tool);
  });
  // 拖拽平移锁: 非选择工具时禁用 (滚轮缩放不受影响)
  if (STATE.chart) {
    try { STATE.chart.setOption({ dataZoom: [{ moveOnMouseMove: tool === 'select' }] }); } catch (e) { /* ignore */ }
  }
  redrawDrawings();
}

function onPaletteAction(id, btn) {
  const dr = STATE.draw;
  if (id === 'magnet') {
    dr.magnet = !dr.magnet;
    btn.classList.toggle('toggled', dr.magnet);
    showToast('磁吸' + (dr.magnet ? '开启' : '关闭'));
  } else if (id === 'auto') {
    dr.autoLines = !dr.autoLines;
    btn.classList.toggle('toggled', dr.autoLines);
    dr._autoLines = null;
    updateChart(false); // 未来空间 + 重算
  } else if (id === 'hide') {
    dr.visible = !dr.visible;
    btn.classList.toggle('toggled', !dr.visible);
    redrawDrawings();
  } else if (id === 'undo') {
    drawUndo();
  } else if (id === 'clear') {
    if (!dr.drawings.length) return;
    if (!confirm('清空当前代码/周期下的全部 ' + dr.drawings.length + ' 条画线?')) return;
    dr.undo.push({ op: 'del-all', list: dr.drawings });
    dr.drawings = [];
    dr.selectedId = null;
    dr.suggest = null;
    scheduleSave();
    redrawDrawings();
  }
}

// ── 选中画线的迷你菜单 ──
function buildDrawMenu() {
  const box = document.getElementById('draw-menu-colors');
  box.innerHTML = '';
  Drawings.PALETTE.forEach(c => {
    const b = document.createElement('button');
    b.className = 'dm-dot';
    b.style.background = c;
    b.title = c;
    b.addEventListener('click', () => {
      const d = getSelected();
      if (!d) return;
      d.style.color = c;
      scheduleSave();
      redrawDrawings();
    });
    box.appendChild(b);
  });
  document.getElementById('dm-width').addEventListener('click', () => {
    const d = getSelected();
    if (!d) return;
    d.style.width = d.style.width === 2 ? 1 : 2;
    document.getElementById('dm-width').textContent = d.style.width === 2 ? '粗' : '细';
    scheduleSave();
    redrawDrawings();
  });
  document.getElementById('dm-extend').addEventListener('click', () => {
    const d = getSelected();
    if (!d) return;
    d.extendRight = !d.extendRight;
    document.getElementById('dm-extend').style.color = d.extendRight ? '#e6a23c' : '';
    scheduleSave();
    updateChart(false); // 延伸开关影响未来bar空间
  });
  document.getElementById('dm-monitor').addEventListener('click', () => {
    const d = getSelected();
    if (!d) return;
    openMonitorInput(d);
  });
  document.getElementById('dm-delete').addEventListener('click', () => deleteSelectedDrawing());
}

function getSelected() {
  return STATE.draw.drawings.find(d => d.id === STATE.draw.selectedId) || null;
}

function showDrawMenu() {
  const d = getSelected();
  const menu = document.getElementById('draw-menu');
  if (!d) { hideDrawMenu(); return; }
  menu.style.display = 'flex';
  document.querySelectorAll('#draw-menu .dm-dot').forEach(b => {
    b.classList.toggle('active', b.title === d.style.color);
  });
  document.getElementById('dm-width').textContent = d.style.width === 2 ? '粗' : '细';
  const ext = document.getElementById('dm-extend');
  ext.style.color = d.extendRight ? '#e6a23c' : '';
  const canExtend = ['trend', 'fib', 'regression', 'position', 'rect'].includes(d.type);
  ext.style.display = canExtend ? '' : 'none';
  const monBtn = document.getElementById('dm-monitor');
  const monOK = ['trend', 'ray', 'hline'].includes(d.type) && ['1d', '1w', '1M'].includes(STATE.period);
  monBtn.style.display = monOK ? '' : 'none';
  const isMon = !!(d.monitor && d.monitor.enabled);
  monBtn.textContent = isMon ? '🔔监控中' : '🔔监控';
  monBtn.style.color = isMon ? '#e6a23c' : '';
  positionDrawMenu();
}

function positionDrawMenu() {
  const d = getSelected();
  const menu = document.getElementById('draw-menu');
  if (!d || menu.style.display === 'none') return;
  const ctx = drawCtx();
  if (!ctx) return;
  const P = drawMapper();
  if (!P) return;
  const hs = Drawings.handlesOf(d, P, ctx);
  if (!hs.length) return;
  const wrap = document.getElementById('chart-wrap');
  menu.style.left = Math.max(4, Math.min(hs[0].x, wrap.clientWidth - menu.offsetWidth - 4)) + 'px';
  menu.style.top = Math.max(4, hs[0].y + 14) + 'px';
}

function hideDrawMenu() {
  document.getElementById('draw-menu').style.display = 'none';
  hideMonitorInput();
}

// ── 趋势线监控输入 (名称必填 = 强制命名) ──
const MON_LINE_TYPES = ['trend', 'ray', 'hline'];
const MON_PERIODS = ['1d', '1w', '1M'];
const ADJUST_LABELS = { forward: '前复权', hfq: '后复权', none: '不复权' };

function defaultMonitorPct() {
  const kd = STATE.klineData || {};
  return (kd.is_etf || kd.is_index) ? 3 : 2;
}

function openMonitorInput(d) {
  const box = document.getElementById('draw-monitor-input');
  const menu = document.getElementById('draw-menu');
  const wrap = document.getElementById('chart-wrap');
  const nameF = document.getElementById('dmi-name');
  const pctF = document.getElementById('dmi-pct');
  const stopBtn = document.getElementById('dmi-stop');
  box.style.display = 'block';
  const mr = menu.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
  box.style.left = Math.max(4, Math.min(mr.left - wr.left, wrap.clientWidth - box.offsetWidth - 4)) + 'px';
  box.style.top = Math.min(mr.bottom - wr.top + 6, wrap.clientHeight - box.offsetHeight - 4) + 'px';
  nameF.value = d.name || '';
  pctF.value = (d.monitor && d.monitor.pct) || defaultMonitorPct();
  const adjEl = document.getElementById('dmi-adjust');
  if (adjEl) adjEl.textContent = '· ' + (ADJUST_LABELS[STATE.adjust] || STATE.adjust);
  stopBtn.style.display = (d.monitor && d.monitor.enabled) ? '' : 'none';
  setTimeout(() => nameF.focus(), 0);
}

function hideMonitorInput() {
  const box = document.getElementById('draw-monitor-input');
  if (box) box.style.display = 'none';
}

function saveMonitorInput(d) {
  const nameF = document.getElementById('dmi-name');
  const pctF = document.getElementById('dmi-pct');
  const name = nameF.value.trim();
  // 强制命名: 监控趋势线必须有名称 (推送与列表按名字识别)
  if (!name) { showToast('请输入监控名称 (必填)', { type: 'warn' }); nameF.focus(); return; }
  let pct = parseFloat(pctF.value);
  if (!Number.isFinite(pct) || pct < 0.1 || pct > 20) {
    showToast('跌破幅度须为 0.1-20 之间的数值', { type: 'warn' }); return;
  }
  d.name = name.slice(0, 50);
  d.monitor = { enabled: true, pct, adjust: STATE.adjust };
  hideMonitorInput();
  scheduleSave();
  redrawDrawings();
  showDrawMenu(); // 刷新菜单按钮为「🔔监控中」
  showToast(`🔔 监控已开启: 跌破「${d.name}」${pct}% 即推送`);
}

// ── 修正建议浮框 ──
function positionSuggestBox() {
  const sug = STATE.draw.suggest;
  const box = document.getElementById('draw-suggest');
  if (!sug) { box.style.display = 'none'; return; }
  const ctx = drawCtx();
  if (!ctx) return;
  const P = drawMapper();
  if (!P) return;
  const x = P.x(sug.points[0].i), y = P.y(sug.points[0].p);
  const wrap = document.getElementById('chart-wrap');
  box.style.display = 'flex';
  box.style.left = Math.max(4, Math.min(x + 12, wrap.clientWidth - box.offsetWidth - 4)) + 'px';
  box.style.top = Math.max(4, y - 30) + 'px';
}

function hideSuggestBox() {
  document.getElementById('draw-suggest').style.display = 'none';
}

function adoptSuggest() {
  const dr = STATE.draw;
  const sug = dr.suggest;
  if (!sug) return;
  const d = dr.drawings.find(x => x.id === sug.forId);
  const ctx = drawCtx();
  if (d && ctx) {
    dr.undo.push({ op: 'move', id: d.id, before: JSON.parse(JSON.stringify(d.points)) });
    d.points = sug.points.map(pt => Drawings.pointFromIdx(pt.i, pt.p, ctx.dateMap, ctx.n));
    scheduleSave();
  }
  dr.suggest = null;
  redrawDrawings();
}

// ── 文本标注输入 ──
function openTextInput(info, pt) {
  const box = document.getElementById('draw-text-input');
  const field = document.getElementById('draw-text-field');
  const wrap = document.getElementById('chart-wrap');
  box.style.display = 'block';
  box.style.left = Math.min(info.px + 8, wrap.clientWidth - 180) + 'px';
  box.style.top = Math.max(4, info.py - 14) + 'px';
  field.value = '';
  // mousedown 处理器内同步 focus 仍可能被浏览器默认行为覆盖, 延迟到下一拍再聚焦
  setTimeout(() => field.focus(), 0);
  const commit = () => {
    const text = field.value.trim();
    cleanup();
    if (!text) return;
    const ctx = drawCtx();
    if (!ctx) return;
    const d = Drawings.createDrawing('text', [Drawings.pointFromIdx(pt.idx, pt.price, ctx.dateMap, ctx.n)], { text });
    STATE.draw.drawings.push(d);
    STATE.draw.undo.push({ op: 'add', id: d.id });
    scheduleSave();
    redrawDrawings();
  };
  const cleanup = () => {
    box.style.display = 'none';
    field.removeEventListener('keydown', onKey);
    field.removeEventListener('blur', commit);
  };
  const onKey = (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { cleanup(); }
  };
  field.addEventListener('keydown', onKey);
  field.addEventListener('blur', commit);
}

function onDrawEscape() {
  if (document.getElementById('draw-monitor-input').style.display === 'block') { hideMonitorInput(); return true; }
  const dr = STATE.draw;
  if (dr.draft) { cancelDraft(); return true; }
  if (dr.selectedId) { selectDrawing(null); return true; }
  if (dr.tool !== 'select') { setDrawTool('select'); return true; }
  return false;
}

// ── 服务器同步 ──
async function loadDrawings() {
  const key = STATE.symbol + ':' + STATE.period;
  if (STATE.draw._loadedKey === key) { redrawDrawings(); return; }
  if (STATE.period === 'intraday') return;
  STATE.draw._loadedKey = key;
  try {
    const resp = await fetch(`/api/drawings?symbol=${encodeURIComponent(STATE.symbol)}&period=${encodeURIComponent(STATE.period)}`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (STATE.symbol + ':' + STATE.period !== key) return; // 竞态
    STATE.draw.drawings = (data.drawings || []).map(d => Drawings.normalize(d));
    STATE.draw.undo = [];
    STATE.draw.selectedId = null;
    STATE.draw.suggest = null;
    STATE.draw._autoLines = null;
  } catch (e) { /* 离线/未登录: 画线仅本会话内存态 */ }
  redrawDrawings();
}

let _saveTimer = null;
function scheduleSave() {
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(saveDrawings, 800);
}

async function saveDrawings() {
  if (STATE.period === 'intraday') return;
  try {
    await fetch('/api/drawings', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        symbol: STATE.symbol, period: STATE.period, drawings: STATE.draw.drawings,
      }),
    });
  } catch (e) { /* 静默: 下次编辑再同步 */ }
}

// 修正建议浮框按钮
document.getElementById('ds-adopt').addEventListener('click', adoptSuggest);
document.getElementById('ds-ignore').addEventListener('click', () => { STATE.draw.suggest = null; hideSuggestBox(); });
buildDrawMenu();

// 趋势线监控输入弹层按钮
document.getElementById('dmi-save').addEventListener('click', () => { const d = getSelected(); if (d) saveMonitorInput(d); });
document.getElementById('dmi-cancel').addEventListener('click', hideMonitorInput);
document.getElementById('dmi-stop').addEventListener('click', () => {
  const d = getSelected();
  if (d && d.monitor) {
    d.monitor.enabled = false;
    scheduleSave();
    redrawDrawings();
    showToast('已停止监控「' + (d.name || d.id) + '」');
  }
  hideMonitorInput();
  showDrawMenu(); // 刷新菜单按钮状态
});
document.getElementById('dmi-name').addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter') { ev.preventDefault(); const d = getSelected(); if (d) saveMonitorInput(d); }
  else if (ev.key === 'Escape') hideMonitorInput();
});

// ═══════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initChart();
  initPeriodScroller();

  // Restore saved config (theme, panels, etc.)
  loadConfig();

  // 左侧栏初始显隐 (基本信息 + 五档, 所有周期), 不等首根K线渲染
  showSidePanel(sidePanelOn());
  showDepthSection(depthSecOn());

  // ── 自动主题: 系统偏好 > 时间 ──
  if (STATE._themeAuto) {
    applyTheme(detectSystemTheme());
    // 监听系统主题变化
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onSystemThemeChange);
    }
    // 每30分钟检查时间触发切换 (6:00→亮, 18:00→暗)
    setInterval(() => {
      if (!STATE._themeAuto) return;
      const sys = detectSystemTheme();
      if (sys !== STATE.theme) { applyTheme(sys); saveConfig(); }
    }, 30 * 60 * 1000);
  }

  // Search autocomplete
  const symInput = document.getElementById('symbol-input');
  const dropdown = document.getElementById('search-dropdown');
  let searchTimer = null, activeIdx = -1, searchResults = [];
  let searchSeq = 0, searchController = null, composing = false;
  let searchNotice = '', resultsQuery = '';

  function catalogNotice(catalog) {
    if (!catalog || !Array.isArray(catalog.sources)) return '';
    const date = ts => new Date(ts * 1000).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
    const messages = catalog.sources.map(s => {
      if (s.state === 'unavailable') return `${s.label}目录暂不可用，搜索覆盖不完整。`;
      if (s.state === 'stale') return `${s.label}目录${s.refresh_failed ? '更新暂未成功' : '已过期'}，当前使用 ${date(s.updated_at)} 数据，可能缺少新上市证券。`;
      return '';
    }).filter(Boolean);
    if (!messages.length) {
      const times = catalog.sources.map(s => s.updated_at).filter(Boolean);
      if (times.length) messages.push(`证券目录更新于 ${date(Math.min(...times))}`);
    }
    if (catalog.coverage_note) messages.push(catalog.coverage_note);
    if (catalog.index_ready === false) messages.push('本地搜索索引正在初始化，当前使用兼容搜索。');
    return messages.join(' ');
  }

  function doSearch() {
    const q = symInput.value.trim();
    if (!q || q.length < 1) { closeDropdown(); return; }
    const seq = ++searchSeq;
    if (searchController) searchController.abort();
    searchController = new AbortController();
    searchNotice = '搜索中…';
    renderDropdown();
    fetch(`/api/search?q=${encodeURIComponent(q)}`, { signal: searchController.signal })
      .then(r => {
        if (!r.ok) throw new Error(r.status === 429 ? '请求频繁，请稍后重试。' : '搜索请求失败，请稍后重试。');
        return r.json();
      })
      .then(data => {
        if (seq !== searchSeq || symInput.value.trim() !== q) return;
        searchResults = data.results || [];
        resultsQuery = q;
        searchNotice = [searchResults.length ? '' : '未找到匹配结果，可尝试完整代码。', catalogNotice(data.catalog)].filter(Boolean).join(' ');
        activeIdx = -1;
        renderDropdown();
      }).catch(error => {
        if (seq !== searchSeq || error.name === 'AbortError') return;
        searchNotice = error.message || '搜索请求失败，请稍后重试。';
        renderDropdown();
      });
  }

  function renderDropdown() {
    dropdown.innerHTML = searchResults.map((r, i) => {
      const badge = searchBadge(r)
        ? `<span class="type-badge tb-${badgeType(r)}">${searchBadge(r)}</span>` : '';
      return `<div class="item${i === activeIdx ? ' active' : ''}" data-idx="${i}">
        ${badge}${esc(r.name)}<span class="code">${esc(r.code)}</span>
      </div>`;
    }).join('') + (searchNotice ? `<div class="search-status" role="status">${esc(searchNotice)}</div>` : '');
    dropdown.classList.add('show');
    // Click + hover handlers
    dropdown.querySelectorAll('.item').forEach(el => {
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        selectResult(parseInt(el.dataset.idx));
      });
      el.addEventListener('mouseenter', () => {
        // 只更新 active 状态，不重建 DOM
        dropdown.querySelectorAll('.item').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        activeIdx = parseInt(el.dataset.idx);
      });
    });
  }

  function updateActive() {
    // 就地切换选中项 (不重建 DOM), 并滚动到可视区 —— 长列表按 ↑↓ 不丢滚动位置
    dropdown.querySelectorAll('.item').forEach((el, i) => {
      el.classList.toggle('active', i === activeIdx);
    });
    const cur = dropdown.querySelector('.item.active');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  function closeDropdown() {
    clearTimeout(searchTimer);
    ++searchSeq;
    if (searchController) searchController.abort();
    dropdown.classList.remove('show');
    searchResults = [];
    activeIdx = -1;
  }

  function selectResult(idx) {
    if (idx < 0 || idx >= searchResults.length) return;
    const r = searchResults[idx];
    closeDropdown();
    STATE._lastSearchType = r.type || '';
    switchSymbol(r.symbol);
    loadCurrent(); // 分时/日K 都刷新 基本信息 + 五档
  }

  symInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    ++searchSeq;
    if (searchController) searchController.abort();
    if (!symInput.value.trim()) { closeDropdown(); return; }
    if (composing) return;
    searchTimer = setTimeout(doSearch, 250);
  });
  symInput.addEventListener('compositionstart', () => { composing = true; closeDropdown(); });
  symInput.addEventListener('compositionend', () => {
    composing = false;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 250);
  });
  symInput.addEventListener('focus', () => {
    if (symInput.value.trim() === resultsQuery && searchResults.length) renderDropdown();
  });

  symInput.addEventListener('keydown', (e) => {
    if (composing || e.isComposing) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      activeIdx = Math.min(activeIdx + 1, searchResults.length - 1);
      updateActive();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      activeIdx = Math.max(activeIdx - 1, 0);
      updateActive();
    } else if (e.key === 'Enter') {
      if (dropdown.classList.contains('show') && searchResults.length > 0) {
        e.preventDefault();
        selectResult(Math.max(activeIdx, 0));
      } else {
        refresh();
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  });

  // Click outside to close dropdown
  document.addEventListener('click', (ev) => {
    if (!symInput.contains(ev.target) && !dropdown.contains(ev.target)) {
      closeDropdown();
    }
  });

  // ── 全局快捷键 (输入时失效): / 或 Ctrl+K 聚焦搜索, 1-9 切周期, Esc 关弹层 ──
  const PERIOD_KEYS = { '1': '1d', '2': '1w', '3': '1M', '4': 'intraday', '5': '1m', '6': '5m', '7': '15m', '8': '30m', '9': '60m' };
  document.addEventListener('keydown', (e) => {
    // 文本标注输入中: Esc/Enter 由输入框自身处理, 画线快捷键全部让路
    if (e.target && e.target.id === 'draw-text-field') return;
    if (e.key === 'Escape') {
      if (STATE.draw.enabled && onDrawEscape()) return;
      closeDropdown(); return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      symInput.focus();
      symInput.select();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && STATE.draw.enabled) {
      e.preventDefault();
      drawUndo();
      return;
    }
    const tag = (e.target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (deleteSelectedDrawing()) e.preventDefault();
      return;
    }
    if (e.key === 'Enter' && STATE.draw.enabled && STATE.draw.draft && STATE.draw.draft.tool === 'poly') {
      finishPolyDraft();
      return;
    }
    if (e.key === '/') {
      e.preventDefault();
      symInput.focus();
      symInput.select();
    } else if (PERIOD_KEYS[e.key]) {
      switchPeriod(PERIOD_KEYS[e.key]);
    }
  });

  // Restore last search from history (本地) + 与账号同步
  renderHistoryTags();
  const hist = loadHistory();
  if (hist.length > 0) {
    const last = hist[0];
    document.getElementById('symbol-input').value = last.symbol;
    STATE.symbol = last.symbol;
  }

  // 支持从交易记录/监控中心跳转 ?symbol=000001.SZ 自动加载 (URL 参数优先于历史恢复);
  // 趋势线监控还带 ?period=1w|1M, 定位到被监控的那个周期 (画线按 代码+周期 分库)
  const bootParams = new URLSearchParams(location.search);
  const jumpSymbol = bootParams.get('symbol');
  if (jumpSymbol) {
    document.getElementById('symbol-input').value = jumpSymbol;
    STATE.symbol = jumpSymbol;
    // URL 参数在首个面板初始化请求之后才解析；此处必须立即为当前标的
    // 重置盘口流，否则首屏只会请求默认的 000001.SH。
    if (depthSecOn()) fetchDepth();
  }
  const jumpPeriod = bootParams.get('period');
  if (jumpPeriod && ALL_PERIODS.includes(jumpPeriod)) applyPeriodUI(jumpPeriod);
  syncSymbolUrl(true); // 规范化入口 URL, 浏览器返回键可回溯历史股票

  // 浏览器返回/前进: 回到上一只/下一只股票 (对标 TradingView), 周期同样跟随
  window.addEventListener('popstate', () => {
    const params = new URLSearchParams(location.search);
    const s = params.get('symbol');
    const per = params.get('period');
    const nextPeriod = (per && ALL_PERIODS.includes(per)) ? per : '1d';
    const symbolChanged = !!s && s !== STATE.symbol;
    const periodChanged = nextPeriod !== STATE.period;
    if (!symbolChanged && !periodChanged) return;
    if (symbolChanged) {
      STATE.symbol = s;
      document.getElementById('symbol-input').value = s;
      applyPeriodUI(nextPeriod);
      loadCurrent();
    } else {
      switchPeriod(nextPeriod);
    }
  });

  // 点击代码复制 (便捷性: 分享/输入时一键取码); 代码在股吧链接内, 必须阻止跳转。
  // 键盘可达: 单独可聚焦 + Enter/Space 也能复制 (触屏/无鼠标场景才有等价入口)。
  const codeEl = document.getElementById('info-code');
  const copyCode = () => {
    if (!STATE.symbol) return;
    navigator.clipboard?.writeText(STATE.symbol)
      .then(() => showToast('已复制 ' + STATE.symbol))
      .catch(() => {});
  };
  codeEl.style.cursor = 'pointer';
  codeEl.title = '点击复制代码';
  codeEl.tabIndex = 0;
  codeEl.setAttribute('role', 'button');
  codeEl.addEventListener('click', (ev) => {
    ev.preventDefault();      // 否则点代码会连带触发外层 <a> 跳股吧
    ev.stopPropagation();
    copyCode();
  });
  codeEl.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    ev.preventDefault();
    ev.stopPropagation();
    copyCode();
  });

  // 「持仓中」徽章: 悬停看明细 (桌面), 点一下弹 toast (触屏无 hover, 也能看到风控价)
  const holdEl = document.getElementById('info-holding');
  if (holdEl) {
    holdEl.style.cursor = 'pointer';
    holdEl.addEventListener('click', () => {
      const tip = holdingTip(STATE.position);
      if (tip) showToast(tip);
    });
  }

  // First load: 面板设置 + 搜索历史并行与服务端对齐, 再拉 K 线 (清站点数据/换设备可恢复);
  // 3s 超时兜底, 服务端慢时不阻塞首屏
  const container = document.getElementById('chart-container');
  let initDone = false;
  const initRender = () => { if (!initDone) { initDone = true; refresh(); } };
  const scheduleInit = () => {
    if (container.clientHeight > 0) {
      requestAnimationFrame(() => requestAnimationFrame(initRender));
    } else {
      const ro = new ResizeObserver(() => { if (container.clientHeight > 0) { ro.disconnect(); initRender(); } });
      ro.observe(container);
    }
  };
  let panelCfgApplied = false;
  const bootSync = Promise.all([
    syncHistoryWithServer(),
    syncPanelConfigWithServer().then(applied => { panelCfgApplied = applied; }),
  ]);
  const bootReady = () => Promise.race([bootSync, new Promise(r => setTimeout(r, 3000))]);
  // 超时兜底: 首屏已渲染后服务端配置才到达 → 重绘一次应用新配置
  bootSync.then(() => { if (panelCfgApplied && initDone) { syncPosition(); onIndicatorChange(); } });
  if (!hist.length && !jumpSymbol) {
    bootReady().then(() => {
      const synced = loadHistory();
      if (synced.length > 0) {
        document.getElementById('symbol-input').value = synced[0].symbol;
        STATE.symbol = synced[0].symbol;
        syncSymbolUrl(true);
      }
      scheduleInit();
    }).catch(scheduleInit);
  } else {
    bootReady().then(scheduleInit, scheduleInit);
  }


  // 时间 1s 刷新
  setInterval(() => {
    document.getElementById('info-time').textContent = new Date().toLocaleTimeString();
  }, 1000);

  // 盘中自动刷新: 快照 / 分时 / 分钟K 分开间隔; 午休、周末、节假日不拉
  STATE._lastQuoteAt = 0;
  STATE._lastBarAt = 0;
  STATE._lastBarPatchDrawAt = 0;
  syncSessionFlag();
  setInterval(syncSessionFlag, 60e3);

  // 选股后台扫描状态: 每 10s 轻量轮询, 运行中入口脉冲 + 进度
  async function refreshScreenerBadge() {
    if (document.hidden) return;
    try {
      const s = await api("/api/screener/status");
      const btn = document.getElementById("screener-entry");
      if (!btn) return;
      if (s.running) {
        const pct = s.total ? Math.round((s.progress || 0) / s.total * 100) : 0;
        btn.classList.add("scanning");
        btn.innerHTML = `🎯 ${pct}%`;
        btn.title = `选股扫描中 ${s.progress || 0}/${s.total} (后台运行, 关页不中断)`;
        STATE._scanWasRunning = true;
      } else if (STATE._scanWasRunning) {
        STATE._scanWasRunning = false;
        btn.classList.remove("scanning");
        btn.innerHTML = "🎯 选股";
        btn.title = "条件选股: MACD金叉/MA20/筹码获利等";
        showToast(`选股扫描完成: 命中 ${(s.results || []).length} 只`);
      }
    } catch (e) { /* ignore */ }
  }
  refreshScreenerBadge();
  setInterval(refreshScreenerBadge, 10e3);

  setInterval(() => {
    if (!canAutoRefresh()) return;
    const now = Date.now();
    ensureQuoteStream();
    if (STATE.period === 'intraday') {
      if (now - (STATE._lastBarAt || 0) >= INTRADAY_REFRESH_MS) fetchIntraday();
    } else if (MINUTE_PERIODS.includes(STATE.period)) {
      const iv = MINUTE_REFRESH_MS[STATE.period] || 60e3;
      if (now - (STATE._lastBarAt || 0) >= iv) fetchData({ silent: true });
    }
    // 筹码分布: 盘中约 60s 重取一次; 成本分布不按 1.25s 快照逐笔重算
    if (isChipPeriod(STATE.period) && document.getElementById('chk-chip').checked
        && now - (STATE._lastChipsAt || 0) >= 60e3) {
      STATE._lastChipsAt = now;
      fetchChips(STATE.symbol);
    }
    // 基本信息: 盘中约 60s 刷新 (后端 60s 缓存); 成交额/换手/量比随行情变化
    if (infoPanelOn() && now - (STATE._lastInfoAt || 0) >= 60e3) {
      STATE._lastInfoAt = now;
      fetchStockInfo();
    }
  }, 1000);
});
</script>
</body>
</html>
